[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-kit"
version = "0.2.0"
description = "Prism CLI for guided multi-platform project generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6,<7",
  "copier>=9,<10",
  "jinja2-time>=0.2,<1",
]

[project.scripts]
prism = "prism_cli.cli:main"

[tool.setuptools]
packages = ["prism_cli"]
include-package-data = false

[tool.setuptools.package-data]
prism_cli = ["assets/*", "schemas/*.json"]
