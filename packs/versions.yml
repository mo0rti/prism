# The one place that pins versions. Every pack reads its stack's baseline through Copier as `versions`,
# so a release moves a baseline here and nowhere else. A test fails when a pack file repeats a version
# pinned here instead of reading it.
spring-backend:
  java: "21"
  kotlin: "2.2.0"
  spring_boot: "4.0.1"
  spring_dependency_management: "1.1.7"
  gradle: "8.14.3"
nextjs-web:
  node: "22"
  next: "16.4.0"
  react: "19.3.0"
  typescript: "5.9.3"
  eslint: "9.39.5"
  eslint_config_next: "16.4.0"
  openapi_typescript: "7.13.0"
  openapi_fetch: "0.17.0"
  vitest: "5.0.3"
  vite: "8.3.3"
  vitejs_plugin_react: "6.1.2"
  jsdom: "28.1.0"
  testing_library_react: "16.3.3"
  testing_library_dom: "10.4.2"
  testing_library_jest_dom: "7.0.1"
  types_node: "22.20.5"
  types_react: "19.3.0"
  types_react_dom: "19.3.0"
