# The one place that pins versions. Every pack reads its stack's baseline through Copier as `versions`,
# so a release moves a baseline here and nowhere else. A test fails when a pack file repeats a version
# pinned here instead of reading it. The repository's workflows read the toolchain pins from here too
# (scripts/read-pins.py), so they never hard-code one.
#
# A `# renovate:` line above a pin lets the dependency bot propose its update (renovate.json); the pull
# request then carries the regenerated lockfiles and golden/ (scripts/sync-golden.py). A pin without
# one is a baseline decision that moves by hand with a release: a toolchain version, a platform level
# or the database image.
spring-backend:
  java: "21"
  # renovate: datasource=maven depName=org.jetbrains.kotlin:kotlin-gradle-plugin depType=spring-backend
  kotlin: "2.2.0"
  # renovate: datasource=maven depName=org.springframework.boot:spring-boot-gradle-plugin depType=spring-backend
  spring_boot: "4.0.1"
  # renovate: datasource=maven depName=io.spring.gradle:dependency-management-plugin depType=spring-backend
  spring_dependency_management: "1.1.7"
  # renovate: datasource=gradle-version depName=gradle depType=spring-backend
  gradle: "8.14.3"
  # renovate: datasource=maven depName=io.mockk:mockk depType=spring-backend
  mockk: "1.14.5"
  postgres: "16-alpine"
