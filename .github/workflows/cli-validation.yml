name: CLI Validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cli-validation.yml"
      - "MANIFEST.in"
      - "copier.yml"
      - "pyproject.toml"
      - "npm/**"
      - "prism_cli/**"
      - "tests/**"
      - "template/**"
      - "scripts/**"
      - "docs/wiki-visualization-demo.mmd"
  pull_request:
    paths:
      - ".github/workflows/cli-validation.yml"
      - "MANIFEST.in"
      - "copier.yml"
      - "pyproject.toml"
      - "npm/**"
      - "prism_cli/**"
      - "tests/**"
      - "template/**"
      - "scripts/**"
      - "docs/wiki-visualization-demo.mmd"

permissions:
  contents: read

jobs:
  tests:
    name: Python tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . jsonschema

      - name: Run Python tests
        run: python -m unittest discover -s tests

  wheel:
    name: Build and inspect wheel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build twine "readme-renderer[md]"
          python -m build --sdist --wheel --outdir dist
          python -m twine check --strict dist/*

      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/prism-wheel-env"
          "$RUNNER_TEMP/prism-wheel-env/bin/python" -m pip install dist/prism_kit-0.4.0-py3-none-any.whl

      - name: Validate installed package and package data
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/prism-wheel-env/bin/python" - <<'PY'
          import importlib.metadata
          from importlib import resources

          from prism_cli import __version__
          from prism_cli.cli import DEFAULT_TEMPLATE_URL, default_template_reference

          assert importlib.metadata.version("prism-kit") == "0.4.0"
          assert __version__ == "0.4.0"
          assert default_template_reference() == DEFAULT_TEMPLATE_URL
          assert resources.files("prism_cli").joinpath("assets", "graph_template.html").is_file()
          assert resources.files("prism_cli").joinpath("assets", "force-graph.LICENSE.txt").is_file()
          assert resources.files("prism_cli").joinpath("schemas", "status-v1.json").is_file()
          PY
          "$RUNNER_TEMP/prism-wheel-env/bin/prism" --version

      - name: Exercise installed CLI generation and updates
        run: '"$RUNNER_TEMP/prism-wheel-env/bin/python" scripts/check-installed-cli.py --python "$RUNNER_TEMP/prism-wheel-env/bin/python" --template "$GITHUB_WORKSPACE"'

  browser-e2e:
    name: Browser e2e (ubuntu-latest, 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and browser test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[e2e]" jsonschema

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser tests
        env:
          PRISM_BROWSER_E2E: "1"
          PRISM_BROWSER_E2E_DIR: ${{ runner.temp }}/prism-browser-e2e
        run: |
          set -o pipefail
          mkdir -p "$PRISM_BROWSER_E2E_DIR"
          python -B -m unittest discover -s tests/browser -t . 2>&1 | tee "$RUNNER_TEMP/prism-browser-e2e.log"

      - name: Require that browser tests ran
        run: |
          ran=$(sed -nE 's/^Ran ([0-9]+) tests? in .*/\1/p' "$RUNNER_TEMP/prism-browser-e2e.log" | tail -n 1)
          skipped=$(sed -nE 's/^(OK|FAILED) .*skipped=([0-9]+).*/\2/p' "$RUNNER_TEMP/prism-browser-e2e.log" | tail -n 1)
          ran=${ran:-0}
          skipped=${skipped:-0}
          echo "Browser tests ran: $ran, skipped: $skipped"
          if [ "$ran" -eq 0 ]; then
            echo "::error::The browser test run reported 0 tests."
            exit 1
          fi
          if [ "$skipped" -ge "$ran" ]; then
            echo "::error::All browser tests were skipped; check PRISM_BROWSER_E2E and the e2e extra."
            exit 1
          fi

      - name: Upload browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prism-browser-e2e-artifacts
          path: ${{ runner.temp }}/prism-browser-e2e/artifacts
          retention-days: 14
          if-no-files-found: warn

  npm-launcher:
    name: npm launcher (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["24"]
        include:
          - os: ubuntu-latest
            node-version: "22"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the launcher tests, including the real uv download
        working-directory: npm
        env:
          PRISM_LAUNCHER_NETWORK_TEST: "1"
        run: npm test

      - name: Build a wheel from the tree
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/wheel"

      - name: Pack the launcher
        working-directory: npm
        run: |
          mkdir -p "$RUNNER_TEMP/npm-pack"
          npm pack --pack-destination "$RUNNER_TEMP/npm-pack"
          ls -l "$RUNNER_TEMP/npm-pack"

      - name: Install the packed launcher globally
        run: |
          npm install --global "$RUNNER_TEMP"/npm-pack/mortitech-prism-*.tgz
          command -v prism

      - name: Run prism through the launcher against the local wheel
        run: |
          set -eu
          # Test-only override: uv installs the wheel built above instead of prism-kit from PyPI.
          export PRISM_PACKAGE_SPEC="$(ls "$RUNNER_TEMP"/wheel/prism_kit-*.whl)"
          expected="prism $(node -p "require('./npm/package.json').version")"
          actual="$(prism --version)"
          echo "$actual"
          test "$actual" = "$expected"
          set +e
          prism --no-such-option > /dev/null 2>&1
          code=$?
          set -e
          echo "Exit code for an unknown option: $code"
          test "$code" -eq 2
