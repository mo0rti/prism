name: CLI Validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cli-validation.yml"
      - "MANIFEST.in"
      - "copier.yml"
      - "pyproject.toml"
      - "prism_cli/**"
      - "tests/**"
      - "template/**"
      - "scripts/**"
      - "docs/wiki-visualization-demo.mmd"
  pull_request:
    paths:
      - ".github/workflows/cli-validation.yml"
      - "MANIFEST.in"
      - "copier.yml"
      - "pyproject.toml"
      - "prism_cli/**"
      - "tests/**"
      - "template/**"
      - "scripts/**"
      - "docs/wiki-visualization-demo.mmd"

permissions:
  contents: read

jobs:
  tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . jsonschema

      - name: Run Python tests
        run: python -m unittest discover -s tests

  wheel:
    name: Build and inspect wheel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist --wheel --outdir dist
          python -m twine check dist/*

      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/prism-wheel-env"
          "$RUNNER_TEMP/prism-wheel-env/bin/python" -m pip install dist/prism_kit-0.2.0-py3-none-any.whl

      - name: Validate installed package and package data
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/prism-wheel-env/bin/python" - <<'PY'
          import importlib.metadata
          from importlib import resources

          from prism_cli import __version__
          from prism_cli.cli import DEFAULT_TEMPLATE_URL, default_template_reference

          assert importlib.metadata.version("prism-kit") == "0.2.0"
          assert __version__ == "0.2.0"
          assert default_template_reference() == DEFAULT_TEMPLATE_URL
          assert resources.files("prism_cli").joinpath("assets", "graph_template.html").is_file()
          assert resources.files("prism_cli").joinpath("schemas", "status-v1.json").is_file()
          PY
          "$RUNNER_TEMP/prism-wheel-env/bin/prism" --version
