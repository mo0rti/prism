name: Template Validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/template-validation.yml"
      - "copier.yml"
      - "scripts/validate-template.ps1"
      - "scripts/check-web-auth.mjs"
      - "prism_cli/**"
      - "template/**"
  pull_request:
    paths:
      - ".github/workflows/template-validation.yml"
      - "copier.yml"
      - "scripts/validate-template.ps1"
      - "scripts/check-web-auth.mjs"
      - "prism_cli/**"
      - "template/**"

jobs:
  contract-validation:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Copier
        run: python -m pip install --upgrade pip copier jinja2-time

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run Contract Validation
        shell: pwsh
        run: ./scripts/validate-template.ps1 -Mode contract

  backend-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Copier
        run: python -m pip install --upgrade pip copier jinja2-time

      - name: Run Backend Smoke Validation
        shell: pwsh
        run: ./scripts/validate-template.ps1 -Mode backend-smoke

  web-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Copier
        run: python -m pip install --upgrade pip copier jinja2-time

      - name: Generate Web Validation Sample
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/prism-web-validation"
          rm -rf "$TARGET"
          copier copy --trust --defaults --vcs-ref HEAD \
            --data "project_name=Review Web" \
            --data "platforms=[backend, web-user-app, web-admin-portal]" \
            --data "auth_methods=[google, apple, facebook, microsoft, password]" \
            . "$TARGET"
          echo "PRISM_WEB_TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Run Web Smoke Tests
        shell: bash
        run: |
          set -euo pipefail
          for app in web-user-app web-admin-portal; do
            echo "Running web smoke tests for $app"
            pushd "$PRISM_WEB_TARGET/$app" >/dev/null
            npm install
            npm run lint
            npm run typecheck
            node "$GITHUB_WORKSPACE/scripts/check-web-auth.mjs" "$PRISM_WEB_TARGET/$app"
            npm run build
            npm run build:cloudflare
            npx wrangler deploy --dry-run
            popd >/dev/null
          done

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list names the retired `tools` package. These are what the
          # generated project compiles against: the platform of its compileSdk and the build
          # tools of its Android Gradle Plugin.
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Install Copier
        run: python -m pip install --upgrade pip copier jinja2-time

      - name: Generate Android Validation Sample
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/prism-android-validation"
          rm -rf "$TARGET"
          copier copy --trust --defaults --vcs-ref HEAD \
            --data "project_name=Review Android" \
            --data "platforms=[backend, mobile-android]" \
            . "$TARGET"
          echo "PRISM_ANDROID_TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Test, Assemble and Lint Android
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRISM_ANDROID_TARGET/mobile-android"
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug lintDebug

  ios-build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Copier and XcodeGen
        run: |
          python -m pip install --upgrade pip copier jinja2-time
          brew install xcodegen

      - name: Generate iOS Validation Sample
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/prism-ios-validation"
          rm -rf "$TARGET"
          copier copy --trust --defaults --vcs-ref HEAD \
            --data "project_name=Review App" \
            --data "platforms=[backend, mobile-ios]" \
            . "$TARGET"
          # Commit the sample and clone it, so git-ignored files such as the local xcconfigs are absent,
          # as they are on a fresh checkout in CI.
          git -C "$TARGET" init -q
          git -C "$TARGET" add -A
          git -C "$TARGET" -c user.name=prism-validation -c user.email=prism-validation@example.invalid commit -q -m "Generated sample"
          CLONE="$RUNNER_TEMP/prism-ios-clone"
          rm -rf "$CLONE"
          # --no-local copies objects through git's transport instead of sharing the source's files,
          # which avoids an intermittent "unable to read tree" on the runner.
          git -C "$TARGET" fsck --no-progress
          git clone -q --no-local "$TARGET" "$CLONE"
          echo "PRISM_IOS_TARGET=$CLONE" >> "$GITHUB_ENV"

      - name: Create local xcconfig files
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRISM_IOS_TARGET/mobile-ios"
          test ! -e Config/Debug.xcconfig
          test ! -e Config/Release.xcconfig
          cp Config/Debug.xcconfig.example Config/Debug.xcconfig
          cp Config/Release.xcconfig.example Config/Release.xcconfig

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRISM_IOS_TARGET/mobile-ios"
          xcodegen generate

      - name: Select iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available | grep -E '^ +iPhone ' | grep -Eo '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}' | tail -n 1)
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator $SIMULATOR_ID"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Build iOS app
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRISM_IOS_TARGET/mobile-ios"
          xcodebuild build \
            -project "Review App.xcodeproj" \
            -scheme "ReviewApp" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -configuration Debug \
            -derivedDataPath build/DerivedData

      - name: Check built API base URL
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRISM_IOS_TARGET/mobile-ios"
          PLIST=$(find build/DerivedData/Build/Products -path '*/ReviewApp.app/Info.plist' | head -n 1)
          test -n "$PLIST"
          BASE_URL=$(/usr/libexec/PlistBuddy -c "Print :API_BASE_URL" "$PLIST")
          echo "API_BASE_URL in the built app: $BASE_URL"
          test "$BASE_URL" = "http://localhost:8080/api/v1"

      - name: Test iOS app
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRISM_IOS_TARGET/mobile-ios"
          xcodebuild test \
            -project "Review App.xcodeproj" \
            -scheme "ReviewApp" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation-test-results
          path: ${{ env.PRISM_IOS_TARGET }}/mobile-ios/build/TestResults.xcresult
          if-no-files-found: ignore
