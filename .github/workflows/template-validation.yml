name: Template Validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/template-validation.yml"
      - ".gitattributes"
      - "copier.yml"
      - "scripts/validate-template.ps1"
      - "prism_cli/**"
      - "template/**"
      - "packs/**"
      - "template-skills/**"
      - "scripts/build-skill-layers.py"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/template-validation.yml"
      - ".gitattributes"
      - "copier.yml"
      - "scripts/validate-template.ps1"
      - "prism_cli/**"
      - "template/**"
      - "packs/**"
      - "template-skills/**"
      - "scripts/build-skill-layers.py"

jobs:
  contract-validation:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Prism
        run: python -m pip install --upgrade pip .

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run Contract Validation
        shell: pwsh
        run: ./scripts/validate-template.ps1 -Mode contract

  backend-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Prism
        run: python -m pip install --upgrade pip .

      - name: Run Backend Smoke Validation
        shell: pwsh
        run: ./scripts/validate-template.ps1 -Mode backend-smoke

  web-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Prism
        run: python -m pip install --upgrade pip .

      - name: Generate Web Validation Sample
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/prism-web-validation"
          rm -rf "$TARGET"
          cat > "$RUNNER_TEMP/web-answers.yml" <<'YAML'
          schema_version: 1
          answers:
            project_name: Review Web
            apps:
              - {id: backend, stack: spring-backend, name: Spring Boot Backend}
              - {id: web, stack: nextjs-web, name: Web App, audience: B2C}
              - {id: admin, stack: nextjs-web, name: Admin App, audience: internal}
          YAML
          python -m prism_cli new --answers "$RUNNER_TEMP/web-answers.yml" --dest "$TARGET" --yes
          echo "PRISM_WEB_TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Run Web Smoke Tests
        shell: bash
        run: |
          set -euo pipefail
          for app in web admin; do
            echo "Running web smoke tests for $app"
            pushd "$PRISM_WEB_TARGET/$app" >/dev/null
            npm ci
            npm run lint
            npm run typecheck
            npm test
            npm run build
            popd >/dev/null
          done

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list names the retired `tools` package. These are what the
          # generated project compiles against: the platform of its compileSdk and the build
          # tools of its Android Gradle Plugin.
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Install Prism
        run: python -m pip install --upgrade pip .

      - name: Generate Android Validation Sample
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/prism-android-validation"
          rm -rf "$TARGET"
          cat > "$RUNNER_TEMP/android-answers.yml" <<'YAML'
          schema_version: 1
          answers:
            project_name: Review Android
            apps:
              - {id: backend, stack: spring-backend, name: Spring Boot Backend}
              - {id: mobile-android, stack: android-compose, name: Android (Kotlin/Compose)}
          YAML
          python -m prism_cli new --answers "$RUNNER_TEMP/android-answers.yml" --dest "$TARGET" --yes
          echo "PRISM_ANDROID_TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Test, Assemble and Lint Android
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRISM_ANDROID_TARGET/mobile-android"
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug lintDebug

  ios-build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Prism and XcodeGen
        run: |
          python -m pip install --upgrade pip .
          brew install xcodegen

      - name: Generate iOS Validation Sample (two iOS apps)
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/prism-ios-validation"
          rm -rf "$TARGET"
          cat > "$RUNNER_TEMP/ios-answers.yml" <<'YAML'
          schema_version: 1
          answers:
            project_name: Review App
            apps:
              - {id: backend, stack: spring-backend, name: Spring Boot Backend}
              - {id: mobile-ios, stack: ios-swiftui, name: iOS (Swift/SwiftUI)}
              - {id: partner-ios, stack: ios-swiftui, name: Partner App, path: apps/partner-ios}
          YAML
          python -m prism_cli new --answers "$RUNNER_TEMP/ios-answers.yml" --dest "$TARGET" --yes
          # Commit the sample and clone it, so only the generated, tracked state is built, as on a fresh checkout in CI.
          git -C "$TARGET" init -q
          git -C "$TARGET" add -A
          git -C "$TARGET" -c user.name=prism-validation -c user.email=prism-validation@example.invalid commit -q -m "Generated sample"
          CLONE="$RUNNER_TEMP/prism-ios-clone"
          rm -rf "$CLONE"
          # --no-local copies objects through git's transport instead of sharing the source's files,
          # which avoids an intermittent "unable to read tree" on the runner.
          git -C "$TARGET" fsck --no-progress
          git clone -q --no-local "$TARGET" "$CLONE"
          echo "PRISM_IOS_TARGET=$CLONE" >> "$GITHUB_ENV"

      - name: Generate Xcode projects
        shell: bash
        run: |
          set -euo pipefail
          for app in mobile-ios apps/partner-ios; do
            (cd "$PRISM_IOS_TARGET/$app" && xcodegen generate)
          done

      - name: Select iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available | grep -E '^ +iPhone ' | grep -Eo '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}' | tail -n 1)
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator $SIMULATOR_ID"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Build iOS apps
        shell: bash
        run: |
          set -euo pipefail
          for pair in "mobile-ios:MobileIos" "apps/partner-ios:PartnerIos"; do
            app="${pair%%:*}"
            module="${pair##*:}"
            echo "Building $app"
            (cd "$PRISM_IOS_TARGET/$app" && xcodebuild build \
              -project "$module.xcodeproj" \
              -scheme "$module" \
              -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
              -configuration Debug \
              -derivedDataPath build/DerivedData)
          done

      - name: Check built API base URL
        shell: bash
        run: |
          set -euo pipefail
          for pair in "mobile-ios:MobileIos" "apps/partner-ios:PartnerIos"; do
            app="${pair%%:*}"
            module="${pair##*:}"
            PLIST=$(find "$PRISM_IOS_TARGET/$app/build/DerivedData/Build/Products" -path "*/$module.app/Info.plist" | head -n 1)
            test -n "$PLIST"
            BASE_URL=$(/usr/libexec/PlistBuddy -c "Print :API_BASE_URL" "$PLIST")
            echo "API_BASE_URL in the built $app: $BASE_URL"
            test "$BASE_URL" = "http://localhost:8080"
          done

      - name: Test iOS apps
        shell: bash
        run: |
          set -euo pipefail
          for pair in "mobile-ios:MobileIos" "apps/partner-ios:PartnerIos"; do
            app="${pair%%:*}"
            module="${pair##*:}"
            echo "Testing $app"
            (cd "$PRISM_IOS_TARGET/$app" && xcodebuild test \
              -project "$module.xcodeproj" \
              -scheme "$module" \
              -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
              -derivedDataPath build/DerivedData \
              -resultBundlePath build/TestResults.xcresult)
          done

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation-test-results
          path: |
            ${{ env.PRISM_IOS_TARGET }}/mobile-ios/build/TestResults.xcresult
            ${{ env.PRISM_IOS_TARGET }}/apps/partner-ios/build/TestResults.xcresult
          if-no-files-found: ignore
