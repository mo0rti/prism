name: Template Validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/template-validation.yml"
      - ".gitattributes"
      - "copier.yml"
      - "scripts/validate-template.ps1"
      - "prism_cli/**"
      - "template/**"
      - "packs/**"
      - "template-skills/**"
      - "scripts/build-skill-layers.py"
      - "golden/**"
      - "scripts/build-golden.py"
      - "scripts/golden-answers.yml"
      - "scripts/run-golden-workflow.py"
      - "scripts/read-pins.py"
      - "scripts/audit-gate.py"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/template-validation.yml"
      - ".gitattributes"
      - "copier.yml"
      - "scripts/validate-template.ps1"
      - "prism_cli/**"
      - "template/**"
      - "packs/**"
      - "template-skills/**"
      - "scripts/build-skill-layers.py"
      - "golden/**"
      - "scripts/build-golden.py"
      - "scripts/golden-answers.yml"
      - "scripts/run-golden-workflow.py"
      - "scripts/read-pins.py"
      - "scripts/audit-gate.py"

jobs:
  contract-validation:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Prism
        run: python -m pip install --upgrade pip .

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run Contract Validation
        shell: pwsh
        run: ./scripts/validate-template.ps1 -Mode contract

  golden-current:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Prism
        run: python -m pip install --upgrade pip .

      # golden/ is what `prism new` generates from scripts/golden-answers.yml. A change of a pack, of the
      # workspace layer or of packs/versions.yml that does not refresh it fails here.
      - name: Check that golden/ is current
        run: python scripts/build-golden.py --check

  backend-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Prism
        run: python -m pip install --upgrade pip .

      # The toolchain versions come from packs/versions.yml; no workflow repeats one.
      - name: Read the pinned versions
        id: pins
        run: python scripts/read-pins.py spring-backend >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.pins.outputs.java }}

      - name: Run Backend Smoke Validation
        shell: pwsh
        run: ./scripts/validate-template.ps1 -Mode backend-smoke

      # The committed golden backend runs its own generated workflow: the Gradle build and every test.
      - name: Golden backend CI
        run: python scripts/run-golden-workflow.py backend

  web-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Prism
        run: python -m pip install --upgrade pip .

      - name: Read the pinned versions
        id: pins
        run: python scripts/read-pins.py nextjs-web >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.pins.outputs.node }}

      - name: Generate Web Validation Sample
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/prism-web-validation"
          rm -rf "$TARGET"
          cat > "$RUNNER_TEMP/web-answers.yml" <<'YAML'
          schema_version: 1
          answers:
            project_name: Review Web
            apps:
              - {id: backend, stack: spring-backend, name: Spring Boot Backend}
              - {id: web, stack: nextjs-web, name: Web App, audience: B2C}
              - {id: admin, stack: nextjs-web, name: Admin App, audience: internal}
          YAML
          python -m prism_cli new --answers "$RUNNER_TEMP/web-answers.yml" --dest "$TARGET" --yes
          echo "PRISM_WEB_TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Run Web Smoke Tests
        shell: bash
        run: |
          set -euo pipefail
          for app in web admin; do
            echo "Running web smoke tests for $app"
            pushd "$PRISM_WEB_TARGET/$app" >/dev/null
            npm ci
            npm run lint
            npm run typecheck
            npm test
            npm run build
            popd >/dev/null
          done

      # The committed golden web app runs its own generated workflow.
      - name: Golden web CI
        run: python scripts/run-golden-workflow.py web

      # A new advisory of high or critical severity in the locked tree fails here. packs/audit-allowlist.yml
      # lists the ones that have no fixed version, each with its advisory link and reason.
      - name: Audit the web dependencies
        run: python scripts/audit-gate.py npm golden/web --stack nextjs-web

  agent-service:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Prism
        run: python -m pip install --upgrade pip .

      # The uv and Python versions of the generated service are the ones packs/versions.yml pins.
      - name: Read the pinned versions
        id: pins
        run: python scripts/read-pins.py python-agent-service >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ steps.pins.outputs.uv }}
          python-version: ${{ steps.pins.outputs.python }}

      - name: Generate a backend and an agent service
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/prism-agent-validation"
          rm -rf "$TARGET"
          cat > "$RUNNER_TEMP/agent-answers.yml" <<'YAML'
          schema_version: 1
          answers:
            project_name: Review Agent
            apps:
              - {id: backend, stack: spring-backend, name: Spring Boot Backend}
              - {id: agent-service, stack: python-agent-service, name: Portfolio Assistant}
          YAML
          python -m prism_cli new --answers "$RUNNER_TEMP/agent-answers.yml" --dest "$TARGET" --yes
          echo "PRISM_AGENT_TARGET=$TARGET" >> "$GITHUB_ENV"

      # The same steps as the app's own workflow. No network, no API key and no production credential:
      # the tests and the evaluation run the fake provider, and the lock must agree with pyproject.toml.
      - name: Install the locked dependencies
        working-directory: ${{ env.PRISM_AGENT_TARGET }}/agent-service
        run: uv sync --locked

      - name: Lint
        working-directory: ${{ env.PRISM_AGENT_TARGET }}/agent-service
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Typecheck
        working-directory: ${{ env.PRISM_AGENT_TARGET }}/agent-service
        run: uv run --locked mypy

      - name: Test
        working-directory: ${{ env.PRISM_AGENT_TARGET }}/agent-service
        run: uv run --locked pytest

      - name: Evaluate with the fake provider
        working-directory: ${{ env.PRISM_AGENT_TARGET }}/agent-service
        run: uv run --locked python -m evals.run --provider fake

      # The committed golden agent service runs its own generated workflow.
      - name: Golden agent service CI
        run: python scripts/run-golden-workflow.py agent-service

      # A new advisory in the locked tree fails here (packs/audit-allowlist.yml lists the accepted ones).
      - name: Audit the agent service dependencies
        run: python scripts/audit-gate.py uv golden/agent-service --stack python-agent-service

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Prism
        run: python -m pip install --upgrade pip .

      # The JDK, the SDK platform and the build tools are the ones packs/versions.yml pins for the stack.
      - name: Read the pinned versions
        id: pins
        run: python scripts/read-pins.py android-compose >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.pins.outputs.jdk }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list names the retired `tools` package. These are what the generated
          # project compiles against: the platform of its compileSdk and the build tools of its Android Gradle Plugin.
          packages: ${{ steps.pins.outputs.android_packages }}

      - name: Generate Android Validation Sample
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/prism-android-validation"
          rm -rf "$TARGET"
          cat > "$RUNNER_TEMP/android-answers.yml" <<'YAML'
          schema_version: 1
          answers:
            project_name: Review Android
            apps:
              - {id: backend, stack: spring-backend, name: Spring Boot Backend}
              - {id: mobile-android, stack: android-compose, name: Customer App}
              - {id: partner-android, stack: android-compose, name: Partner App, path: apps/partner}
          YAML
          python -m prism_cli new --answers "$RUNNER_TEMP/android-answers.yml" --dest "$TARGET" --yes
          echo "PRISM_ANDROID_TARGET=$TARGET" >> "$GITHUB_ENV"

      # The same steps as the app's own workflow, for both Android apps of the workspace.
      - name: Build the Debug APK and Run the Unit Tests
        shell: bash
        run: |
          set -euo pipefail
          for app in mobile-android apps/partner; do
            echo "Building and testing $app"
            pushd "$PRISM_ANDROID_TARGET/$app" >/dev/null
            chmod +x gradlew
            ./gradlew assembleDebug testDebugUnitTest
            test -f app/build/outputs/apk/debug/app-debug.apk
            popd >/dev/null
          done

      # The committed golden Android app runs its own generated workflow.
      - name: Golden Android CI
        run: python scripts/run-golden-workflow.py mobile-android

  ios-build:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Prism and XcodeGen
        run: |
          python -m pip install --upgrade pip .
          brew install xcodegen

      # The runner image holds several Xcode versions: select the pinned one (packs/versions.yml) for every later step,
      # then check that it is the one in use.
      - name: Select and check the pinned Xcode
        run: |
          DEVELOPER_DIR="$(python scripts/read-pins.py ios-swiftui --select-xcode)"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$DEVELOPER_DIR" python scripts/read-pins.py ios-swiftui --check-xcode

      - name: Generate iOS Validation Sample (two iOS apps)
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/prism-ios-validation"
          rm -rf "$TARGET"
          cat > "$RUNNER_TEMP/ios-answers.yml" <<'YAML'
          schema_version: 1
          answers:
            project_name: Review App
            apps:
              - {id: backend, stack: spring-backend, name: Spring Boot Backend}
              - {id: mobile-ios, stack: ios-swiftui, name: iOS (Swift/SwiftUI)}
              - {id: partner-ios, stack: ios-swiftui, name: Partner App, path: apps/partner-ios}
          YAML
          python -m prism_cli new --answers "$RUNNER_TEMP/ios-answers.yml" --dest "$TARGET" --yes
          # Commit the sample and clone it, so only the generated, tracked state is built, as on a fresh checkout in CI.
          git -C "$TARGET" init -q
          git -C "$TARGET" add -A
          git -C "$TARGET" -c user.name=prism-validation -c user.email=prism-validation@example.invalid commit -q -m "Generated sample"
          CLONE="$RUNNER_TEMP/prism-ios-clone"
          rm -rf "$CLONE"
          # --no-local copies objects through git's transport instead of sharing the source's files,
          # which avoids an intermittent "unable to read tree" on the runner.
          git -C "$TARGET" fsck --no-progress
          git clone -q --no-local "$TARGET" "$CLONE"
          echo "PRISM_IOS_TARGET=$CLONE" >> "$GITHUB_ENV"

      - name: Generate Xcode projects
        shell: bash
        run: |
          set -euo pipefail
          for app in mobile-ios apps/partner-ios; do
            (cd "$PRISM_IOS_TARGET/$app" && xcodegen generate)
          done

      - name: Select iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available | grep -E '^ +iPhone ' | grep -Eo '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}' | tail -n 1)
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator $SIMULATOR_ID"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Build iOS apps
        shell: bash
        run: |
          set -euo pipefail
          for pair in "mobile-ios:MobileIos" "apps/partner-ios:PartnerIos"; do
            app="${pair%%:*}"
            module="${pair##*:}"
            echo "Building $app"
            (cd "$PRISM_IOS_TARGET/$app" && xcodebuild build \
              -project "$module.xcodeproj" \
              -scheme "$module" \
              -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
              -configuration Debug \
              -derivedDataPath build/DerivedData)
          done

      - name: Check built API base URL
        shell: bash
        run: |
          set -euo pipefail
          for pair in "mobile-ios:MobileIos" "apps/partner-ios:PartnerIos"; do
            app="${pair%%:*}"
            module="${pair##*:}"
            PLIST=$(find "$PRISM_IOS_TARGET/$app/build/DerivedData/Build/Products" -path "*/$module.app/Info.plist" | head -n 1)
            test -n "$PLIST"
            BASE_URL=$(/usr/libexec/PlistBuddy -c "Print :API_BASE_URL" "$PLIST")
            echo "API_BASE_URL in the built $app: $BASE_URL"
            test "$BASE_URL" = "http://localhost:8080"
          done

      - name: Test iOS apps
        shell: bash
        run: |
          set -euo pipefail
          for pair in "mobile-ios:MobileIos" "apps/partner-ios:PartnerIos"; do
            app="${pair%%:*}"
            module="${pair##*:}"
            echo "Testing $app"
            (cd "$PRISM_IOS_TARGET/$app" && xcodebuild test \
              -project "$module.xcodeproj" \
              -scheme "$module" \
              -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
              -derivedDataPath build/DerivedData \
              -resultBundlePath build/TestResults.xcresult)
          done

      # The committed golden iOS app runs its own generated workflow.
      - name: Golden iOS CI
        run: python scripts/run-golden-workflow.py mobile-ios

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation-test-results
          path: |
            ${{ env.PRISM_IOS_TARGET }}/mobile-ios/build/TestResults.xcresult
            ${{ env.PRISM_IOS_TARGET }}/apps/partner-ios/build/TestResults.xcresult
          if-no-files-found: ignore
