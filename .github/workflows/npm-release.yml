name: npm release

# Runs after the Release workflow (TestPyPI, PyPI and the GitHub release) has succeeded
# for a v* tag, then publishes @mortitech/prism with npm trusted publishing (OIDC);
# no token is stored. The one-time owner setup is in docs/cli-release.md.
# A manual run publishes an existing tag, for a release that was published by a
# manual Release run.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, such as v0.6.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Publish @mortitech/prism
    if: >-
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v')) ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@mortitech/prism
    permissions:
      contents: read
      id-token: write

    steps:
      # A run after the Release workflow checks out the commit it built. A manual run names a tag, and the full ref
      # makes the checkout fail for a branch of that name.
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || format('refs/tags/{0}', inputs.tag) }}
          fetch-depth: 0
          fetch-tags: true

      - name: Check that the tag points at this commit and equals the npm version
        id: check
        env:
          TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
        run: |
          set -eu
          # The release is a tag, never a branch: refs/tags/<tag> must exist and name the checked-out commit.
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}" > /dev/null; then
            echo "::error::refs/tags/$TAG does not exist. A release is a tag; a branch named like one is not accepted."
            exit 1
          fi
          if [ "$(git rev-parse "refs/tags/${TAG}^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::The tag $TAG does not point at the commit that the Release workflow built."
            exit 1
          fi
          if ! git tag --points-at HEAD | grep -Fxq "$TAG"; then
            echo "::error::The tag $TAG does not point at the commit that the Release workflow built."
            exit 1
          fi
          version="$(node -p "require('./npm/package.json').version")"
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::The tag $TAG does not equal v + the version in npm/package.json ($version)."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Test the launcher
        working-directory: npm
        run: npm test

      - name: Decide whether to publish
        id: decide
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -eu
          # The registry is read without credentials, so the token that setup-node configures is not involved.
          package_status="$(curl -s -o /dev/null -w '%{http_code}' https://registry.npmjs.org/@mortitech%2Fprism)"
          version_status="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@mortitech%2Fprism/${VERSION}")"
          if [ "$package_status" = "404" ]; then
            echo "::warning::@mortitech/prism does not exist on npm yet. The owner publishes the first version by hand (see docs/cli-release.md); this run publishes nothing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$version_status" = "200" ]; then
            echo "::notice::@mortitech/prism@${VERSION} is already published; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$package_status" = "200" ] && [ "$version_status" = "404" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unexpected answer from the npm registry (package ${package_status}, version ${version_status})."
            exit 1
          fi

      - name: Publish with provenance
        if: steps.decide.outputs.publish == 'true'
        working-directory: npm
        run: npm publish --provenance --access public
