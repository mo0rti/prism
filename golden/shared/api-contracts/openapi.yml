openapi: "3.1.0"
info:
  title: "Prism Golden API"
  version: "0.1.0"
  description: "The reference workspace that Prism\u0027s CI regenerates and builds, one app of each stack"

servers:
  - url: http://localhost:8080
    description: "backend (local development)"

# Every operation needs a bearer JWT unless it says `security: []`.
security:
  - bearerAuth: []

paths:
  # ===========================================================================
  # Local development identity
  # ===========================================================================
  /api/dev-identity/token:
    post:
      operationId: createDevToken
      tags: [dev-identity]
      x-prism-dev-only: true
      security: []
      summary: Sign a local development token
      description: |
        Local development sign-in, not authentication. The backend serves this route only under the
        `local` Spring profile and only to requests from the loopback interface; every other profile
        answers `404`. The token is a short-lived JWT with `iss` set to `prism-dev-identity`, signed with a
        key that exists only in the memory of the running process. Replace this route and the `local`
        profile with your identity provider before any shared deployment (see the `security-auth` skill).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevTokenRequest'
      responses:
        '200':
          description: A development token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/dev-identity/jwks:
    get:
      operationId: getDevJwks
      tags: [dev-identity]
      x-prism-dev-only: true
      security: []
      summary: Publish the public key of the local development identity
      description: |
        Local development only. The JSON Web Key Set (RFC 7517) with the public key that verifies the
        tokens of `POST /api/dev-identity/token`, so another local service, such as an agent service, can
        validate those tokens without a shared secret. The set never carries a private member. The backend
        serves this route only under the `local` Spring profile and only to requests from the loopback
        interface; every other profile answers `404`. The key lives in the memory of the running process, so
        a restart publishes a new key. A real identity provider publishes its own JWKS and replaces this
        route (see the `security-auth` skill).
      responses:
        '200':
          description: The public key set of the development identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevJwks'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # Users
  # ===========================================================================
  /api/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get the signed-in user's profile
      description: Returns the profile of the user the bearer token's `sub` claim belongs to. The backend creates the profile on the first call.
      responses:
        '200':
          description: The signed-in user's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

# =============================================================================
# Components
# =============================================================================
components:
  schemas:
    # --- Dev identity ---
    DevTokenRequest:
      type: object
      description: Who the development identity signs in as. Both fields are optional.
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: Defaults to `developer@example.test`. The same email always signs in as the same user.
        displayName:
          type: string
          maxLength: 100
          description: Defaults to `Local Developer`.

    DevTokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: The compact-serialized JWT. Send it in the Authorization header as `Bearer <accessToken>`.
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          format: int64
          description: Lifetime of the token in seconds.

    DevJwks:
      type: object
      description: A JSON Web Key Set with the public key of the development identity.
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/DevJwk'

    DevJwk:
      type: object
      description: A public RSA key (RFC 7517). It carries no private member.
      required: [kty, kid, n, e]
      properties:
        kty:
          type: string
          enum: [RSA]
        kid:
          type: string
          description: The key ID the tokens name in their header.
        n:
          type: string
          description: The modulus, base64url encoded.
        e:
          type: string
          description: The public exponent, base64url encoded.

    # --- Users ---
    UserProfile:
      type: object
      required: [id, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          description: Omitted when the identity provider's token carries no email.
        createdAt:
          type: string
          format: date-time

    # --- Common ---
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

  responses:
    BadRequest:
      description: Request is malformed or fails validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Forbidden:
      description: The request is not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
