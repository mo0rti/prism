name: prism-golden

services:
  backend:
    build:
      context: "./backend"
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    # No Spring profile is set here: a container never runs the `local` development identity.
    environment:
      PORT: "8080"
      DATABASE_URL: jdbc:postgresql://db:5432/${DATABASE_NAME:-prism_golden}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-prism_golden}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-localdev}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-prism_golden}
      POSTGRES_USER: ${DATABASE_USERNAME:-prism_golden}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-localdev}
    # The password is a known development default: every published port stays on this machine (127.0.0.1).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-prism_golden}"]
      interval: 5s
      timeout: 5s
      retries: 5



volumes:

  pgdata:

