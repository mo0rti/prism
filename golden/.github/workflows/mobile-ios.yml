name: "iOS App CI"

on:
  push:
    branches: [main]
    paths:
      - "mobile-ios/**"
      - "shared/api-contracts/**"
      - ".github/workflows/mobile-ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile-ios/**"
      - "shared/api-contracts/**"
      - ".github/workflows/mobile-ios.yml"
  workflow_dispatch:

jobs:
  verify:
    name: Generate, build, test
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: mobile-ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select iPhone simulator
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available | grep -E '^ +iPhone ' | grep -Eo '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}' | tail -n 1)
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator $SIMULATOR_ID"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "MobileIos.xcodeproj" \
            -scheme "MobileIos" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -configuration Debug \
            -derivedDataPath build/DerivedData

      - name: Test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "MobileIos.xcodeproj" \
            -scheme "MobileIos" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-test-results
          path: mobile-ios/build/TestResults.xcresult
          if-no-files-found: ignore
