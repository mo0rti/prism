name: "Backend CI"

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "shared/api-contracts/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "shared/api-contracts/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_PATH: "backend"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x "$APP_PATH/gradlew"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles(format('{0}/**/*.gradle*', env.APP_PATH), format('{0}/gradle/wrapper/gradle-wrapper.properties', env.APP_PATH)) }}

      # The runner's Docker daemon serves the integration tests (Testcontainers starts PostgreSQL).
      # The build needs no secret and no production credential.
      - name: Build and run every test
        working-directory: ${{ env.APP_PATH }}
        run: ./gradlew build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ${{ env.APP_PATH }}/build/reports/tests/
