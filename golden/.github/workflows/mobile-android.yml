name: "Android App CI (mobile-android)"

on:
  push:
    branches: [main]
    paths:
      - "mobile-android/**"
      - "shared/api-contracts/**"
      - ".github/workflows/mobile-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile-android/**"
      - "shared/api-contracts/**"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run per app and branch: a newer push cancels the run it replaces.
concurrency:
  group: "mobile-android-${{ github.ref }}"
  cancel-in-progress: true

env:
  APP_PATH: "mobile-android"

jobs:
  build:
    name: Build the debug APK and run the unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x "$APP_PATH/gradlew"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # The platform of the app's compileSdk and the build tools of its Android Gradle Plugin.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles(format('{0}/**/*.gradle*', env.APP_PATH), format('{0}/gradle/libs.versions.toml', env.APP_PATH), format('{0}/gradle/wrapper/gradle-wrapper.properties', env.APP_PATH)) }}

      # The build needs no secret and no production credential, and no emulator: the Compose UI test
      # runs on the JVM with Robolectric.
      - name: Build the debug APK and run the unit tests
        working-directory: ${{ env.APP_PATH }}
        run: ./gradlew assembleDebug testDebugUnitTest

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ${{ env.APP_PATH }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ${{ env.APP_PATH }}/app/build/reports/tests/
