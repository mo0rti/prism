name: "Android App CI"

on:
  push:
    branches: [main]
    paths:
      - "mobile-android/**"
      - "shared/api-contracts/**"
      - ".github/workflows/mobile-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile-android/**"
      - "shared/api-contracts/**"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the debug APK and run the unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x mobile-android/gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # The platform of the app's compileSdk and the build tools of its Android Gradle Plugin.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile-android/**/*.gradle*', 'mobile-android/gradle/libs.versions.toml', 'mobile-android/gradle/wrapper/gradle-wrapper.properties') }}

      # The build needs no secret and no production credential, and no emulator: the Compose UI test
      # runs on the JVM with Robolectric.
      - name: Build the debug APK and run the unit tests
        working-directory: mobile-android
        run: ./gradlew assembleDebug testDebugUnitTest

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: mobile-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: mobile-android/app/build/reports/tests/
