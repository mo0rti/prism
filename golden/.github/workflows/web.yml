name: "Web CI (web)"

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/api-contracts/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "shared/api-contracts/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run per app and branch: a newer push cancels the run it replaces.
concurrency:
  group: "web-${{ github.ref }}"
  cancel-in-progress: true

env:
  APP_PATH: "web"

jobs:
  verify:
    name: Install, lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.APP_PATH }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
