name: "Agent Service CI (agent-service)"

on:
  push:
    branches: [main]
    paths:
      - "agent-service/**"
      - "shared/api-contracts/**"
      - ".github/workflows/agent-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "agent-service/**"
      - "shared/api-contracts/**"
      - ".github/workflows/agent-service.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run per app and branch: a newer push cancels the run it replaces.
concurrency:
  group: "agent-service-${{ github.ref }}"
  cancel-in-progress: true

env:
  APP_PATH: "agent-service"

jobs:
  verify:
    name: Lint, typecheck, test, evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.APP_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: ${{ env.APP_PATH }}/uv.lock

      # The lockfile is the source of truth: the install fails when it disagrees with pyproject.toml.
      - name: Install the locked dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Typecheck
        run: uv run --locked mypy

      # No network, no API key and no production credential: the tests use the fake provider and mocked HTTP.
      - name: Test
        run: uv run --locked pytest

      # The evaluation cases run the fake provider. A live-model run is on demand (`task agent-service:eval-live`).
      - name: Evaluate
        run: uv run --locked python -m evals.run --provider fake
