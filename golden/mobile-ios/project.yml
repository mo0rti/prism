name: MobileIos
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1

targets:
  MobileIos:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.prismgolden.mobileios
      configs:
        # The backend the app calls. The local development sign-in works only against a backend on this Mac,
        # which the simulator reaches as localhost. Set the Release value to your deployed backend.
        Debug:
          API_BASE_URL: "http://localhost:8080"
        Release:
          API_BASE_URL: ""
    scheme:
      testTargets:
        - MobileIosTests
        - MobileIosUITests

  MobileIosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.prismgolden.mobileios.tests
    dependencies:
      - target: MobileIos

  MobileIosUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.prismgolden.mobileios.uitests
        TEST_TARGET_NAME: MobileIos
    dependencies:
      - target: MobileIos
