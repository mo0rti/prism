[project]
name = "prism-golden-agent-service"
version = "0.1.0"
description = "Agent Service - the AI agent service of Prism Golden"
requires-python = ">=3.12"
dependencies = [
    "anthropic==1.11.0",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt[crypto]==2.15.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.16.10",
    "types-pyyaml==6.0.12.20260906",
]

[tool.uv]
# An application, not a library: uv installs the dependencies and does not build or install this project.
package = false
required-version = ">=0.11.26"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
# `ruff format` owns line length; a long prompt or message string is allowed to exceed it.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "evals", "tests"]
