  const deliveriesOf = release => objectList(release.deliveries);
  const apps = uniqueSorted(all.flatMap(release => deliveriesOf(release).map(item => item.app)).filter(value => typeof value === "string" && value));
  const targets = uniqueSorted(all.flatMap(release => deliveriesOf(release).map(item => item.target)).filter(value => typeof value === "string" && value));
  if (!apps.includes(state.records.releaseApp)) state.records.releaseApp = "";
  if (!targets.includes(state.records.releaseTarget)) state.records.releaseTarget = "";
  const filters = state.records;
  const filtered = !!(filters.releaseApp || filters.releaseTarget);
  const shown = all.filter(release => !filtered || deliveriesOf(release).some(item => (!filters.releaseApp || item.app === filters.releaseApp) && (!filters.releaseTarget || item.target === filters.releaseTarget)))
    .sort(newestFirst);
  view.innerHTML = `<div class="rec-toolbar">${filterSelectHtml("releaseApp", "App", "Filter releases by app", filters.releaseApp, apps)}${filterSelectHtml("releaseTarget", "Target", "Filter releases by target", filters.releaseTarget, targets)}
      <span class="rec-count">${escapeHtml(countText(shown.length, all.length, "record"))}</span></div>` +
    (shown.length ? `<div class="rel-list">${shown.map(releaseCardHtml).join("")}</div>` : recordsEmptyHtml("No release records match the filters."));
  bindRecordFilters(view, renderReleases);
  bindRecordCards(view);
  bindRecordLinks(view);
}

/* ---------- incidents ---------- */
function incidentCardHtml(incident, index) {
  const id = String(incident.id), title = recordTitle(incident, "Untitled incident"), invalid = incident.valid === false;
  const badges = [severityBadgeHtml(incident.severity)];
  if (incident.cause_known === false) badges.push('<span class="badge advisory" title="The incident page says the cause is unknown.">cause unknown</span>');
  if (invalid) badges.push('<span class="badge advisory" title="Lint reports this incident page as invalid.">invalid</span>');
  const label = `Incident ${boundedText(id, 140)}: ${boundedText(title, 180)}; status ${labelOf(incident.status, "missing")}; severity ${labelOf(incident.severity, "missing")}${incident.cause_known === false ? "; cause unknown" : ""}${invalid ? "; invalid page" : ""}`;
  return `<div class="card rec${invalid ? " invalid" : ""}" data-record-id="${escapeHtml(id)}" data-record-kind="incident" tabindex="0" role="group" aria-label="${escapeHtml(label)}" style="--stage-color:var(--${toneName(SEVERITY_TONE, incident.severity)});--stagger:${REDUCED ? 0 : index * 0.05}s">
    <div class="rec-idrow"><span class="cid">${escapeHtml(id)}</span><span class="when">${escapeHtml(labelOf(incident.date, "—"))}</span></div>${titleHtml(title)}
    <div class="badges">${badges.join("")}</div>
    <div class="rec-meta">${appTagsHtml(incident.apps)}</div>
    ${incident.impact ? `<div class="rec-text">${escapeHtml(boundedText(incident.impact, 240))}</div>` : ""}
    ${linksRowHtml("Releases", incident.releases)}${linksRowHtml("Follow-ups", incident.follow_ups)}</div>`;
}
function renderIncidents() {
  const view = document.getElementById("incidents-view");
  const all = recordList("incidents");
  if (!all.length) { view.innerHTML = recordsEmptyHtml("No incidents recorded.", "An incident page under knowledge/wiki/incidents/ shows up here."); return; }
  // Newest first within a column; an incident without a known status is shown under open, with its warning.
  const sorted = all.slice().sort(newestFirst);
  const statusOf = incident => INCIDENT_STATUSES.includes(incident.status) ? incident.status : "open";
  view.innerHTML = `<div class="rec-toolbar"><span class="rec-count">${escapeHtml(countText(all.length, all.length, "incident"))}</span></div><div class="board">${recordColumnsHtml(INCIDENT_STATUSES, sorted, statusOf, INCIDENT_STATUS_TONE, "Incident", incidentCardHtml)}</div>`;
  bindRecordCards(view);
  bindRecordLinks(view);
}

/* ---------- panels ---------- */
function metaCellHtml(label, valueHtml) { return `<div class="meta"><div class="k">${escapeHtml(label)}</div><div class="v">${valueHtml}</div></div>`; }
function dotValueHtml(text, map, value) { return `<i style="background:var(--${toneName(map, value)})"></i>${escapeHtml(text)}`; }
function panelSectionHtml(title, bodyHtml, marker) { return `<div class="section"${marker ? " " + marker : ""}><h4>${escapeHtml(title)}</h4>${bodyHtml}</div>`; }
function panelEmptyHtml(text) { return `<span class="panel-empty">${escapeHtml(text)}</span>`; }
function panelTextHtml(text, emptyText) { return text ? `<div class="panel-text">${escapeHtml(boundedText(text, 600))}</div>` : panelEmptyHtml(emptyText); }
function panelLinksHtml(ids, emptyText) {
  const list = stringList(ids);
  return list.length ? `<div class="panel-links">${list.map(id => recordLinkHtml(id)).join("")}</div>` : panelEmptyHtml(emptyText);
}
function factRowsHtml(rows, emptyText) {
  return rows.length ? `<div class="fact-rows">${rows.map(cells => `<div class="fact-row">${cells.join('<span class="sep">·</span>')}</div>`).join("")}</div>` : panelEmptyHtml(emptyText);
}
function plainCell(value) { return boundedSpan(value, 120); }
function appCell(value) { return value === undefined || value === null || value === "" ? plainCell("") : `<span class="app-tag"${String(value).length > 40 ? ` title="${escapeHtml(boundedText(value, 600))}"` : ""}><i></i>${escapeHtml(boundedText(value, 40))}</span>`; }
function panelNoteHtml(text) { return `<div class="panel-note" role="note">${escapeHtml(text)}</div>`; }

function bugPanelHtml(bug) {
  const meta = [
    metaCellHtml("Status", dotValueHtml(labelOf(bug.status, "—"), BUG_STATUS_TONE, bug.status)),
    metaCellHtml("Owner", escapeHtml(labelOf(bug.owner, "—"))),
    metaCellHtml("Severity", dotValueHtml(labelOf(bug.severity, "—"), SEVERITY_TONE, bug.severity)),
    metaCellHtml("Blocking", bug.blocking === true ? '<i style="background:var(--critical)"></i>yes' : bug.blocking === false ? "no" : "—"),
  ];
  if (bug.environment) meta.push(metaCellHtml("Environment", escapeHtml(boundedText(bug.environment, 60))));
  if (bug.found_in) meta.push(metaCellHtml("Found in", escapeHtml(boundedText(bug.found_in, 80))));
  if (bug.deferred === true) meta.push(metaCellHtml("Deferred", "yes"));
  if (bug.regression_of) meta.push(metaCellHtml("Regression of", recordLinkHtml(bug.regression_of)));
  let disposition = "";
  if (bug.close_reason === "wont-fix") disposition = "<span>Won't fix</span>";
  else if (bug.close_reason === "duplicate") disposition = `<span>Duplicate of</span>${bug.duplicate_of ? recordLinkHtml(bug.duplicate_of) : ""}`;
  else if (bug.close_reason === "promoted") disposition = `<span>Promoted to</span>${bug.promoted_to ? recordLinkHtml(bug.promoted_to) : ""}`;
  const fix = objectList(bug.fix).map(item => [appCell(item.app), plainCell(item.artifact)]);
  const verification = objectList(bug.verification).map(item => [appCell(item.app), plainCell(item.attempt), toneBadgeHtml(labelOf(item.result, "—"), RESULT_TONE, item.result)]);
  const release = objectList(bug.release).map(item => [appCell(item.app), plainCell(item.target), toneBadgeHtml(labelOf(item.outcome, "—"), DELIVERY_TONE, item.outcome), item.record ? recordLinkHtml(item.record) : panelEmptyHtml("no record")]);
  return `${bug.valid === false ? panelNoteHtml("Lint reports this bug page as invalid (bug-page-invalid or invalid-bug-status-owner). The entry stays here until the page is fixed.") : ""}
      <div class="meta-grid">${meta.join("")}</div>
      ${panelSectionHtml("Apps", `<div class="rec-meta" style="margin-top:0">${appTagsHtml(bug.apps)}</div>`)}
      ${panelSectionHtml("Feature", bug.feature ? `<div class="rec-links" style="margin-top:0">${featureLinkHtml(bug.feature)}</div>` : panelEmptyHtml("Not linked to a feature."))}
      ${disposition ? panelSectionHtml("Disposition", `<div class="rec-links" style="margin-top:0">${disposition}</div>`) : ""}
      ${panelSectionHtml("Summary", panelTextHtml(bug.summary, "No summary."))}
      ${panelSectionHtml("Fix - " + fix.length, factRowsHtml(fix, "No fix recorded yet."), "data-panel-fix")}
      ${panelSectionHtml("Verification - " + verification.length, factRowsHtml(verification, "Not verified yet."), "data-panel-verification")}
      ${panelSectionHtml("Release - " + release.length, factRowsHtml(release, "Not released yet."), "data-panel-release")}`;
}
function releaseChainHtml(release) {
  const key = recordKey(release.id), rows = [];
  if (release.retry_of) rows.push([plainCell("Retry of"), recordLinkHtml(release.retry_of)]);
  if (release.rollback_of) rows.push([plainCell("Rollback of"), recordLinkHtml(release.rollback_of)]);
  for (const other of recordList("releases")) {
    if (recordKey(other.id) === key) continue;
    if (other.retry_of && recordKey(other.retry_of) === key) rows.push([plainCell("Retried by"), recordLinkHtml(other.id)]);
    if (other.rollback_of && recordKey(other.rollback_of) === key) rows.push([plainCell("Rolled back by"), recordLinkHtml(other.id)]);
  }
  return factRowsHtml(rows, "Not part of a retry or rollback chain.");
}
function releasePanelHtml(release) {
  const meta = [
    metaCellHtml("Date", escapeHtml(labelOf(release.date, "—"))),
    metaCellHtml("Kind", dotValueHtml(labelOf(release.kind, "—"), KIND_TONE, release.kind)),
    metaCellHtml("Outcome", dotValueHtml(labelOf(release.outcome, "—"), OUTCOME_TONE, release.outcome)),
    metaCellHtml("Current", release.current === true ? '<i style="background:var(--done)"></i>yes' : "no"),
  ];
  const deliveries = objectList(release.deliveries).map(item => [item.item ? recordLinkHtml(item.item) : plainCell(""), appCell(item.app), plainCell(item.target), plainCell(item.version), plainCell(item.attempt), toneBadgeHtml(labelOf(item.outcome, "—"), DELIVERY_TONE, item.outcome)]);
  return `${release.valid === false ? panelNoteHtml("The release validator rejects this record. It stays here until the record is fixed.") : ""}
      <div class="meta-grid">${meta.join("")}</div>
      ${panelSectionHtml("Chain", releaseChainHtml(release), "data-panel-chain")}
      ${panelSectionHtml("Features - " + stringList(release.features).length, panelLinksHtml(release.features, "No features."))}
      ${panelSectionHtml("Bugs - " + stringList(release.bugs).length, panelLinksHtml(release.bugs, "No bugs."))}
      ${release.summary ? panelSectionHtml("Summary", panelTextHtml(release.summary, "")) : ""}
      ${panelSectionHtml("Deliveries - " + deliveries.length, factRowsHtml(deliveries, "No deliveries recorded."), "data-panel-deliveries")}`;
}
function incidentPanelHtml(incident) {
  const timeline = objectList(incident.timeline);
  const meta = [
    metaCellHtml("Status", dotValueHtml(labelOf(incident.status, "—"), INCIDENT_STATUS_TONE, incident.status)),
    metaCellHtml("Severity", dotValueHtml(labelOf(incident.severity, "—"), SEVERITY_TONE, incident.severity)),
    metaCellHtml("Date", escapeHtml(labelOf(incident.date, "—"))),
    metaCellHtml("Cause", incident.cause_known === false ? '<i style="background:var(--warning)"></i>unknown' : "known"),
  ];
  const timelineHtml = timeline.length
    ? `<ol class="timeline">${timeline.map(line => `<li><span class="when">${escapeHtml(labelOf(line.when, "no time"))}</span>${escapeHtml(boundedText(line.text, 200))}</li>`).join("")}</ol>` +
      (incident.timeline_truncated === true ? `<div class="transition-hint" style="margin-top:8px">Showing the last ${timeline.length} lines; more lines on the page.</div>` : "")
    : panelEmptyHtml("No timeline lines.");
  return `${incident.valid === false ? panelNoteHtml("Lint reports this incident page as invalid (incident-record-invalid). The entry stays here until the page is fixed.") : ""}
      <div class="meta-grid">${meta.join("")}</div>
      ${panelSectionHtml("Apps", `<div class="rec-meta" style="margin-top:0">${appTagsHtml(incident.apps)}</div>`)}
      ${panelSectionHtml("Impact", panelTextHtml(incident.impact, "No impact recorded."))}
      ${panelSectionHtml("Timeline - " + timeline.length, timelineHtml, "data-panel-timeline")}
      ${panelSectionHtml("Releases - " + stringList(incident.releases).length, panelLinksHtml(incident.releases, "No releases."))}
      ${panelSectionHtml("Follow-ups - " + stringList(incident.follow_ups).length, panelLinksHtml(incident.follow_ups, "No follow-ups."))}`;
}
function renderRecordPanel(entry) {
  const record = entry.record;
  const kinds = {
    bug: { label: "Bug", tone: toneName(SEVERITY_TONE, record.severity), body: bugPanelHtml },
    release: { label: "Release", tone: toneName(OUTCOME_TONE, record.outcome), body: releasePanelHtml },
    incident: { label: "Incident", tone: toneName(SEVERITY_TONE, record.severity), body: incidentPanelHtml },
  };
  const kind = kinds[entry.kind];
  const color = `var(--${kind.tone})`;
  const pathHtml = record.path ? `
      <div class="section"><h4>Source of truth</h4>
        <div class="pathrow"><code title="${escapeHtml(record.path)}">${escapeHtml(record.path)}</code>
        <a href="#" id="copy-path">Copy</a></div></div>` : "";
  document.getElementById("panel").innerHTML = `
    <div class="panel-head">
      <div class="row"><span class="type-chip" style="border-color:${color};color:${color}">${kind.label}</span>
        <span class="pid">${escapeHtml(record.id)}</span>
        <button class="panel-close" id="panel-close" aria-label="Close panel">✕</button></div>
      <h2${recordTitle(record, record.id).length > 160 ? ` title="${escapeHtml(boundedText(recordTitle(record, record.id), 600))}"` : ""}>${escapeHtml(boundedText(recordTitle(record, record.id), 160))}</h2>
    </div>
    <div class="panel-body">
      ${kind.body(record)}
      ${pathHtml}
    </div>`;
  bindPanelActions(record);
}
function selectRecord(id) {
  const entry = recordIndex.get(recordKey(id));
  if (!entry) { announce("That record is no longer present."); return; }
  const panelBefore = document.getElementById("panel");
  const active = document.activeElement;
  if (active && active.focus && (!panelBefore || !panelBefore.contains || !panelBefore.contains(active))) state.panelReturnFocus = active;
  state.selected = null;
  state.selectedRecord = String(entry.record.id);
  renderRecordPanel(entry);
  const panel = document.getElementById("panel");
  panel.classList.add("open");
  panel.removeAttribute("inert");
  panel.setAttribute("aria-hidden", "false");
  const close = document.getElementById("panel-close");
  if (close && close.focus) close.focus();
}
// A feature's panel lists the feature's bugs, with their status, and the release records that name it.
function featureRecordsHtml(node) {
  const ids = new Set([recordKey(node.id), recordKey(canonicalFeatureId(node))]);
  const bugs = recordList("bugs").filter(bug => bug.feature && ids.has(recordKey(bug.feature))).sort((a, b) => recordNumber(a.id) - recordNumber(b.id));
  const releases = recordList("releases").filter(release => stringList(release.features).some(id => ids.has(recordKey(id)))).sort(newestFirst);
  const row = (record, badge) => `<button type="button" class="rec-row" data-record-link="${escapeHtml(record.id)}" aria-label="Open ${escapeHtml(boundedText(record.id, 80))}"><span class="rid">${escapeHtml(record.id)}</span>${boundedSpan(recordTitle(record, "Untitled"), 120, "rtitle")}${badge}</button>`;
  return (bugs.length ? panelSectionHtml("Bugs - " + bugs.length, bugs.map(bug => row(bug, toneBadgeHtml(labelOf(bug.status, "—"), BUG_STATUS_TONE, bug.status))).join(""), "data-panel-bugs") : "") +
    (releases.length ? panelSectionHtml("Release records - " + releases.length, releases.map(release => row(release, toneBadgeHtml(labelOf(release.outcome, "—"), OUTCOME_TONE, release.outcome, labelOf(release.date, "")))).join(""), "data-panel-releases") : "");
}

/* ==================== board ==================== */
function renderBoard() {
  const feats = featureNodes();
  const intake = intakeFacts();
  const boardStages = feats.some(f => !STAGES.includes(f.status))
    ? [...STAGES, "unknown stage"]
    : STAGES;
  const intakeCards =
    intake.quarantined.map(name =>
      `<div class="card intake quarantined" data-intake="quarantined" data-name="${escapeHtml(name)}" tabindex="0" role="group" aria-label="Quarantined intake item ${escapeHtml(boundedText(name, 140))}">
        <div class="cid">QUARANTINED</div><div class="ctitle">${escapeHtml(name)}</div>
        <div class="badges"><span class="badge blocked">human resolution</span></div></div>`).join("") +
    intake.pending.map(name =>
      `<div class="card intake" data-intake="pending" data-name="${escapeHtml(name)}" tabindex="0" role="group" aria-label="Pending intake item ${escapeHtml(boundedText(name, 140))}">
        <div class="cid">PENDING BRIEF</div><div class="ctitle">${escapeHtml(name)}</div>
        <div class="badges"><span class="badge advisory">awaiting intake</span></div></div>`).join("");
  const intakeCol = `<div class="column intake-col" data-stage="intake"><h3><i style="background:${C.muted}"></i>intake<span class="count">${intake.pending.length + intake.quarantined.length}</span></h3>${intakeCards || '<span style="font-size:10.5px;color:var(--muted);padding:4px 6px;line-height:1.5">Drop briefs into knowledge/intake/pending/</span>'}</div>`;
  const cols = boardStages.map(stage => {
    const items = stage === "unknown stage"
      ? feats.filter(f => !STAGES.includes(f.status))
      : feats.filter(f => f.status === stage);
    const stageColor = C[STAGE_PHASE[stage]] || C.muted;
    const cards = items.map((f, i) => {
      const badges = [];
      if (blockedIds.has(f.id)) badges.push('<span class="badge blocked">blocked</span>');
      if (f.advisory_review === "pending") badges.push('<span class="badge advisory">advisory</span>');
      if (f.health === "error") badges.push('<span class="badge broken">malformed</span>');
      else if (f.health === "warning") badges.push('<span class="badge advisory">warning</span>');
      if (stage === "unknown stage") {
        const originalStatus = f.status === null || f.status === undefined || f.status === ""
          ? "missing status"
          : `status: ${String(f.status)}`;
        badges.push(`<span class="badge broken">${escapeHtml(originalStatus)}</span>`);
      }
      const cardLabel = `Feature ${boundedText(canonicalFeatureId(f), 140)}: ${boundedText(f.title || "untitled", 180)}; status ${boundedText(f.status || "missing", 80)}`;
      return `<div class="card" data-id="${escapeHtml(f.id)}" tabindex="0" role="group" aria-label="${escapeHtml(cardLabel)}" style="--stage-color:${stageColor};--stagger:${REDUCED ? 0 : i * 0.05}s">
        <div class="cid">${escapeHtml(f.id)}</div><div class="ctitle">${escapeHtml(f.title)}</div>
        <div class="badges">${badges.join("")}</div>${cardAppStagesHtml(f)}${DESIGN_STATUSES.has(f.status) ? designTracksHtml(f) : ""}${transitionButtonHtml(f, "card")}</div>`;
    }).join("");
    return `<div class="column" data-stage="${escapeHtml(stage)}"><h3><i style="background:${stageColor};opacity:${READY_STAGES.has(stage) ? .55 : 1}"></i>${escapeHtml(stage)}<span class="count">${items.length}</span></h3>${cards}</div>`;
  }).join("");
  const view = document.getElementById("board-view");
  view.innerHTML = `<div class="board">${intakeCol}${cols}</div>`;
  view.querySelectorAll(".card[data-id]").forEach(card => {
    card.addEventListener("click", e => {
      if (e && e.target && e.target.closest && e.target.closest("button, select, label")) return;
      selectNode(card.dataset.id);
    });
    card.addEventListener("keydown", e => {
      if (e.target && e.target !== card) return;
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectNode(card.dataset.id); }
    });
  });
  view.querySelectorAll(".card[data-intake]").forEach(card => {
    card.addEventListener("click", () => showIntakePanel(card.dataset.intake, card.dataset.name));
    card.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); showIntakePanel(card.dataset.intake, card.dataset.name); }
    });
  });
  bindTransitionControls(view);
  bindBoardInteractions(view);
}

/* ==================== apps ==================== */
function renderApps() {
  const apps = state.data.facts.nodes.filter(n => n.type === "app");
  const edges = state.data.facts.edges;
  const html = apps.map((p, i) => {
    const featureIds = edges.filter(e => e.kind === "targets" && e.target === p.id).map(e => e.source);
    const chips = featureIds.map(fid => {
      const f = nodesById[fid]; if (!f) return "";
      const appId = p.id.slice("app:".length);
      const reqEdge = edges.find(e => e.kind === "has-requirement" && e.source === fid && e.target.toLowerCase() === ("areq:" + fid + "-" + appId).toLowerCase());
      const req = reqEdge ? nodesById[reqEdge.target] : null;
      const reqStatus = req ? (req.status || "unknown") : "no requirement";
      const reqColor = reqStatus === "done" ? C.done : reqStatus === "in-progress" ? C.dev : C.muted;
      const stageRow = featureAppRows(f).find(row => row.app === appId);
      const stageLabel = stageRow ? (stageRow.stage ? (stageRow.retired ? stageRow.stage + " · retired" : stageRow.stage) : "retired") : "";
      return `<div class="fchip" data-id="${escapeHtml(fid)}" tabindex="0" role="button" aria-label="Open feature ${escapeHtml(boundedText(fid, 120))}: ${escapeHtml(boundedText(f.title, 180))}"><i style="background:${phaseColor(f)}"></i>${escapeHtml(fid)} · ${escapeHtml(f.title)}
        ${stageLabel ? `<span class="req" title="${escapeHtml(stageLabel)}">${escapeHtml(boundedText(stageLabel, 40))}</span>` : ""}<span class="req" style="color:${reqColor}" title="req: ${escapeHtml(reqStatus)}">req: ${escapeHtml(reqStatus)}</span></div>`;
    }).join("");
    return `<div class="lane" style="animation-delay:${REDUCED ? 0 : i * 0.07}s"><h3><i></i>${escapeHtml(p.title)}${p.status === "retired" ? ' <span class="retired">(retired)</span>' : ""}<span class="count">${featureIds.length} FEATURE${featureIds.length === 1 ? "" : "S"}</span></h3>
      ${appOperationsHtml(p.id.slice("app:".length))}
      <div class="features">${chips || '<span class="none">No features target this app yet.</span>'}</div></div>`;
  }).join("");
  const view = document.getElementById("app-view");
  view.innerHTML = html || '<div class="lane"><span class="none">No app targets found in the wiki.</span></div>';
  view.querySelectorAll(".fchip").forEach(chip => {
    chip.addEventListener("click", () => selectNode(chip.dataset.id));
    chip.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectNode(chip.dataset.id); }
    });
  });
  bindRecordLinks(view);
}

/* ==================== detail panel ==================== */
function selectNode(id) {
  const node = nodesById[id];
  if (!node || duplicateNodeIds.has(id)) {
    announce(duplicateNodeIds.has(id) ? "Duplicate node identity is inspect-only until source IDs are repaired." : "That source node is no longer present.");
    return;
  }
  const panelBefore = document.getElementById("panel");
  const active = document.activeElement;
  if (active && active.focus && (!panelBefore || !panelBefore.contains || !panelBefore.contains(active))) state.panelReturnFocus = active;
  state.selected = id;
  state.selectedRecord = null;
  renderPanel(node);
  const panel = document.getElementById("panel");
  panel.classList.add("open");
  panel.removeAttribute("inert");
  panel.setAttribute("aria-hidden", "false");
  const close = document.getElementById("panel-close");
  if (close && close.focus) close.focus();
  if (state.view === "graph") focusNode(id);
}
function closePanel() {
  const returnFocus = state.panelReturnFocus;
  state.selected = null;
  state.selectedRecord = null;
  state.panelReturnFocus = null;
  const panel = document.getElementById("panel");
  panel.classList.remove("open");
  panel.setAttribute("inert", "");
  panel.setAttribute("aria-hidden", "true");
  if (returnFocus && returnFocus.focus && returnFocus.isConnected !== false) returnFocus.focus();
}
function renderPanel(node) {
  const color = phaseColor(node);
  const meta = [];
  if (node.status) meta.push(["Stage", node.status, C[STAGE_PHASE[node.status]] || C.context]);
  if (node.owner) meta.push(["Owner", node.owner, null]);
  if (node.advisory_review) meta.push(["Advisory", node.advisory_review, node.advisory_review === "pending" ? C.warning : null]);
  meta.push(["Health", node.health, node.health === "ok" ? C.done : node.health === "warning" ? C.warning : C.critical]);
  const metaHtml = meta.map(([k, v, c]) =>
    `<div class="meta"><div class="k">${escapeHtml(k)}</div><div class="v">${c ? `<i style="background:${c}"></i>` : ""}${escapeHtml(String(v))}</div></div>`).join("");
  const transitionPanelHtml = node.type === "feature"
    ? `<div class="section"><h4>Workflow request</h4>${transitionButtonHtml(node, "panel")}</div>`
    : "";

  const appRows = node.type === "feature" ? featureAppRows(node) : [];
  const appStagesPanelHtml = appRows.length
    ? `<div class="section" data-panel-app-stages><h4>App stages - ${appRows.length}</h4><div class="app-stages">${appRows.map(appStageHtml).join("")}</div></div>`
    : "";
  const trackPanelHtml = designTrackStates(node).length && DESIGN_STATUSES.has(node.status)
    ? `<div class="section" data-panel-design-tracks><h4>Design tracks</h4>${designTracksHtml(node)}</div>`
    : "";

  const blockers = blockersByFeature[node.id] || [];
  const blockerHtml = blockers.length
    ? `<div class="section"><h4>BLOCKERS - action required</h4>${blockers.map(b => {
        const guidance = b.code === "missing-app-requirements"
          ? "Review with the owning design or delivery workflow; design-handoff is not an automatic repair from this stage."
          : "Review with the owning workflow; this dashboard does not run a promotion for this blocker.";
        return `<div class="blocker-item"><div class="code">${escapeHtml(b.code || "unknown blocker")}</div>${escapeHtml(b.message || "No blocker message supplied.")}
          <div class="unblock">${escapeHtml(guidance)}</div></div>`;
      }).join("")}</div>`
    : "";

  const openQuestions = (node.open_questions || []).filter(q => q.status === "open");
  const questionsHtml = openQuestions.length
    ? `<div class="section"><h4>Open questions - ${openQuestions.length}</h4>${openQuestions.map(q => {
        const owner = q.owner || "unassigned";
        const guidance = owner === "dev"
          ? "Review with the owning agent; ask needs the feature ID, a quoted question, and a recipient."
          : "Review with the owning agent; clarification needs the full question context and confirmation.";
        return `<div class="qrow">${escapeHtml(q.question || "Question text not supplied.")}
          <div class="qmeta"><span class="owner-chip">${escapeHtml(owner)}</span>
          <span class="transition-hint">${escapeHtml(guidance)}</span></div></div>`;
      }).join("")}</div>`
    : "";
  const kindLabel = { targets: "targets", "has-requirement": "requirement", "has-design": "design", "has-contract": "api contract", "has-review": "board review", "constrained-by": "constrained by", serves: "serves", related: "related", "links-to": "links to" };
  const connEdges = state.data.facts.edges.filter(e => e.source === node.id || e.target === node.id);
  const conns = connEdges.map(e => {
    const otherId = e.source === node.id ? e.target : e.source;
    const other = nodesById[otherId]; if (!other) return "";
    return `<div class="conn" data-id="${escapeHtml(otherId)}"><span class="kind">${escapeHtml(kindLabel[e.kind] || e.kind)}</span>
      <i style="background:${phaseColor(other)}"></i>${escapeHtml(other.title || otherId)}</div>`;
  }).join("");

  const pathHref = node.path ? `vscode://file/${encodeURI(node.path.replace(/\\/g, "/"))}` : "";
  const pathHtml = node.path ? `
    <div class="section"><h4>Source of truth</h4>
      <div class="pathrow"><code title="${escapeHtml(node.path)}">${escapeHtml(node.path)}</code>
      <a href="#" id="copy-path">Copy</a>
      <a href="${escapeHtml(pathHref)}">VS Code</a></div></div>` : "";

  document.getElementById("panel").innerHTML = `
    <div class="panel-head">
      <div class="row"><span class="type-chip" style="border-color:${color};color:${color}">${escapeHtml(TYPE_LABELS[node.type] || node.type)}</span>
        <span class="pid">${escapeHtml(node.id)}</span>
        <button class="panel-close" id="panel-close">✕</button></div>
      <h2>${escapeHtml(node.title || node.id)}</h2>
    </div>
    <div class="panel-body">
      <div class="meta-grid">${metaHtml}</div>
      ${transitionPanelHtml}
      ${appStagesPanelHtml}
      ${trackPanelHtml}
      ${blockerHtml}
      ${questionsHtml}
      ${node.type === "feature" ? featureRecordsHtml(node) : ""}
      <div class="section"><h4>Connections — ${connEdges.length}</h4>${conns || '<span style="font-size:12px;color:var(--muted)">No connections.</span>'}</div>
      ${pathHtml}
    </div>`;
  bindPanelActions(node);
}
function bindPanelActions(node) {
  const close = document.getElementById("panel-close");
  if (close) close.addEventListener("click", closePanel);
  document.querySelectorAll("#panel .conn").forEach(c => bindKeyboardAction(c, () => {
    selectNode(c.dataset.id);
    document.getElementById("panel-close")?.focus();
  }));
  document.querySelectorAll("#panel .copy-btn").forEach(btn => btn.addEventListener("click", () => {
    copyText(btn.dataset.copy, () => {
      btn.textContent = "Copied";
      btn.classList.add("copied");
      toast("Paste it in your agent");
    });
  }));
  const copy = document.getElementById("copy-path");
  if (copy && node && node.path) copy.addEventListener("click", e => {
    e.preventDefault();
    copyText(node.path, () => toast("Path copied"));
  });
  bindTransitionControls(document.getElementById("panel"));
  bindRecordLinks(document.getElementById("panel"));
}
function showIntakePanel(kind, name) {
  const panelBefore = document.getElementById("panel");
  const active = document.activeElement;
  if (active && active.focus && (!panelBefore || !panelBefore.contains || !panelBefore.contains(active))) state.panelReturnFocus = active;
  state.selected = null;
  state.selectedRecord = null;
  const quarantined = kind === "quarantined";
  const dir = quarantined ? "knowledge/intake/quarantined/" : "knowledge/intake/pending/";
  const guidance = quarantined
    ? "This intake conflicts with existing wiki state and needs a human decision. Open its <code>CONFLICT.md</code>, resolve the conflict, then move or re-process it."
    : "A raw brief waiting to become product truth. Your agent reads it, asks you to confirm the interpretation, and writes the feature pages.";
  const cmd = quarantined ? null : surfaceCommand("po-intake");
  const ingestCmd = quarantined ? null : surfaceCommand("ingest");
  document.getElementById("panel").innerHTML = `
    <div class="panel-head">
      <div class="row"><span class="type-chip" style="border-color:${quarantined ? C.critical : C.muted};color:${quarantined ? C.critical : C.muted}">${quarantined ? "Quarantined" : "Intake"}</span>
        <button class="panel-close" id="panel-close">✕</button></div>
      <h2>${escapeHtml(name)}</h2>
    </div>
    <div class="panel-body">
      <div class="section"><h4>${quarantined ? "⛔ Needs human resolution" : "Next step"}</h4>
        <div style="font-size:12.5px;line-height:1.55;color:var(--ink-2)">${guidance}</div>
        ${cmd ? `<div class="unblock" style="margin-top:10px">process with <code>${escapeHtml(cmd)}</code><button class="copy-btn" data-copy="${escapeHtml(cmd)}">Copy</button></div>` : ""}
        ${ingestCmd ? `<div class="unblock" style="margin-top:8px">or ingest it into topics, research, plans or other pages with <code>${escapeHtml(ingestCmd)}</code><button class="copy-btn" data-copy="${escapeHtml(ingestCmd)}">Copy</button></div>` : ""}
      </div>
      <div class="section"><h4>Location</h4>
        <div class="pathrow"><code>${escapeHtml(dir + name)}</code></div></div>
    </div>`;
  document.getElementById("panel").classList.add("open");
  document.getElementById("panel").removeAttribute("inert");
  document.getElementById("panel").setAttribute("aria-hidden", "false");
  bindPanelActions(null);
  const close = document.getElementById("panel-close");
  if (close && close.focus) close.focus();
}

/* ==================== legend ==================== */
function renderLegend() {
  const legend = document.getElementById("graph-legend");
  const wasOpen = legend.classList.contains("open");
  legend.innerHTML = `
    <div class="legend-head" aria-expanded="${wasOpen}"><span class="tri">▶</span> LEGEND</div>
    <div class="legend-body">
      <b>Lifecycle</b>
      <span class="lg"><i style="background:${C.po}"></i>PO — raw / specified</span>
      <span class="lg"><i style="background:${C.design}"></i>Design phase</span>
      <span class="lg"><i style="background:${C.dev}"></i>Dev phase</span>
      <span class="lg"><i style="background:${C.qa}"></i>QA phase</span>
      <span class="lg"><i style="background:${C.release}"></i>Release phase</span>
      <span class="lg"><i style="background:${C.done}"></i>Released</span>
      <b>Marks</b>
      <span class="lg"><i class="hex" style="background:${C.app}"></i>App</span>
      <span class="lg"><i style="background:${C.context}"></i>Context page</span>
      <span class="lg"><i class="ring"></i>Advisory pending</span>
      <span class="lg"><i class="badge-i"></i>Blocked</span>
       <span class="lg"><i class="warn"></i>Warning / stale page</span>
       <span class="lg"><i class="err"></i>Malformed page</span>
      <span class="lg" style="color:var(--muted)">◌ outlined = ready-for-*</span>
    </div>`;
  legend.classList.toggle("open", wasOpen);
  const head = legend.querySelector(".legend-head");
  bindKeyboardAction(head, () => head.setAttribute("aria-expanded", String(legend.classList.toggle("open"))));
}

/* ==================== views, search, keys ==================== */
function switchView(view) {
  state.view = view;
  document.querySelectorAll(".views button").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  document.querySelectorAll("#dashboard .view").forEach(v => {
    const active = v.id === view + "-view";
    v.classList.toggle("active", active);
    if (active) {
      v.removeAttribute("inert");
      v.setAttribute("aria-hidden", "false");
    } else {
      v.setAttribute("inert", "");
      v.setAttribute("aria-hidden", "true");
    }
  });
  document.getElementById(view + "-view").classList.add("active");
  if (view === "firstrun") renderFirstRunPage();
  if (view === "board") renderBoard();
  if (view === "app") renderApps();
  if (view === "bugs") renderBugs();
  if (view === "releases") renderReleases();
  if (view === "incidents") renderIncidents();
  if (view === "graph") requestAnimationFrame(sizeGraph);
}
document.getElementById("views").addEventListener("click", e => {
  const btn = e.target.closest("button"); if (btn) switchView(btn.dataset.view);
});
const searchInput = document.getElementById("search");
searchInput.addEventListener("input", () => { state.query = searchInput.value.trim(); });
searchInput.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const match = state.data.facts.nodes.find(n => state.visibleTypes.has(n.type) && matchesQuery(n) && state.query);
    if (match) selectNode(match.id);
  }
});
document.addEventListener("keydown", e => {
  if (state.transitionPreview) {
    if (e.key === "Escape") { closeTransitionPreview("Workflow preview canceled."); }
    else if (e.key === "Tab") {
      // The dialog's own handler covers focus inside it; this keeps Tab inside the modal when focus has fallen to the page.
      const modal = document.querySelector("#transition-dialog .transition-dialog");
      if (modal && !(e.target && modal.contains(e.target))) trapDialogTab(e, modal);
    }
    return;
  }
  if (e.key === "/" && document.activeElement !== searchInput) { e.preventDefault(); searchInput.focus(); }
  if (e.key === "Escape") {
    closePanel(); searchInput.value = ""; state.query = ""; document.getElementById("diagpanel").classList.remove("open");
  }
  if (document.activeElement === searchInput) return;
  if (e.key === "1") switchView("firstrun");
  if (e.key === "2") switchView("graph");
  if (e.key === "3") switchView("board");
  if (e.key === "4") switchView("app");
  if (e.key === "5") switchView("bugs");
  if (e.key === "6") switchView("releases");
  if (e.key === "7") switchView("incidents");
});

/* ==================== live mode ==================== */
function toast(message) {
  const el = document.getElementById("toast");
  el.textContent = message; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2200);
}
function pulseSpectrum() {
  const el = document.getElementById("spectrum");
  el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse");
}
function markLiveRefreshUnavailable(version) {
  const message = "Live refresh unavailable for version " + String(version) + "; copying is disabled. Retry on the next event or request attempt.";
  state.liveRefreshError = message;
  if (state.transitionPreview) {
    state.transitionPreview.staleReason = message;
    renderTransitionDialog(false);
  }
  renderAll(false);
  announce(message);
  toast(message);
}
function adoptData(envelope, version = null) {
  const previousData = state.data;
  const previousLiveError = state.liveRefreshError;
  const hadFeatures = featureNodes().length > 0;
  if (state.drag) cancelDrag("Live snapshot changed; active workflow drag canceled.");
  try {
    state.data = envelope;
    state.liveRefreshError = null;
    buildIndexes();
    renderAll(false);
    if (!hadFeatures && featureNodes().length > 0) {
      if (graph) applyGraphData(true);
      switchView("graph");
      toast("First feature landed - welcome to the graph");
    }
    if (state.selected && nodesById[state.selected]) {
      // The open panel is replaced in place, so focus on one of its controls is put back like the focus of the other regions.
      const savedPanelFocus = captureRenderFocus();
      renderPanel(nodesById[state.selected]);
      restoreRenderFocus(savedPanelFocus);
    } else if (state.selected) closePanel();
    else if (state.selectedRecord) {
      const entry = recordIndex.get(recordKey(state.selectedRecord));
      if (entry) {
        const savedRecordFocus = captureRenderFocus();
        renderRecordPanel(entry);
        restoreRenderFocus(savedRecordFocus);
      } else closePanel();
    }
    reconcileTransitionPreview();
    pulseSpectrum();
    confirmPendingAppliedStage(version);
  } catch (error) {
    state.data = previousData;
    state.liveRefreshError = previousLiveError;
    buildIndexes();
    renderAll(false);
    throw error;
  }
}
function initLive() {
  if (CONFIG.mode !== "live" || typeof EventSource === "undefined") return;
  let epoch = null;
  let lastVersion = null;
  let latestAnnouncedVersion = null;
  let pendingVersion = null;
  let refreshInFlight = null;
  let retryScheduled = false;
  let requestSequence = 0;
  const RETRY_DELAY = 1500;
  const source = new EventSource("/events");
  const maxVersion = (left, right) => left === null ? right : Math.max(left, right);
  const scheduleRetry = () => {
    if (retryScheduled || pendingVersion === null) return;
    retryScheduled = true;
    setTimeout(() => {
      retryScheduled = false;
      pump();
    }, RETRY_DELAY);
  };
  const pump = () => {
    if (refreshInFlight || retryScheduled || pendingVersion === null) return;
    const requestedVersion = pendingVersion;
    pendingVersion = null;
    const request = { id: ++requestSequence, version: requestedVersion };
    refreshInFlight = request;
    fetch("/data.json").then(response => {
      if (response && response.status === 401) {
        // The session ended (revoked grant or restarted server): say so instead of retrying a request that cannot succeed.
        invalidateBoardSession();
        const expired = new Error("board session expired");
        expired.sessionExpired = true;
        throw expired;
      }
      if (!response || response.ok === false || typeof response.json !== "function") throw new Error("live response missing JSON");
      return response.json();
    }).then(payload => {
      if (refreshInFlight !== request) return;
      const payloadVersion = Number(payload && payload.version);
      if (!payload || !payload.envelope || !Number.isFinite(payloadVersion)) {
        throw new Error("live payload missing envelope or version");
      }
      if (epoch !== null && payload.epoch !== epoch) throw new Error("live server changed during refresh");
      if (lastVersion !== null && payloadVersion < lastVersion) {
        throw new Error("live payload is older than the adopted snapshot");
      }
      if (latestAnnouncedVersion !== null && payloadVersion < latestAnnouncedVersion) {
        pendingVersion = maxVersion(pendingVersion, latestAnnouncedVersion);
        refreshInFlight = null;
        markLiveRefreshUnavailable(latestAnnouncedVersion);
        scheduleRetry();
        return;
      }
      adoptData(payload.envelope, payloadVersion);
      if (refreshInFlight !== request) return;
      refreshInFlight = null;
      lastVersion = payloadVersion;
      state.liveEpoch = epoch;
      state.liveVersion = payloadVersion;
      if (pendingVersion !== null && pendingVersion <= payloadVersion) pendingVersion = null;
      toast("Wiki changed - dashboard updated");
      pump();
    }).catch(error => {
      if (refreshInFlight !== request) return;
      refreshInFlight = null;
      if (error && error.sessionExpired) { markLiveRefreshUnavailable(requestedVersion); return; }
      pendingVersion = maxVersion(pendingVersion, requestedVersion);
      markLiveRefreshUnavailable(requestedVersion);
      scheduleRetry();
    });
  };
  source.onmessage = ev => {
    const version = parseInt(ev.data, 10);
    if (Number.isNaN(version)) return;
    const announcedEpoch = (ev.lastEventId || "").split(":")[0] || null;
    if (announcedEpoch !== epoch) {
      const serverRestarted = epoch !== null;
      epoch = announcedEpoch;
      state.liveEpoch = announcedEpoch;
      state.liveVersion = null;
      lastVersion = latestAnnouncedVersion = pendingVersion = null;
      refreshInFlight = null;
      retryScheduled = false;
      if (serverRestarted) markLiveRefreshUnavailable(version);
    }
    if (latestAnnouncedVersion !== null && version < latestAnnouncedVersion) return;
    latestAnnouncedVersion = maxVersion(latestAnnouncedVersion, version);
    if (lastVersion !== null && version <= lastVersion && pendingVersion === null && !refreshInFlight && !state.liveRefreshError) return;
    pendingVersion = maxVersion(pendingVersion, version);
    pump();
  };
  source.onerror = () => {
    markLiveRefreshUnavailable("disconnected");
    // The stream gives no status. A restarted server or a revoked grant answers it with 401 and the browser stops
    // retrying, so ask the session endpoint: a 401 there shows "Board session expired" instead of a silent STALE.
    if (connectedBoardExpected() && state.boardConnection !== "unauthenticated") boardJsonRequest("/api/board/v1/auth/session", "GET").catch(() => {});
  };
  setInterval(renderStatusline, 30000);
}

/* ==================== util & boot ==================== */
function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
buildIndexes();
initGraph();
renderAll(true);
initBoardService();
initLive();
</script>
