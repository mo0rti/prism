<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism — Product Truth</title>
<style>
/* ============================================================
   PRISM · spectrum terminal
   One idea in, a spectrum of product truth out.
   Identity: mono micro-type, editorial numbered sections,
   dot-grid paper, terminal-file cards, and the spectral
   hairline (light through the prism). Palette validated
   (dataviz six-checks, both themes, all 10 pairs).
   Phases: PO=blue · Design=amber · Dev=aqua · Done=green ·
   App=orange · context=recessive neutral.
   ============================================================ */
:root, html[data-theme="dark"] {
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #222221;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --hairline: rgba(255,255,255,0.10);
  --dot: rgba(255,255,255,0.05);
  --po: #3987e5;
  --design: #c98500;
  --dev: #199e70;
  --done: #008300;
  --app: #d95926;
  --context: #898781;
  --warning: #fab219;
  --critical: #d03b3b;
  --good: #0ca30c;
  --glow: 1;
  --chip-wash: rgba(255,255,255,0.06);
}
html[data-theme="light"] {
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f2f1ee;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --hairline: rgba(11,11,11,0.10);
  --dot: rgba(11,11,11,0.07);
  --po: #2a78d6;
  --design: #eda100;
  --dev: #1baf7a;
  --done: #008300;
  --app: #eb6834;
  --context: #898781;
  --warning: #b97e00;
  --critical: #d03b3b;
  --good: #006300;
  --glow: 0;
  --chip-wash: rgba(11,11,11,0.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background-color: var(--page);
  background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.1px);
  background-size: 26px 26px;
  color: var(--ink);
  overflow: hidden;
  transition: background-color .4s ease, color .4s ease;
}
code, .stat .label, .stat .value, .sec-label, .kind-chip, .statusline, .chip,
.type-chip, .owner-chip, .views button, .pipe-num, .pipe-who, .freshness,
.card .cid, .column h3, .meta .k, .section h4, .badge, .conn .kind, .diag,
.termbar, .step .num, .cmd-tabs button, .copy-btn, .legend-head, .legend-body b,
.status-light, .here-tag, .evidence, .wordmark {
  font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
}
.app { display: flex; flex-direction: column; height: 100vh; }

/* ---------- header + spectral hairline ---------- */
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding: 11px 20px 9px;
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  backdrop-filter: blur(8px);
  z-index: 30;
}
.prism-glyph {
  width: 19px; height: 19px; flex: none;
  background: conic-gradient(from 210deg, var(--po), var(--design), var(--dev), var(--app), var(--po));
  clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
}
.wordmark { font-size: 12px; letter-spacing: .38em; font-weight: 700; white-space: nowrap; }
.wordmark span { color: var(--muted); font-weight: 400; letter-spacing: .1em; text-transform: lowercase; }
.project-name { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kind-chip {
  font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink-2); border: 1px solid var(--hairline); border-radius: 3px;
  padding: 3px 8px; white-space: nowrap;
}
.header-right { margin-left: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px 16px; min-width: 0; max-width: 100%; }
.status-light { display: flex; align-items: center; gap: 7px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); cursor: pointer; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; }
.status-dot.high { background: var(--good); box-shadow: 0 0 8px color-mix(in srgb, var(--good) 60%, transparent); }
.status-dot.degraded { background: var(--warning); box-shadow: 0 0 8px color-mix(in srgb, var(--warning) 60%, transparent); }
.status-dot.error { background: var(--critical); box-shadow: 0 0 8px color-mix(in srgb, var(--critical) 60%, transparent); }
.freshness { font-size: 9.5px; letter-spacing: .14em; color: var(--muted); display: flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; text-transform: uppercase; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); animation: pulse 1.8s ease-in-out infinite; }
.live-dot.stale { background: var(--critical); animation: none; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .4; transform: scale(.75);} }
.theme-toggle {
  border: 1px solid var(--hairline); background: transparent; color: var(--ink-2);
  border-radius: 4px; width: 29px; height: 29px; cursor: pointer; font-size: 13px;
  display: grid; place-items: center; transition: transform .5s cubic-bezier(.2,.9,.3,1.4), background .2s;
}
.theme-toggle:hover { background: var(--chip-wash); transform: rotate(40deg); }

.spectrum {
  height: 2px; flex: none; z-index: 29;
  background: linear-gradient(90deg, var(--po), var(--design), var(--dev), var(--done), var(--app), var(--po));
  background-size: 300% 100%;
  animation: spectrumDrift 18s linear infinite;
}
.spectrum.pulse { animation: spectrumPulse 1.1s cubic-bezier(.2,.8,.3,1) 1, spectrumDrift 18s linear infinite; }
@keyframes spectrumDrift { from { background-position: 0% 0; } to { background-position: 300% 0; } }
@keyframes spectrumPulse { 0% { filter: brightness(2.4) saturate(1.8); } 100% { filter: none; } }

/* ---------- editorial section labels ---------- */
.sec-label {
  font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: 10px; margin-top: 34px;
}
.sec-label b { color: var(--po); font-weight: 700; letter-spacing: .2em; }
.sec-label::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }

/* ---------- terminal-file card chrome (user motif, kept) ---------- */
.termcard { border: 1px solid var(--hairline); border-radius: 12px; background: var(--surface); overflow: hidden; }
.termbar {
  display: flex; align-items: center; gap: 6px; padding: 9px 14px;
  border-bottom: 1px solid var(--hairline); background: var(--surface-2);
  font-size: 9px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted);
}
.termbar .tdot { width: 9px; height: 9px; border-radius: 50%; background: var(--hairline); }
.termbar .fname { margin-left: 8px; }

/* ---------- guide (first-run teaching) view ---------- */
#firstrun-view { padding: 26px clamp(20px, 6vw, 90px) 60px; }
.fr-headline { font-size: clamp(26px, 4vw, 40px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; margin: 16px 0 10px; }
.fr-headline em { font-style: normal; background: linear-gradient(90deg, var(--po), var(--design), var(--dev), var(--done)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.fr-sub { font-size: 13.5px; color: var(--ink-2); max-width: 660px; line-height: 1.65; margin-bottom: 8px; }
.fr-sub code { font-size: 11.5px; background: var(--chip-wash); border: 1px solid var(--hairline); border-radius: 4px; padding: 1px 6px; }

.pipeline { margin: 18px 0 6px; padding: 30px 26px 18px; overflow-x: auto; }
.pipe-track { display: flex; align-items: flex-start; min-width: 640px; position: relative; }
.pipe-stage { flex: 1; min-width: 84px; display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; cursor: pointer; }
.pipe-stage + .pipe-stage::before {
  content: ""; position: absolute; right: 50%; top: 21px; width: calc(100% - 52px); height: 0;
  border-top: 2px dotted var(--grid); transform: translateX(calc(-50% + 26px)); z-index: 0;
}
.pipe-circle {
  width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--stage-c, var(--muted));
  display: grid; place-items: center; background: var(--surface); z-index: 1;
  transition: transform .25s cubic-bezier(.2,.9,.3,1.4);
  animation: popIn .6s cubic-bezier(.2,.9,.3,1.35) both; animation-delay: var(--d, 0s);
}
.pipe-stage:hover .pipe-circle { transform: scale(1.12); }
.pipe-stage.focus .pipe-circle { background: color-mix(in srgb, var(--stage-c) 14%, var(--surface)); }
.pipe-stage.here .pipe-circle {
  box-shadow: 0 0 0 5px color-mix(in srgb, var(--stage-c) 22%, transparent);
  animation: popIn .6s cubic-bezier(.2,.9,.3,1.35) both, herePulse 2.4s ease-in-out infinite 1s;
}
@keyframes herePulse { 0%,100% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--stage-c) 22%, transparent);} 50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--stage-c) 9%, transparent);} }
@keyframes popIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
.pipe-num { font-size: 12px; font-weight: 700; color: var(--stage-c, var(--muted)); }
.pipe-name { font-size: 10px; letter-spacing: .18em; font-weight: 700; }
.pipe-who { font-size: 8.5px; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
.pipe-who.you { color: var(--app); font-weight: 700; }
.pipe-detail {
  margin: 18px 26px 0; padding: 13px 2px 14px; border-top: 1px solid var(--hairline);
  font-size: 12.5px; color: var(--ink-2); min-height: 44px; line-height: 1.6;
}
.pipe-detail code { font-size: 11px; background: var(--chip-wash); border: 1px solid var(--hairline); border-radius: 4px; padding: 1px 6px; }
.pipe-spark { position: absolute; top: 19px; left: 0; width: 5px; height: 5px; border-radius: 50%;
  background: var(--ink); opacity: 0; z-index: 0; /* travels BEHIND the circles */
  box-shadow: 0 0 9px var(--ink); pointer-events: none; }
.pipe-circle { transition: transform .25s cubic-bezier(.2,.9,.3,1.4), box-shadow .3s ease, background .3s ease; }
.pipe-stage.lit .pipe-circle {
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--stage-c) 30%, transparent), 0 0 18px color-mix(in srgb, var(--stage-c) 55%, transparent);
  background: color-mix(in srgb, var(--stage-c) 12%, var(--surface));
}

/* setup steps */
.steps-wrap { margin-top: 18px; }
.step { display: flex; gap: 16px; padding: 16px 22px; border-top: 1px solid var(--hairline); }
.steps-wrap .termbar + .step { border-top: 0; }
.step.done { padding: 10px 22px; opacity: .6; }
.step.current { background: color-mix(in srgb, var(--po) 5%, transparent); box-shadow: inset 3px 0 0 var(--po); }
.step .num {
  width: 24px; height: 24px; flex: none; border-radius: 50%; display: grid; place-items: center;
  font-size: 10.5px; font-weight: 700; border: 1.5px solid var(--muted); color: var(--muted);
}
.step.done .num { background: var(--good); border-color: var(--good); color: #fff; }
.step.current .num { border-color: var(--po); color: var(--po); }
.step .what { font-size: 13.5px; font-weight: 700; letter-spacing: -0.01em; }
.step.current .what { font-size: 15px; }
.step .how { font-size: 12px; color: var(--ink-2); margin-top: 4px; line-height: 1.6; max-width: 580px; }
.step .how code { font-size: 11px; background: var(--chip-wash); border: 1px solid var(--hairline); border-radius: 4px; padding: 1px 6px; }
.evidence { font-size: 10px; color: var(--good); margin-top: 3px; letter-spacing: .06em; }
.here-tag { font-size: 8.5px; letter-spacing: .26em; color: var(--po); font-weight: 700; margin-left: 12px; }

/* command block with agent-surface tabs */
.cmdblock { margin-top: 12px; max-width: 580px; border: 1px solid var(--hairline); border-radius: 9px; overflow: hidden; background: var(--page); }
.cmd-tabs { display: flex; border-bottom: 1px solid var(--hairline); background: var(--surface-2); }
.cmd-tabs button {
  border: 0; background: transparent; color: var(--muted);
  font-size: 9px; letter-spacing: .18em; padding: 7px 14px; cursor: pointer; text-transform: uppercase;
}
.cmd-tabs button.active { color: var(--ink); background: var(--page); font-weight: 700; }
.cmd-body { display: flex; align-items: center; gap: 12px; padding: 13px 15px; }
.cmd-body code { flex: 1; font-size: 14.5px; font-weight: 600; background: none; border: 0; color: var(--ink); }
.cmd-body code .prompt { color: var(--dev); margin-right: 9px; }
.copy-btn {
  border: 1px solid var(--hairline); background: var(--surface); color: var(--ink);
  border-radius: 6px; font-size: 10px; letter-spacing: .16em; padding: 8px 18px; cursor: pointer;
  text-transform: uppercase; font-weight: 700; transition: all .15s ease; flex: none;
}
.copy-btn:hover { background: var(--chip-wash); border-color: var(--ink-2); }
.copy-btn.copied { color: var(--good); border-color: var(--good); }

/* ---------- stat row ---------- */
.statrow { display: flex; align-items: stretch; gap: 12px; padding: 14px 20px 4px; z-index: 20; }
.stat {
  min-width: 112px; padding: 10px 14px 11px;
  border: 1px solid var(--hairline); border-radius: 10px; background: var(--surface);
  animation: rise .55s cubic-bezier(.2,.8,.25,1) both;
}
.stat:nth-child(2) { animation-delay: .05s; } .stat:nth-child(3) { animation-delay: .1s; }
.stat:nth-child(4) { animation-delay: .15s; } .stat:nth-child(5) { animation-delay: .2s; } .stat:nth-child(6) { animation-delay: .25s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.stat .label { font-size: 9px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
.stat .value { font-size: 25px; font-weight: 700; letter-spacing: -0.02em; margin-top: 3px; font-variant-numeric: tabular-nums; }
.stat .value.alert { color: var(--critical); }
.stat .sub { font-size: 10px; color: var(--ink-2); margin-top: 1px; }
.stagebar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 7px; padding: 10px 4px; }
.stagebar .bars { display: flex; height: 13px; border-radius: 4px; overflow: hidden; gap: 2px; }
.stagebar .seg { min-width: 3px; border-radius: 3px; transition: flex-grow .8s cubic-bezier(.2,.8,.25,1); }
.stagebar .legendline { display: flex; gap: 14px; font-size: 8.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); flex-wrap: wrap; font-family: ui-monospace, Consolas, monospace; }
.legendline i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }

/* ---------- toolbar ---------- */
.toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 20px; flex-wrap: wrap; z-index: 20; }
.views { display: flex; border: 1px solid var(--hairline); border-radius: 8px; overflow: hidden; background: var(--surface); }
.views button {
  border: 0; background: transparent; color: var(--muted); font-size: 10px; letter-spacing: .18em;
  text-transform: uppercase; padding: 8px 16px; cursor: pointer; transition: color .2s, background .2s;
}
.views button.active { background: var(--chip-wash); color: var(--ink); font-weight: 700; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font-size: 9px; letter-spacing: .14em; text-transform: uppercase; padding: 6px 11px;
  border-radius: 5px; cursor: pointer; border: 1px solid var(--hairline); color: var(--muted);
  background: transparent; transition: all .18s ease; user-select: none;
}
.chip.on { color: var(--ink); border-color: color-mix(in srgb, var(--ink) 32%, transparent); background: var(--chip-wash); }
.chip i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.chip .n { color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; }
.search {
  margin-left: auto; display: flex; align-items: center; gap: 7px;
  border: 1px solid var(--hairline); border-radius: 8px; padding: 6px 11px; background: var(--surface);
}
.search input { border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; font-size: 12.5px; width: 180px; }
.search .hint { font-size: 9.5px; color: var(--muted); border: 1px solid var(--hairline); border-radius: 4px; padding: 1px 6px; font-family: ui-monospace, Consolas, monospace; }

/* ---------- main views ---------- */
main { position: relative; flex: 1; overflow: hidden; }
.view { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .35s ease; overflow: auto; }
.view.active { opacity: 1; pointer-events: auto; }
#graph-view { overflow: hidden; }
#graph-canvas { position: absolute; inset: 0; }

.graph-legend {
  position: absolute; left: 16px; bottom: 12px; z-index: 10;
  background: color-mix(in srgb, var(--surface) 90%, transparent);
  border: 1px solid var(--hairline); border-radius: 9px;
  font-size: 11px; color: var(--ink-2); backdrop-filter: blur(6px);
  max-width: 330px; overflow: hidden;
}
.legend-head {
  display: flex; align-items: center; gap: 8px; padding: 7px 12px; cursor: pointer;
  font-size: 9px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted);
}
.legend-head .tri { transition: transform .25s; font-size: 8px; }
.graph-legend.open .legend-head .tri { transform: rotate(90deg); }
.legend-body { display: none; padding: 2px 13px 11px; grid-template-columns: auto auto; gap: 5px 18px; }
.graph-legend.open .legend-body { display: grid; }
.legend-body b { grid-column: 1 / -1; font-size: 8.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-top: 4px; }
.lg { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.lg i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.lg i.hex { clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%); border-radius: 0; }
.lg i.ring { background: transparent !important; border: 2px dashed var(--warning); }
.lg i.err { background: transparent !important; border: 2px dashed var(--critical); }
.lg i.warn { background: transparent !important; border: 2px dashed var(--warning); }
.lg i.badge-i { background: var(--critical); width: 7px; height: 7px; }

.empty-state { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink-2); pointer-events: none; }
.empty-state[hidden] { display: none; }

/* ---------- board ---------- */
#board-view { padding: 16px 20px 24px; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(198px, 1fr); gap: 12px; min-height: 100%; }
.column { background: var(--surface); border: 1px solid var(--hairline); border-radius: 11px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 220px; }
.column.intake-col { border-style: dashed; }
.column h3 {
  font-size: 9px; letter-spacing: .2em; text-transform: uppercase; font-weight: 700;
  padding: 4px 6px 8px; display: flex; align-items: center; gap: 7px; color: var(--ink-2);
}
.column h3 i { width: 9px; height: 9px; border-radius: 3px; }
.column h3 .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.card {
  background: var(--surface-2); border: 1px solid var(--hairline); border-left: 3px solid var(--stage-color, var(--muted));
  border-radius: 8px; padding: 9px 11px; cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease;
  animation: rise .45s cubic-bezier(.2,.8,.25,1) both; animation-delay: var(--stagger, 0s);
}
.card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.card:focus-visible, .fchip:focus-visible, .conn:focus-visible { outline: 2px solid var(--po); outline-offset: 2px; }
[role="button"]:focus-visible { outline: 2px solid var(--po); outline-offset: 2px; }
.card.dragging { opacity: .56; transform: scale(.985); }
.card .cid { font-size: 9px; color: var(--muted); letter-spacing: .12em; }
.card .ctitle { font-size: 12.5px; font-weight: 650; margin: 3px 0 4px; }
.card-actions { display: flex; align-items: flex-start; flex-direction: column; gap: 5px; margin-top: 8px; }
.prepare-btn {
  border: 1px solid color-mix(in srgb, var(--po) 55%, transparent); background: transparent; color: var(--po);
  border-radius: 5px; padding: 5px 8px; cursor: pointer; font: 700 8.5px ui-monospace, Consolas, monospace;
  letter-spacing: .08em; text-transform: uppercase; transition: background .15s, border-color .15s;
}
.prepare-btn:hover { background: color-mix(in srgb, var(--po) 10%, transparent); border-color: var(--po); }
.prepare-btn[aria-disabled="true"] { color: var(--muted); border-color: var(--hairline); cursor: help; }
.prepare-btn[aria-disabled="true"]:hover { background: var(--chip-wash); }
.transition-hint { color: var(--muted); font-size: 9px; line-height: 1.35; }
.transition-action-picker { display: flex; width: 100%; min-width: 0; }
.transition-action-select { width: 100%; min-width: 0; max-width: 100%; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 5px; padding: 5px 7px; font: 9px ui-monospace, Consolas, monospace; }
.transition-action-select:focus-visible { outline: 2px solid var(--po); outline-offset: 2px; }
.drop-ready { border-color: var(--po); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--po) 36%, transparent); }
.drop-invalid { border-color: color-mix(in srgb, var(--warning) 55%, transparent); }
.badges { display: flex; gap: 5px; flex-wrap: wrap; }
.badge { font-size: 8.5px; letter-spacing: .1em; padding: 2px 7px; border-radius: 4px; font-weight: 700; text-transform: uppercase; }
.badge.blocked { color: var(--critical); border: 1px solid color-mix(in srgb, var(--critical) 45%, transparent); }
.badge.advisory { color: var(--warning); border: 1px solid color-mix(in srgb, var(--warning) 55%, transparent); }
.badge.broken { color: var(--muted); border: 1px dashed var(--muted); }
.card.intake { --stage-color: var(--muted); }

/* ---------- apps ---------- */
#app-view { padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 12px; }

.lane h3 { display: flex; align-items: center; gap: 9px; font-size: 12px; letter-spacing: .08em; margin-bottom: 10px; font-family: ui-monospace, Consolas, monospace; }

.lane h3 .count { margin-left: auto; font-size: 9.5px; color: var(--muted); letter-spacing: .12em; }

.fchip {

}
.panel.open { transform: none; }
.panel-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--hairline); }
.panel-head .row { display: flex; align-items: center; gap: 8px; }
.type-chip { font-size: 8.5px; letter-spacing: .18em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--hairline); color: var(--ink-2); }

.panel-head h2 { font-size: 17px; font-weight: 750; letter-spacing: -0.015em; margin-top: 7px; }
.panel-close { margin-left: auto; border: 0; background: transparent; color: var(--muted); font-size: 16px; cursor: pointer; }
.panel-body { padding: 14px 18px 20px; display: flex; flex-direction: column; gap: 16px; }
.meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 12px; }
.meta { border: 1px solid var(--hairline); border-radius: 8px; padding: 7px 10px; }
.meta .k { font-size: 8.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }

.section h4 { font-size: 9px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.blocker-item { border-left: 3px solid var(--critical); background: var(--chip-wash); border-radius: 6px; padding: 9px 11px; font-size: 12px; margin-bottom: 6px; }
.blocker-item .code { font-size: 9px; letter-spacing: .12em; color: var(--critical); font-weight: 700; text-transform: uppercase; font-family: ui-monospace, Consolas, monospace; }
.unblock { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 10.5px; color: var(--ink-2); flex-wrap: wrap; }

.owner-chip { font-size: 8.5px; letter-spacing: .18em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--hairline); color: var(--ink-2); }
.conn { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.conn:hover { background: var(--chip-wash); }
.conn .kind { font-size: 8.5px; color: var(--muted); letter-spacing: .12em; min-width: 92px; text-transform: uppercase; }
.conn i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.pathrow { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--ink-2); font-family: ui-monospace, Consolas, monospace; }
.pathrow code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; direction: rtl; text-align: left; background: none; border: 0; padding: 0; }
.pathrow a {

}

/* ---------- copy-only transition preview ---------- */
.transition-backdrop {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  padding: 18px; background: rgba(0,0,0,.58); backdrop-filter: blur(4px);
}

.transition-dialog {
  width: min(640px, 100%); max-height: min(88vh, 760px); overflow: auto;

.transition-request { border: 1px solid var(--hairline); border-radius: 8px; background: var(--page); padding: 10px; }

.transition-request pre { margin-top: 7px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); font: 11px/1.55 ui-monospace, Consolas, monospace; user-select: text; }
.connected-review { border: 1px solid var(--hairline); border-radius: 8px; padding: 10px; font-size: 11.5px; line-height: 1.45; }
.connected-review label { display: flex; gap: 8px; align-items: flex-start; color: var(--ink-2); }
.connected-review input { margin-top: 2px; accent-color: var(--po); }
.connected-review textarea { width: 100%; min-height: 68px; margin-top: 8px; resize: vertical; border: 1px solid var(--hairline); border-radius: 6px; padding: 8px; background: var(--page); color: var(--ink); font: 11px/1.45 ui-monospace, Consolas, monospace; }
.connected-write { border: 1px solid var(--hairline); border-radius: 7px; overflow: hidden; }
.connected-write summary { padding: 8px 10px; background: var(--page); cursor: pointer; font: 10px ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
.connected-write-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--hairline); }
.connected-write-grid > div { min-width: 0; padding: 8px; }
.connected-write-grid > div + div { border-left: 1px solid var(--hairline); }
.connected-write-grid h5 { margin: 0 0 6px; color: var(--muted); font: 8.5px ui-monospace, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; }
.connected-write-grid pre { max-height: 220px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); font: 10px/1.45 ui-monospace, Consolas, monospace; user-select: text; }
.board-session { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 9px; letter-spacing: .07em; }
.board-session button { border: 1px solid var(--hairline); border-radius: 5px; padding: 4px 7px; background: transparent; color: var(--ink-2); cursor: pointer; font: inherit; }
.board-session button:hover { background: var(--chip-wash); color: var(--ink); }
.board-session .actor { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.transition-copy-status { min-height: 16px; margin-top: 7px; color: var(--warning); font-size: 11px; line-height: 1.4; }
.transition-actions { display: flex; justify-content: flex-end; gap: 8px; align-items: center; flex-wrap: wrap; flex: none; padding: 12px 20px; border-top: 1px solid var(--hairline); background: var(--surface); }
.transition-actions button { min-height: 34px; }
.transition-actions .cancel-btn { border: 1px solid var(--hairline); background: transparent; color: var(--ink-2); border-radius: 6px; padding: 8px 14px; cursor: pointer; font: 700 9px ui-monospace, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; }
.transition-actions .cancel-btn:hover { background: var(--chip-wash); color: var(--ink); }
.transition-actions .copy-request[aria-disabled="true"] { color: var(--muted); border-color: var(--hairline); cursor: not-allowed; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

/* ---------- statusline (in flow: nothing can overlap it) ---------- */
.statusline {
  flex: none; display: flex; align-items: center; gap: 18px;
  height: 30px; padding: 0 20px; z-index: 31;
  border-top: 1px solid var(--hairline);
  background: color-mix(in srgb, var(--surface) 92%, transparent);

  cursor: pointer; user-select: none; white-space: nowrap; overflow: hidden;
}
.statusline .sev-clean { color: var(--good); font-weight: 700; }
.statusline .sev-error { color: var(--critical); font-weight: 700; }
.statusline .sev-warning { color: var(--warning); font-weight: 700; }
.statusline .right { margin-left: auto; display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
.diagpanel {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 42vh; z-index: 26; overflow: auto;
  background: color-mix(in srgb, var(--surface) 97%, transparent); border-top: 1px solid var(--hairline);
  transform: translateY(102%); transition: transform .3s cubic-bezier(.25,.9,.3,1); padding: 12px 20px;
  backdrop-filter: blur(10px); visibility: hidden;
}
.diagpanel.open { transform: none; visibility: visible; }
.diag { display: flex; gap: 12px; align-items: baseline; padding: 5px 0; font-size: 11px; border-bottom: 1px solid var(--hairline); }
.diag .sev { font-size: 8.5px; font-weight: 700; letter-spacing: .16em; min-width: 62px; text-transform: uppercase; }
.diag .sev.error { color: var(--critical); } .diag .sev.warning { color: var(--warning); }
.diag .code { color: var(--ink-2); min-width: 210px; font-size: 10px; }
.diag .msg { color: var(--ink-2); flex: 1; font-family: system-ui, sans-serif; font-size: 11.5px; }

.toast {
  position: fixed; top: 14px; left: 50%; transform: translate(-50%, -70px); z-index: 40;
  background: var(--surface); border: 1px solid var(--hairline); color: var(--ink);
  border-radius: 6px; padding: 8px 16px; font-size: 11px; letter-spacing: .04em;
  transition: transform .4s cubic-bezier(.2,.9,.3,1.3);
  box-shadow: 0 8px 30px rgba(0,0,0,.28);
  font-family: ui-monospace, Consolas, monospace;
}
.toast.show { transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .pipe-spark { display: none; }
}

@media (max-width: 700px) {
  header { flex-wrap: wrap; padding: 10px 12px 8px; gap: 8px 10px; }
  .project-name { flex: 1 1 90px; }
  .header-right { flex: 1 0 100%; justify-content: flex-end; margin-left: 0; gap: 12px; }

  .statrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 10px 12px 4px; }
  .stat { min-width: 0; padding: 8px 9px 9px; }
  .stat .label { font-size: 8px; letter-spacing: .14em; white-space: nowrap; }

  .stat .sub { font-size: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stagebar { grid-column: 1 / -1; min-width: 0; padding: 7px 2px; }
  .stagebar .legendline { gap: 8px; font-size: 7.5px; }

  .toolbar { padding: 8px 12px; gap: 8px; }
  .views { max-width: 100%; flex: 1 1 100%; }
  .views button { flex: 1; padding: 8px 10px; letter-spacing: .1em; }
  .chips { width: 100%; }
  .search { flex: 1 1 100%; min-width: 0; margin-left: 0; }
  .search input { width: 100%; min-width: 0; }

  #board-view, #app-view { padding: 12px; }
  #board-view { overflow-x: auto; }
  .board { grid-auto-flow: column; grid-auto-columns: minmax(236px, 74vw); grid-template-columns: none; width: max-content; min-width: 100%; min-height: auto; }
  .column { min-width: 236px; min-height: 0; }
  .panel { width: min(348px, 100%); }
  .transition-grid { grid-template-columns: 1fr; }
  .connected-write-grid { grid-template-columns: 1fr; }

  .transition-backdrop { padding: 10px; }

}

<div class="app" id="app-shell">
  <header>

<script>
"use strict";
/* ==================== data & state ==================== */
const ENVELOPE = JSON.parse(document.getElementById("prism-data").textContent);
const CONFIG = JSON.parse(document.getElementById("prism-config").textContent);
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const STAGES = ["raw", "specified", "ready-for-design", "in-design", "ready-for-dev", "in-dev", "done"];
const STAGE_PHASE = { raw: "po", specified: "po", "ready-for-design": "design", "in-design": "design", "ready-for-dev": "dev", "in-dev": "dev", done: "done" };
const READY_STAGES = new Set(["ready-for-design", "ready-for-dev"]);
const CONTEXT_TYPES = ["design", "app-requirement", "api-contract", "business-rule", "persona", "decision", "advisory-review"];
const TYPE_LABELS = {
  feature: "Features", app: "Apps", design: "Design", "app-requirement": "Requirements",
  "api-contract": "Contracts", "business-rule": "Rules", persona: "Personas", decision: "Decisions", "advisory-review": "Reviews",
};
const SURFACES = [
  { id: "claude", label: "Claude Code", prefix: "/" },
  { id: "codex", label: "Codex", prefix: "$" },
  { id: "cursor", label: "Cursor", prefix: null },
];

const PIPE_STAGES = [
  { n: "01", name: "CAPTURE", who: "YOU", color: "po", cmd: null, desc: "Drop a markdown brief into <code>knowledge/intake/pending/</code> — the template in that folder shows the shape. A few honest paragraphs beat a perfect spec." },
  { n: "02", name: "INTAKE", who: "AGENT", color: "po", cmd: "po-specify", desc: "Your agent reads the brief, asks you to confirm its interpretation, then prepares the feature specification. Nothing is written without your confirmation." },
  { n: "03", name: "CLARIFY", who: "PO", color: "po", cmd: "po-clarify", desc: "Open questions get answered by their owner: <code>po-clarify</code> for the PO, <code>design-clarify</code> for the designer and <code>dev-clarify</code> for the developer. Clarification stays stage-neutral until its workflow is confirmed." },
  { n: "04", name: "DESIGN", who: "DESIGNER", color: "design", cmd: "design-intake", desc: "Design artifacts attach to the feature; UI states and interactions get covered before development starts." },
  { n: "05", name: "BOARD", who: "ADVISORY", color: "design", cmd: "board-review", desc: "Domain-sensitive features pass the advisory board — project-specific expert personas reviewing conflicts, gaps, and risk before a line of code." },
  { n: "06", name: "BUILD", who: "DEV", color: "dev", cmd: "prep-sprint", desc: "Review app requirements and source evidence before development; the dashboard prepares a request but never starts a host job." },
  { n: "07", name: "SHIP", who: "TEAM", color: "done", cmd: "dev-done", desc: "Shipped evidence is reviewed before the wiki records completion. Reopen requests keep the next destination explicit." },
];

const state = {
  data: ENVELOPE,
  view: "graph",
  visibleTypes: new Set(["feature", "app"]),
  query: "",
  selected: null,
  hovered: null,
  theme: null,
  surface: (function () { try { return localStorage.getItem("prism-surface") || "claude"; } catch (e) { return "claude"; } })(),
  mountedAt: performance.now(),
  pipeFocus: null,
  transitionPreview: null,
  drag: null,
  panelReturnFocus: null,
  transitionBackground: null,
  liveRefreshError: null,
  boardConnection: "checking",
  boardActor: null,
  boardCsrf: null,
  boardDiscover: null,
  boardCapability: null,
  boardPendingOperations: [],
  boardOperation: null,
  boardViewStale: false,
  pendingAppliedStage: null,
  liveEpoch: null,
  liveVersion: null,
};

// Declared before the theme initializer runs — the boot render path touches these.
let graph = null;
let sparkRAF = null;
let fitTimer = null;

let nodesById = {}, neighbors = {}, blockedIds = new Set(), blockersByFeature = {}, degree = {};
let duplicateNodeIds = new Set(), duplicateFeatureIds = new Set();
function buildIndexes() {
  nodesById = {}; neighbors = {}; blockedIds = new Set(); blockersByFeature = {}; degree = {};
  duplicateNodeIds = new Set(); duplicateFeatureIds = new Set();
  const seenNodeIds = new Set(), seenFeatureIds = new Set();
  for (const n of state.data.facts.nodes) {
    if (seenNodeIds.has(n.id)) duplicateNodeIds.add(n.id);
    seenNodeIds.add(n.id);
    const featureId = n.type === "feature" ? canonicalFeatureId(n) : null;
    if (featureId !== null && seenFeatureIds.has(featureId)) duplicateFeatureIds.add(featureId);
    if (featureId !== null) seenFeatureIds.add(featureId);
    nodesById[n.id] = n; neighbors[n.id] = new Set(); degree[n.id] = 0;
  }

function boardJsonRequest(path, method, body) {
  const verb = method || "GET";
  const headers = { Accept: "application/json" };
  const options = { method: verb, headers, credentials: "same-origin", cache: "no-store" };
  if (body !== undefined) {
    headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  if (verb !== "GET" && state.boardCsrf) headers["X-Prism-CSRF"] = state.boardCsrf;
  return fetch(path, options).then(response => {
    const raw = response && typeof response.json === "function" ? response.json() : Promise.resolve({});
    const parsed = raw && typeof raw.catch === "function" ? raw.catch(() => ({})) : raw;
    return parsed.then(payload => {
      if (!response || response.ok === false) {
        const error = new Error(payload && payload.error && payload.error.message || "The connected board request could not be completed.");
        error.status = response && response.status;
        error.code = payload && payload.error && payload.error.code;
        if (error.status === 401) invalidateBoardSession();
        throw error;
      }
      return payload || {};
    });
  });
}

    const pending = Array.isArray(state.boardPendingOperations) ? state.boardPendingOperations : [];
    const actorText = `${boundedText(actor.name || actor.participant_id || "Human participant", 80)} · ${actor.kind === "human" ? "human" : "participant"}${actor.writable === true ? " · writable" : " · read only"}`;

  } else if (state.boardConnection === "unauthenticated") {

  } else if (state.boardConnection === "error") {

  if (!track || !spark) return;
  const PERIOD = 7000, LIT_RADIUS = 30;
  const t0 = performance.now();
  (function frame(now) {
    if (!track.isConnected) { sparkRAF = null; return; }
    const stages = track.querySelectorAll(".pipe-stage");
    if (!stages.length) { sparkRAF = null; return; }
    const phase = ((now - t0) % PERIOD) / PERIOD;
    const first = stages[0], last = stages[stages.length - 1];
    const startX = first.offsetLeft + first.offsetWidth / 2;
    const endX = last.offsetLeft + last.offsetWidth / 2;
    const x = startX + (endX - startX) * phase;
    spark.style.left = x + "px";
    spark.style.opacity = phase < 0.03 || phase > 0.97 ? "0" : "0.85";
    stages.forEach(stage => {
      const cx = stage.offsetLeft + stage.offsetWidth / 2;
      stage.classList.toggle("lit", Math.abs(cx - x) < LIT_RADIUS);
    });
    sparkRAF = requestAnimationFrame(frame);
  })(t0);
}

/* ==================== stats ==================== */
function tickValue(el, target) {
  if (REDUCED || target === 0) { el.textContent = target; return; }
  const start = performance.now(), dur = 500;
  (function frame(now) {
    const t = Math.min(1, (now - start) / dur);
    el.textContent = Math.round(target * (1 - Math.pow(1 - t, 3)));
    if (t < 1) requestAnimationFrame(frame);
  })(start);
}
function renderStats() {
  const feats = featureNodes();
  const inFlight = feats.filter(f => ["ready-for-design", "in-design", "ready-for-dev", "in-dev"].includes(f.status)).length;
  const done = feats.filter(f => f.status === "done").length;
  const malformedCount = state.data.facts.nodes.filter(n => n.health === "error").length;
  const warningCount = state.data.facts.nodes.filter(n => n.health === "warning").length;
  const intake = intakeFacts();
  const stat = (label, value, sub, alert) =>
    `<div class="stat"><div class="label">${escapeHtml(label)}</div><div class="value${alert ? " alert" : ""}" data-tick="${value}">0</div><div class="sub">${escapeHtml(sub || "")}</div></div>`;
  let html = "";
  html += stat("Intake", intake.pending.length + intake.quarantined.length,
    intake.quarantined.length ? `${intake.quarantined.length} quarantined` : "ideas waiting", intake.quarantined.length > 0);
  html += stat("Features", feats.length, `${state.data.facts.edge_count} connections`);
  html += stat("In flight", inFlight, "design + dev");
  html += stat("Blocked", blockedIds.size, blockedIds.size ? "needs attention" : "clear", blockedIds.size > 0);
  html += stat("Done", done, done ? "shipped" : "");
  if (malformedCount) html += stat("Integrity", malformedCount, "malformed pages", true);
  if (warningCount) html += stat("Warnings", warningCount, "needs review");
  const counts = STAGES.map(s => feats.filter(f => f.status === s).length);
  const total = counts.reduce((a, b) => a + b, 0);
  const denominator = Math.max(1, total);
  const segs = STAGES.map((s, i) => counts[i] ? `<div class="seg" style="flex-grow:${counts[i] / denominator};background:${C[STAGE_PHASE[s]]};opacity:${READY_STAGES.has(s) ? .55 : 1}" title="${s}: ${counts[i]}"></div>` : "").join("");
  const legend = ["po", "design", "dev", "done"].map(p => `<span><i style="background:${C[p]}"></i>${{ po: "PO", design: "Design", dev: "Dev", done: "Done" }[p]}</span>`).join("");
  html += `<div class="stagebar"><div class="bars">${segs}</div><div class="legendline">${legend}<span style="margin-left:auto">${total} FEATURE${total === 1 ? "" : "S"} ACROSS THE LIFECYCLE</span></div></div>`;
  const row = document.getElementById("statrow");
  row.innerHTML = html;
  row.querySelectorAll("[data-tick]").forEach(el => tickValue(el, parseInt(el.dataset.tick, 10)));
}

/* ==================== graph view ==================== */
function visibleGraphData() {
  const nodes = state.data.facts.nodes.filter(n => state.visibleTypes.has(n.type));
  const ids = new Set(nodes.map(n => n.id));
  const links = state.data.facts.edges.filter(e => ids.has(e.source) && ids.has(e.target)).map(e => ({ ...e }));
  return { nodes: nodes.map(n => ({ ...n })), links };
}
function matchesQuery(node) {
  if (!state.query) return true;
  const q = state.query.toLowerCase();
  return node.id.toLowerCase().includes(q) || String(node.title || "").toLowerCase().includes(q);
}
function nodeRadius(node) {
  if (node.type === "app") return 10;
  if (node.type === "feature") return 7.5 + Math.min(3.5, (degree[node.id] || 0) * 0.35);
  return 6;
}
function entranceScale(node) {
  if (REDUCED) return 1;
  const delay = (node.__seq || 0) * 28;
  const t = (performance.now() - state.mountedAt - delay) / 620;
  if (t >= 1) return 1;
  if (t <= 0) return 0.001;
  const p = t - 1; return 1 + 1.7 * p * p * p + 0.7 * p * p;
}
function drawHex(ctx, x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 3 * i - Math.PI / 6;
    const px = x + r * Math.cos(a), py = y + r * Math.sin(a);
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}
function nodeAlpha(node) {
  const focus = state.hovered || state.selected;
  const dimmed = 0.10;
  if (state.query && !matchesQuery(node)) return dimmed;
  if (!focus) return 1;
  if (node.id === focus) return 1;
  return neighbors[focus] && neighbors[focus].has(node.id) ? 1 : dimmed;
}
function paintNode(node, ctx, scale) {
  const r = nodeRadius(node) * entranceScale(node);
  if (r <= 0.01) return;
  const color = phaseColor(node);
  const alpha = nodeAlpha(node);
  ctx.save();
  ctx.globalAlpha = alpha;
  if (C.glow && alpha > 0.5 && node.type !== "app" && node.health === "ok") {
    ctx.shadowColor = color; ctx.shadowBlur = node.type === "feature" ? 14 : 7;
  }
  const broken = node.health && node.health !== "ok";
  const ready = node.type === "feature" && READY_STAGES.has(node.status);
  if (node.type === "app") {
    drawHex(ctx, node.x, node.y, r);
    ctx.fillStyle = color; ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(node.x, node.y, r, 0, 2 * Math.PI);
    if (broken) {
      ctx.fillStyle = C.surface; ctx.fill();
      ctx.setLineDash([3, 2.5]);
      ctx.strokeStyle = node.health === "error" ? C.critical : C.warning;
      ctx.lineWidth = 1.6; ctx.stroke(); ctx.setLineDash([]);
    } else if (ready) {
      ctx.globalAlpha = alpha * 0.45; ctx.fillStyle = color; ctx.fill();
      ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = 1.6; ctx.stroke();
    } else {
      ctx.fillStyle = color; ctx.fill();
      if (node.type !== "feature") {
        ctx.strokeStyle = C.ink2; ctx.lineWidth = 0.8; ctx.stroke();
      }
    }
  }
  ctx.shadowBlur = 0;
  if (node.advisory_review === "pending") {
    ctx.beginPath(); ctx.arc(node.x, node.y, r + 3.5, 0, 2 * Math.PI);
    ctx.setLineDash([2.5, 2.5]); ctx.strokeStyle = C.warning; ctx.lineWidth = 1.2; ctx.stroke(); ctx.setLineDash([]);
  }
  if (blockedIds.has(node.id)) {
    const bx = node.x + r * 0.85, by = node.y - r * 0.85;
    ctx.beginPath(); ctx.arc(bx, by, 2.6, 0, 2 * Math.PI);
    ctx.fillStyle = C.critical; ctx.fill();
    ctx.strokeStyle = C.surface; ctx.lineWidth = 1; ctx.stroke();
  }
  const focused = state.hovered === node.id || state.selected === node.id;
  const showLabel = node.type === "app" || focused ||
    (node.type === "feature" && scale > 1.05) || (node.type !== "feature" && scale > 1.5);
  if (showLabel && alpha > 0.5) {
    const label = node.type === "feature" ? node.id : (node.title || node.id);
    const size = Math.max(10.5 / scale, 2.4);
    const ly = node.y + r + 2.5 / scale + 1.5;
    ctx.font = `600 ${size}px ui-monospace, Consolas, monospace`;
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.lineWidth = Math.max(3 / scale, 1.2); ctx.lineJoin = "round";
    ctx.strokeStyle = C.surface;
    ctx.strokeText(label, node.x, ly);
    ctx.fillStyle = C.ink2;
    ctx.fillText(label, node.x, ly);
    if (focused && node.type === "feature" && node.title) {
      ctx.font = `700 ${size}px system-ui, sans-serif`;
      ctx.strokeText(node.title, node.x, ly + size * 1.25);
      ctx.fillStyle = C.ink;
      ctx.fillText(node.title, node.x, ly + size * 1.25);
    }
  }
  ctx.restore();
}
function initGraph() {
  const el = document.getElementById("graph-canvas");
  graph = ForceGraph()(el)
    .backgroundColor("rgba(0,0,0,0)")
    .nodeId("id")
    .nodeVal(n => nodeRadius(n))
    .nodeLabel(() => "")
    .nodeCanvasObject((node, ctx, scale) => paintNode(node, ctx, scale))
    .nodePointerAreaPaint((node, color, ctx) => {
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(node.x, node.y, nodeRadius(node) + 6, 0, 2 * Math.PI); ctx.fill();
    })
    .linkColor(link => {
      const focus = state.hovered || state.selected;
      const s = link.source.id || link.source, t = link.target.id || link.target;
      if (focus && (s === focus || t === focus)) return phaseColor(nodesById[s] || {});
      return state.theme === "dark" ? "rgba(137,135,129,0.28)" : "rgba(137,135,129,0.38)";
    })
    .linkWidth(link => {
      const focus = state.hovered || state.selected;
      const s = link.source.id || link.source, t = link.target.id || link.target;
      return focus && (s === focus || t === focus) ? 1.8 : 0.7;
    })
    .linkDirectionalParticles(link => {
      if (REDUCED) return 0;
      const focus = state.hovered || state.selected;
      const s = link.source.id || link.source, t = link.target.id || link.target;
      return focus && (s === focus || t === focus) ? 2 : 0;
    })
    .linkDirectionalParticleWidth(2.2)
    .linkDirectionalParticleSpeed(0.006)
    .onNodeHover(node => {
      state.hovered = node ? node.id : null;
      el.style.cursor = node ? "pointer" : "";
    })
    .onNodeClick(node => { selectNode(node.id); })
    .onBackgroundClick(() => { closePanel(); })
    .autoPauseRedraw(false)
    .d3AlphaDecay(0.015)
    .d3VelocityDecay(0.28);
  graph.d3Force("charge").strength(-160).distanceMax(320);
  sizeGraph();
  window.addEventListener("resize", sizeGraph);
}
function sizeGraph() {
  const el = document.getElementById("graph-view");
  if (graph && el.clientWidth) graph.width(el.clientWidth).height(el.clientHeight);
}
function applyGraphData(first) {
  if (!graph) return;
  const data = visibleGraphData();
  if (!first) {
    const old = {}; graph.graphData().nodes.forEach(n => old[n.id] = n);
    data.nodes.forEach(n => {
      const prev = old[n.id];
      if (prev) { n.x = prev.x; n.y = prev.y; n.vx = prev.vx; n.vy = prev.vy; }
    });
    state.mountedAt = Math.min(state.mountedAt, performance.now() - 700);
  }
  data.nodes.forEach((n, i) => { n.__seq = i; });
  graph.graphData(data);
  // small graphs need gentler repulsion or disconnected nodes fly off-canvas
  const nodeCount = data.nodes.length;
  graph.d3Force("charge").strength(nodeCount < 20 ? -90 : -160).distanceMax(nodeCount < 20 ? 200 : 320);
  const linkForce = graph.d3Force("link");
  if (linkForce && linkForce.distance) linkForce.distance(58);
  const empty = document.getElementById("empty-state");
  empty.hidden = nodeCount > 0;
  empty.innerHTML = '<div><div style="font-size:36px;opacity:.5;margin-bottom:10px">◇</div><div>Nothing matches the current filters.</div></div>';
  // re-frame after the physics settle — on first load AND after filter changes
  if (fitTimer) clearTimeout(fitTimer);
  if (nodeCount > 0) fitTimer = setTimeout(() => graph.zoomToFit(REDUCED ? 0 : 600, 90), first ? 850 : 500);
}
function focusNode(id) {
  const node = graph.graphData().nodes.find(n => n.id === id);
  if (!node) return;
  graph.centerAt(node.x, node.y, REDUCED ? 0 : 700);
  graph.zoom(Math.max(2.2, graph.zoom()), REDUCED ? 0 : 700);
}

/* ==================== board ==================== */
function renderBoard() {
  const feats = featureNodes();
  const intake = intakeFacts();
  const boardStages = feats.some(f => !STAGES.includes(f.status))
    ? [...STAGES, "unknown stage"]
    : STAGES;
  const intakeCards =
    intake.quarantined.map(name =>
      `<div class="card intake quarantined" data-intake="quarantined" data-name="${escapeHtml(name)}" tabindex="0" role="group" aria-label="Quarantined intake item ${escapeHtml(boundedText(name, 140))}">

        <div class="badges"><span class="badge blocked">human resolution</span></div></div>`).join("") +
    intake.pending.map(name =>
      `<div class="card intake" data-intake="pending" data-name="${escapeHtml(name)}" tabindex="0" role="group" aria-label="Pending intake item ${escapeHtml(boundedText(name, 140))}">
        <div class="cid">PENDING BRIEF</div><div class="ctitle">${escapeHtml(name)}</div>

  const cols = boardStages.map(stage => {
    const items = stage === "unknown stage"
      ? feats.filter(f => !STAGES.includes(f.status))
      : feats.filter(f => f.status === stage);
    const stageColor = C[STAGE_PHASE[stage]] || C.muted;
    const cards = items.map((f, i) => {
      const badges = [];
      if (blockedIds.has(f.id)) badges.push('<span class="badge blocked">blocked</span>');
      if (f.advisory_review === "pending") badges.push('<span class="badge advisory">advisory</span>');
      if (f.health === "error") badges.push('<span class="badge broken">malformed</span>');
      else if (f.health === "warning") badges.push('<span class="badge advisory">warning</span>');
      if (stage === "unknown stage") {

        badges.push(`<span class="badge broken">${escapeHtml(originalStatus)}</span>`);
      }

      return `<div class="card" data-id="${escapeHtml(f.id)}" tabindex="0" role="group" aria-label="${escapeHtml(cardLabel)}" style="--stage-color:${stageColor};--stagger:${REDUCED ? 0 : i * 0.05}s">
        <div class="cid">${escapeHtml(f.id)}</div><div class="ctitle">${escapeHtml(f.title)}</div>
        <div class="badges">${badges.join("")}</div>${transitionButtonHtml(f, "card")}</div>`;
    }).join("");
    return `<div class="column" data-stage="${escapeHtml(stage)}"><h3><i style="background:${stageColor};opacity:${READY_STAGES.has(stage) ? .55 : 1}"></i>${escapeHtml(stage)}<span class="count">${items.length}</span></h3>${cards}</div>`;

  const view = document.getElementById("board-view");
  view.innerHTML = `<div class="board">${intakeCol}${cols}</div>`;
  view.querySelectorAll(".card[data-id]").forEach(card => {

      if (e && e.target && e.target.closest && e.target.closest("button, select, label")) return;

    });
    card.addEventListener("keydown", e => {
      if (e.target && e.target !== card) return;
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectNode(card.dataset.id); }
    });
  });
  view.querySelectorAll(".card[data-intake]").forEach(card => {
    card.addEventListener("click", () => showIntakePanel(card.dataset.intake, card.dataset.name));
    card.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); showIntakePanel(card.dataset.intake, card.dataset.name); }
    });
  });

  bindBoardInteractions(view);
}

/* ==================== apps ==================== */
function renderApps() {
  const apps = state.data.facts.nodes.filter(n => n.type === "app");
  const edges = state.data.facts.edges;
  const html = apps.map((p, i) => {
    const featureIds = edges.filter(e => e.kind === "targets" && e.target === p.id).map(e => e.source);
    const chips = featureIds.map(fid => {
      const f = nodesById[fid]; if (!f) return "";
      const appId = p.id.slice("app:".length);
      const reqEdge = edges.find(e => e.kind === "has-requirement" && e.source === fid && e.target.toLowerCase() === ("areq:" + fid + "-" + appId).toLowerCase());
      const req = reqEdge ? nodesById[reqEdge.target] : null;
      const reqStatus = req ? (req.status || "unknown") : "no requirement";
      const reqColor = reqStatus === "done" ? C.done : reqStatus === "in-progress" ? C.dev : C.muted;
      return `<div class="fchip" data-id="${escapeHtml(fid)}" tabindex="0" role="button" aria-label="Open feature ${escapeHtml(boundedText(fid, 120))}: ${escapeHtml(boundedText(f.title, 180))}"><i style="background:${phaseColor(f)}"></i>${escapeHtml(fid)} · ${escapeHtml(f.title)}

/* ==================== detail panel ==================== */

    return;
  }
  const panelBefore = document.getElementById("panel");
  const active = document.activeElement;
  if (active && active.focus && (!panelBefore || !panelBefore.contains || !panelBefore.contains(active))) state.panelReturnFocus = active;
  state.selected = id;
  renderPanel(node);
  const panel = document.getElementById("panel");
  panel.classList.add("open");
  panel.removeAttribute("inert");
  panel.setAttribute("aria-hidden", "false");
  const close = document.getElementById("panel-close");

}
function closePanel() {
  const returnFocus = state.panelReturnFocus;

  const panel = document.getElementById("panel");
  panel.classList.remove("open");

}
function renderPanel(node) {

  if (node.owner) meta.push(["Owner", node.owner, null]);
  if (node.advisory_review) meta.push(["Advisory", node.advisory_review, node.advisory_review === "pending" ? C.warning : null]);

  const metaHtml = meta.map(([k, v, c]) =>
    `<div class="meta"><div class="k">${escapeHtml(k)}</div><div class="v">${c ? `<i style="background:${c}"></i>` : ""}${escapeHtml(String(v))}</div></div>`).join("");
  const transitionPanelHtml = node.type === "feature"
    ? `<div class="section"><h4>Workflow request</h4>${transitionButtonHtml(node, "panel")}</div>`
    : "";

  const blockers = blockersByFeature[node.id] || [];
  const blockerHtml = blockers.length
    ? `<div class="section"><h4>BLOCKERS - action required</h4>${blockers.map(b => {
        const guidance = b.code === "missing-app-requirements"
          ? "Review with the owning design or delivery workflow; design-handoff is not an automatic repair from this stage."
          : "Review with the owning workflow; this dashboard does not run a promotion for this blocker.";
        return `<div class="blocker-item"><div class="code">${escapeHtml(b.code || "unknown blocker")}</div>${escapeHtml(b.message || "No blocker message supplied.")}
          <div class="unblock">${escapeHtml(guidance)}</div></div>`;
      }).join("")}</div>`
    : "";

  const openQuestions = (node.open_questions || []).filter(q => q.status === "open");
  const questionsHtml = openQuestions.length
    ? `<div class="section"><h4>Open questions - ${openQuestions.length}</h4>${openQuestions.map(q => {
        const owner = q.owner || "unassigned";
        const guidance = owner === "dev"
          ? "Review with the owning agent; ask needs the feature ID, a quoted question, and a recipient."
          : "Review with the owning agent; clarification needs the full question context and confirmation.";
        return `<div class="qrow">${escapeHtml(q.question || "Question text not supplied.")}
          <div class="qmeta"><span class="owner-chip">${escapeHtml(owner)}</span>
          <span class="transition-hint">${escapeHtml(guidance)}</span></div></div>`;
      }).join("")}</div>`
    : "";
  const kindLabel = { targets: "targets", "has-requirement": "requirement", "has-design": "design", "has-contract": "api contract", "has-review": "board review", "constrained-by": "constrained by", serves: "serves", related: "related", "links-to": "links to" };
  const connEdges = state.data.facts.edges.filter(e => e.source === node.id || e.target === node.id);
  const conns = connEdges.map(e => {
    const otherId = e.source === node.id ? e.target : e.source;
    const other = nodesById[otherId]; if (!other) return "";
    return `<div class="conn" data-id="${escapeHtml(otherId)}"><span class="kind">${escapeHtml(kindLabel[e.kind] || e.kind)}</span>
      <i style="background:${phaseColor(other)}"></i>${escapeHtml(other.title || otherId)}</div>`;
  }).join("");

  const pathHref = node.path ? `vscode://file/${encodeURI(node.path.replace(/\\/g, "/"))}` : "";
  const pathHtml = node.path ? `
    <div class="section"><h4>Source of truth</h4>
      <div class="pathrow"><code title="${escapeHtml(node.path)}">${escapeHtml(node.path)}</code>
      <a href="#" id="copy-path">Copy</a>
      <a href="${escapeHtml(pathHref)}">VS Code</a></div></div>` : "";

  document.getElementById("panel").innerHTML = `
    <div class="panel-head">
      <div class="row"><span class="type-chip" style="border-color:${color};color:${color}">${escapeHtml(TYPE_LABELS[node.type] || node.type)}</span>
        <span class="pid">${escapeHtml(node.id)}</span>
        <button class="panel-close" id="panel-close">✕</button></div>
      <h2>${escapeHtml(node.title || node.id)}</h2>
    </div>
    <div class="panel-body">
      <div class="meta-grid">${metaHtml}</div>
      ${transitionPanelHtml}
      ${blockerHtml}
      ${questionsHtml}
      <div class="section"><h4>Connections — ${connEdges.length}</h4>${conns || '<span style="font-size:12px;color:var(--muted)">No connections.</span>'}</div>
      ${pathHtml}
    </div>`;
  bindPanelActions(node);
}
function bindPanelActions(node) {
  const close = document.getElementById("panel-close");
  if (close) close.addEventListener("click", closePanel);
  document.querySelectorAll("#panel .conn").forEach(c => bindKeyboardAction(c, () => {
    selectNode(c.dataset.id);
    document.getElementById("panel-close")?.focus();
  }));
  document.querySelectorAll("#panel .copy-btn").forEach(btn => btn.addEventListener("click", () => {
    copyText(btn.dataset.copy, () => {
      btn.textContent = "Copied";
      btn.classList.add("copied");
      toast("Paste it in your agent");
    });
  }));
  const copy = document.getElementById("copy-path");
  if (copy && node && node.path) copy.addEventListener("click", e => {
    e.preventDefault();
    copyText(node.path, () => toast("Path copied"));
  });
  bindTransitionControls(document.getElementById("panel"));
}
function showIntakePanel(kind, name) {
  const panelBefore = document.getElementById("panel");
  const active = document.activeElement;
  if (active && active.focus && (!panelBefore || !panelBefore.contains || !panelBefore.contains(active))) state.panelReturnFocus = active;
  state.selected = null;
  const quarantined = kind === "quarantined";
  const dir = quarantined ? "knowledge/intake/quarantined/" : "knowledge/intake/pending/";
  const guidance = quarantined
    ? "This intake conflicts with existing wiki state and needs a human decision. Open its <code>CONFLICT.md</code>, resolve the conflict, then move or re-process it."
    : "A raw brief waiting to become product truth. Your agent reads it, asks you to confirm the interpretation, and writes the feature pages.";
  const cmd = quarantined ? null : surfaceCommand("po-intake");
  document.getElementById("panel").innerHTML = `
    <div class="panel-head">
      <div class="row"><span class="type-chip" style="border-color:${quarantined ? C.critical : C.muted};color:${quarantined ? C.critical : C.muted}">${quarantined ? "Quarantined" : "Intake"}</span>
        <button class="panel-close" id="panel-close">✕</button></div>
      <h2>${escapeHtml(name)}</h2>
    </div>
    <div class="panel-body">
      <div class="section"><h4>${quarantined ? "⛔ Needs human resolution" : "Next step"}</h4>
        <div style="font-size:12.5px;line-height:1.55;color:var(--ink-2)">${guidance}</div>
        ${cmd ? `<div class="unblock" style="margin-top:10px">process with <code>${escapeHtml(cmd)}</code><button class="copy-btn" data-copy="${escapeHtml(cmd)}">Copy</button></div>` : ""}
      </div>
      <div class="section"><h4>Location</h4>
        <div class="pathrow"><code>${escapeHtml(dir + name)}</code></div></div>
    </div>`;
  document.getElementById("panel").classList.add("open");
  document.getElementById("panel").removeAttribute("inert");
  document.getElementById("panel").setAttribute("aria-hidden", "false");
  bindPanelActions(null);
  const close = document.getElementById("panel-close");
  if (close && close.focus) close.focus();
}

/* ==================== legend ==================== */
function renderLegend() {
  const legend = document.getElementById("graph-legend");
  const wasOpen = legend.classList.contains("open");
  legend.innerHTML = `
    <div class="legend-head" aria-expanded="${wasOpen}"><span class="tri">▶</span> LEGEND</div>
    <div class="legend-body">
      <b>Lifecycle</b>
      <span class="lg"><i style="background:${C.po}"></i>PO — raw / specified</span>
      <span class="lg"><i style="background:${C.design}"></i>Design phase</span>
      <span class="lg"><i style="background:${C.dev}"></i>Dev phase</span>
      <span class="lg"><i style="background:${C.done}"></i>Done</span>
      <b>Marks</b>
      <span class="lg"><i class="hex" style="background:${C.app}"></i>App</span>
      <span class="lg"><i style="background:${C.context}"></i>Context page</span>
      <span class="lg"><i class="ring"></i>Advisory pending</span>
      <span class="lg"><i class="badge-i"></i>Blocked</span>
       <span class="lg"><i class="warn"></i>Warning / stale page</span>
       <span class="lg"><i class="err"></i>Malformed page</span>
      <span class="lg" style="color:var(--muted)">◌ outlined = ready-for-*</span>
    </div>`;
  legend.classList.toggle("open", wasOpen);
  const head = legend.querySelector(".legend-head");
  bindKeyboardAction(head, () => head.setAttribute("aria-expanded", String(legend.classList.toggle("open"))));
}

/* ==================== views, search, keys ==================== */
function switchView(view) {
  state.view = view;
  document.querySelectorAll(".views button").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  document.querySelectorAll("#dashboard .view").forEach(v => {
    const active = v.id === view + "-view";
    v.classList.toggle("active", active);
    if (active) {
      v.removeAttribute("inert");
      v.setAttribute("aria-hidden", "false");
    } else {
      v.setAttribute("inert", "");
      v.setAttribute("aria-hidden", "true");
    }
  });
  document.getElementById(view + "-view").classList.add("active");
  if (view === "firstrun") renderFirstRunPage();
  if (view === "board") renderBoard();
  if (view === "app") renderApps();
  if (view === "graph") requestAnimationFrame(sizeGraph);
}
document.getElementById("views").addEventListener("click", e => {
  const btn = e.target.closest("button"); if (btn) switchView(btn.dataset.view);
});
const searchInput = document.getElementById("search");
searchInput.addEventListener("input", () => { state.query = searchInput.value.trim(); });
searchInput.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const match = state.data.facts.nodes.find(n => state.visibleTypes.has(n.type) && matchesQuery(n) && state.query);
    if (match) selectNode(match.id);
  }
});
document.addEventListener("keydown", e => {
  if (state.transitionPreview) {
    if (e.key === "Escape") { closeTransitionPreview("Workflow preview canceled."); }
    else if (e.key === "Tab") {
      // The dialog's own handler covers focus inside it; this keeps Tab inside the modal when focus has fallen to the page.
      const modal = document.querySelector("#transition-dialog .transition-dialog");
      if (modal && !(e.target && modal.contains(e.target))) trapDialogTab(e, modal);
    }
    return;
  }
  if (e.key === "/" && document.activeElement !== searchInput) { e.preventDefault(); searchInput.focus(); }
  if (e.key === "Escape") {
    closePanel(); searchInput.value = ""; state.query = ""; document.getElementById("diagpanel").classList.remove("open");
  }
  if (document.activeElement === searchInput) return;
  if (e.key === "1") switchView("firstrun");
  if (e.key === "2") switchView("graph");
  if (e.key === "3") switchView("board");
  if (e.key === "4") switchView("app");
});

/* ==================== live mode ==================== */
function toast(message) {
  const el = document.getElementById("toast");
  el.textContent = message; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2200);
}
function pulseSpectrum() {
  const el = document.getElementById("spectrum");
  el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse");
}
function markLiveRefreshUnavailable(version) {
  const message = "Live refresh unavailable for version " + String(version) + "; copying is disabled. Retry on the next event or request attempt.";
  state.liveRefreshError = message;
  if (state.transitionPreview) {
    state.transitionPreview.staleReason = message;
    renderTransitionDialog(false);
  }
  renderAll(false);
  announce(message);
  toast(message);
}
function adoptData(envelope) {
  const previousData = state.data;
  const previousLiveError = state.liveRefreshError;
  const hadFeatures = featureNodes().length > 0;
  if (state.drag) cancelDrag("Live snapshot changed; active workflow drag canceled.");
  try {
    state.data = envelope;
    state.liveRefreshError = null;
    buildIndexes();
    renderAll(false);
    if (!hadFeatures && featureNodes().length > 0) {
      if (graph) applyGraphData(true);
      switchView("graph");
      toast("First feature landed - welcome to the graph");
    }
    if (state.selected && nodesById[state.selected]) renderPanel(nodesById[state.selected]);
    else if (state.selected) closePanel();
    reconcileTransitionPreview();
    pulseSpectrum();
    confirmPendingAppliedStage();
  } catch (error) {
    state.data = previousData;
    state.liveRefreshError = previousLiveError;
    buildIndexes();
    renderAll(false);
    throw error;
  }
}
function initLive() {
  if (CONFIG.mode !== "live" || typeof EventSource === "undefined") return;
  let epoch = null;
  let lastVersion = null;
  let latestAnnouncedVersion = null;
  let pendingVersion = null;
  let refreshInFlight = null;
  let retryScheduled = false;
  let requestSequence = 0;
  const RETRY_DELAY = 1500;
  const source = new EventSource("/events");
  const maxVersion = (left, right) => left === null ? right : Math.max(left, right);
  const scheduleRetry = () => {
    if (retryScheduled || pendingVersion === null) return;
    retryScheduled = true;
    setTimeout(() => {
      retryScheduled = false;
      pump();
    }, RETRY_DELAY);
  };
  const pump = () => {
    if (refreshInFlight || retryScheduled || pendingVersion === null) return;
    const requestedVersion = pendingVersion;
    pendingVersion = null;
    const request = { id: ++requestSequence, version: requestedVersion };
    refreshInFlight = request;
    fetch("/data.json").then(response => {
      if (response && response.status === 401) {
        // The session ended (revoked grant or restarted server): say so instead of retrying a request that cannot succeed.
        invalidateBoardSession();
        const expired = new Error("board session expired");
        expired.sessionExpired = true;
        throw expired;
      }
      if (!response || response.ok === false || typeof response.json !== "function") throw new Error("live response missing JSON");
      return response.json();
    }).then(payload => {
      if (refreshInFlight !== request) return;
      const payloadVersion = Number(payload && payload.version);
      if (!payload || !payload.envelope || !Number.isFinite(payloadVersion)) {
        throw new Error("live payload missing envelope or version");
      }
      if (epoch !== null && payload.epoch !== epoch) throw new Error("live server changed during refresh");
      if (lastVersion !== null && payloadVersion < lastVersion) {
        throw new Error("live payload is older than the adopted snapshot");
      }
      if (latestAnnouncedVersion !== null && payloadVersion < latestAnnouncedVersion) {
        pendingVersion = maxVersion(pendingVersion, latestAnnouncedVersion);
        refreshInFlight = null;
        markLiveRefreshUnavailable(latestAnnouncedVersion);
        scheduleRetry();
        return;
      }
      adoptData(payload.envelope);
      if (refreshInFlight !== request) return;
      refreshInFlight = null;
      lastVersion = payloadVersion;
      state.liveEpoch = epoch;
      state.liveVersion = payloadVersion;
      if (pendingVersion !== null && pendingVersion <= payloadVersion) pendingVersion = null;
      toast("Wiki changed - dashboard updated");
      pump();
    }).catch(error => {
      if (refreshInFlight !== request) return;
      refreshInFlight = null;
      if (error && error.sessionExpired) { markLiveRefreshUnavailable(requestedVersion); return; }
      pendingVersion = maxVersion(pendingVersion, requestedVersion);
      markLiveRefreshUnavailable(requestedVersion);
      scheduleRetry();
    });
  };
  source.onmessage = ev => {
    const version = parseInt(ev.data, 10);
    if (Number.isNaN(version)) return;
    const announcedEpoch = (ev.lastEventId || "").split(":")[0] || null;
    if (announcedEpoch !== epoch) {
      const serverRestarted = epoch !== null;
      epoch = announcedEpoch;
      state.liveEpoch = announcedEpoch;
      state.liveVersion = null;
      lastVersion = latestAnnouncedVersion = pendingVersion = null;
      refreshInFlight = null;
      retryScheduled = false;
      if (serverRestarted) markLiveRefreshUnavailable(version);
    }
    if (latestAnnouncedVersion !== null && version < latestAnnouncedVersion) return;
    latestAnnouncedVersion = maxVersion(latestAnnouncedVersion, version);
    if (lastVersion !== null && version <= lastVersion && pendingVersion === null && !refreshInFlight && !state.liveRefreshError) return;
    pendingVersion = maxVersion(pendingVersion, version);
    pump();
  };
  source.onerror = () => {
    markLiveRefreshUnavailable("disconnected");
    // The stream gives no status. A restarted server or a revoked grant answers it with 401 and the browser stops
    // retrying, so ask the session endpoint: a 401 there shows "Board session expired" instead of a silent STALE.
    if (connectedBoardExpected() && state.boardConnection !== "unauthenticated") boardJsonRequest("/api/board/v1/auth/session", "GET").catch(() => {});
  };
  setInterval(renderStatusline, 30000);
}

/* ==================== util & boot ==================== */
function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
buildIndexes();
initGraph();
renderAll(true);
initBoardService();
initLive();
</script>
