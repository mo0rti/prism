<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism — Product Truth</title>
<style>
/* ============================================================
   PRISM · spectrum terminal
   One idea in, a spectrum of product truth out.
   Identity: mono micro-type, editorial numbered sections,
   dot-grid paper, terminal-file cards, and the spectral
   hairline (light through the prism). Palette validated
   (dataviz six-checks, both themes, all 10 pairs).
   Phases: PO=blue · Design=amber · Dev=aqua · QA=violet · Release=rose · Released=green ·
   App=orange · context=recessive neutral.
   ============================================================ */
:root, html[data-theme="dark"] {
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #222221;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --hairline: rgba(255,255,255,0.10);
  --dot: rgba(255,255,255,0.05);
  --po: #3987e5;
  --design: #c98500;
  --dev: #199e70;
  --qa: #8f6fe0;
  --release: #d9628f;
  --done: #008300;
  --app: #d95926;
  --context: #898781;
  --warning: #fab219;
  --critical: #d03b3b;
  --good: #0ca30c;
  --glow: 1;
  --chip-wash: rgba(255,255,255,0.06);
}
html[data-theme="light"] {
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f2f1ee;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --hairline: rgba(11,11,11,0.10);
  --dot: rgba(11,11,11,0.07);
  --po: #2a78d6;
  --design: #eda100;
  --dev: #1baf7a;
  --qa: #6b45c9;
  --release: #c23d73;
  --done: #008300;
  --app: #eb6834;
  --context: #898781;
  --warning: #b97e00;
  --critical: #d03b3b;
  --good: #006300;
  --glow: 0;
  --chip-wash: rgba(11,11,11,0.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background-color: var(--page);
  background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.1px);
  background-size: 26px 26px;
  color: var(--ink);
  overflow: hidden;
  transition: background-color .4s ease, color .4s ease;
}
code, .stat .label, .stat .value, .sec-label, .kind-chip, .statusline, .chip,
.type-chip, .owner-chip, .views button, .pipe-num, .pipe-who, .freshness,
.card .cid, .column h3, .meta .k, .section h4, .badge, .conn .kind, .diag,
.termbar, .step .num, .cmd-tabs button, .copy-btn, .legend-head, .legend-body b,
.status-light, .here-tag, .evidence, .wordmark {
  font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
}
.app { display: flex; flex-direction: column; height: 100vh; }

/* ---------- header + spectral hairline ---------- */
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding: 11px 20px 9px;
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  backdrop-filter: blur(8px);
  z-index: 30;
}
.prism-glyph {
  width: 19px; height: 19px; flex: none;
  background: conic-gradient(from 210deg, var(--po), var(--design), var(--dev), var(--app), var(--po));
  clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
}
.wordmark { font-size: 12px; letter-spacing: .38em; font-weight: 700; white-space: nowrap; }
.wordmark span { color: var(--muted); font-weight: 400; letter-spacing: .1em; text-transform: lowercase; }
.project-name { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kind-chip {
  font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink-2); border: 1px solid var(--hairline); border-radius: 3px;
  padding: 3px 8px; white-space: nowrap;
}
.header-right { margin-left: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px 16px; min-width: 0; max-width: 100%; }
.status-light { display: flex; align-items: center; gap: 7px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); cursor: pointer; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; }
.status-dot.high { background: var(--good); box-shadow: 0 0 8px color-mix(in srgb, var(--good) 60%, transparent); }
.status-dot.degraded { background: var(--warning); box-shadow: 0 0 8px color-mix(in srgb, var(--warning) 60%, transparent); }
.status-dot.error { background: var(--critical); box-shadow: 0 0 8px color-mix(in srgb, var(--critical) 60%, transparent); }
.freshness { font-size: 9.5px; letter-spacing: .14em; color: var(--muted); display: flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; text-transform: uppercase; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); animation: pulse 1.8s ease-in-out infinite; }
.live-dot.stale { background: var(--critical); animation: none; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .4; transform: scale(.75);} }
.theme-toggle {
  border: 1px solid var(--hairline); background: transparent; color: var(--ink-2);
  border-radius: 4px; width: 29px; height: 29px; cursor: pointer; font-size: 13px;
  display: grid; place-items: center; transition: transform .5s cubic-bezier(.2,.9,.3,1.4), background .2s;
}
.theme-toggle:hover { background: var(--chip-wash); transform: rotate(40deg); }

.spectrum {
  height: 2px; flex: none; z-index: 29;
  background: linear-gradient(90deg, var(--po), var(--design), var(--dev), var(--done), var(--app), var(--po));
  background-size: 300% 100%;
  animation: spectrumDrift 18s linear infinite;
}
.spectrum.pulse { animation: spectrumPulse 1.1s cubic-bezier(.2,.8,.3,1) 1, spectrumDrift 18s linear infinite; }
@keyframes spectrumDrift { from { background-position: 0% 0; } to { background-position: 300% 0; } }
@keyframes spectrumPulse { 0% { filter: brightness(2.4) saturate(1.8); } 100% { filter: none; } }

/* ---------- editorial section labels ---------- */
.sec-label {
  font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: 10px; margin-top: 34px;
}
.sec-label b { color: var(--po); font-weight: 700; letter-spacing: .2em; }
.sec-label::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }

/* ---------- terminal-file card chrome (user motif, kept) ---------- */
.termcard { border: 1px solid var(--hairline); border-radius: 12px; background: var(--surface); overflow: hidden; }
.termbar {
  display: flex; align-items: center; gap: 6px; padding: 9px 14px;
  border-bottom: 1px solid var(--hairline); background: var(--surface-2);
  font-size: 9px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted);
}
.termbar .tdot { width: 9px; height: 9px; border-radius: 50%; background: var(--hairline); }
.termbar .fname { margin-left: 8px; }

/* ---------- guide (first-run teaching) view ---------- */
#firstrun-view { padding: 26px clamp(20px, 6vw, 90px) 60px; }
.fr-headline { font-size: clamp(26px, 4vw, 40px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; margin: 16px 0 10px; }
.fr-headline em { font-style: normal; background: linear-gradient(90deg, var(--po), var(--design), var(--dev), var(--done)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.fr-sub { font-size: 13.5px; color: var(--ink-2); max-width: 660px; line-height: 1.65; margin-bottom: 8px; }
.fr-sub code { font-size: 11.5px; background: var(--chip-wash); border: 1px solid var(--hairline); border-radius: 4px; padding: 1px 6px; }

.pipeline { margin: 18px 0 6px; padding: 30px 26px 18px; overflow-x: auto; }
.pipe-track { display: flex; align-items: flex-start; min-width: 640px; position: relative; }
.pipe-stage { flex: 1; min-width: 84px; display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; cursor: pointer; }
.pipe-stage + .pipe-stage::before {
  content: ""; position: absolute; right: 50%; top: 21px; width: calc(100% - 52px); height: 0;
  border-top: 2px dotted var(--grid); transform: translateX(calc(-50% + 26px)); z-index: 0;
}
.pipe-circle {
  width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--stage-c, var(--muted));
  display: grid; place-items: center; background: var(--surface); z-index: 1;
  transition: transform .25s cubic-bezier(.2,.9,.3,1.4);
  animation: popIn .6s cubic-bezier(.2,.9,.3,1.35) both; animation-delay: var(--d, 0s);
}
.pipe-stage:hover .pipe-circle { transform: scale(1.12); }
.pipe-stage.focus .pipe-circle { background: color-mix(in srgb, var(--stage-c) 14%, var(--surface)); }
.pipe-stage.here .pipe-circle {
  box-shadow: 0 0 0 5px color-mix(in srgb, var(--stage-c) 22%, transparent);
  animation: popIn .6s cubic-bezier(.2,.9,.3,1.35) both, herePulse 2.4s ease-in-out infinite 1s;
}
@keyframes herePulse { 0%,100% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--stage-c) 22%, transparent);} 50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--stage-c) 9%, transparent);} }
@keyframes popIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
.pipe-num { font-size: 12px; font-weight: 700; color: var(--stage-c, var(--muted)); }
.pipe-name { font-size: 10px; letter-spacing: .18em; font-weight: 700; }
.pipe-who { font-size: 8.5px; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
.pipe-who.you { color: var(--app); font-weight: 700; }
.pipe-detail {
  margin: 18px 26px 0; padding: 13px 2px 14px; border-top: 1px solid var(--hairline);
  font-size: 12.5px; color: var(--ink-2); min-height: 44px; line-height: 1.6;
}
.pipe-detail code { font-size: 11px; background: var(--chip-wash); border: 1px solid var(--hairline); border-radius: 4px; padding: 1px 6px; }
.pipe-spark { position: absolute; top: 19px; left: 0; width: 5px; height: 5px; border-radius: 50%;
  background: var(--ink); opacity: 0; z-index: 0; /* travels BEHIND the circles */
  box-shadow: 0 0 9px var(--ink); pointer-events: none; }
.pipe-circle { transition: transform .25s cubic-bezier(.2,.9,.3,1.4), box-shadow .3s ease, background .3s ease; }
.pipe-stage.lit .pipe-circle {
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--stage-c) 30%, transparent), 0 0 18px color-mix(in srgb, var(--stage-c) 55%, transparent);
  background: color-mix(in srgb, var(--stage-c) 12%, var(--surface));
}

/* setup steps */
.steps-wrap { margin-top: 18px; }
.step { display: flex; gap: 16px; padding: 16px 22px; border-top: 1px solid var(--hairline); }
.steps-wrap .termbar + .step { border-top: 0; }
.step.done { padding: 10px 22px; opacity: .6; }
.step.current { background: color-mix(in srgb, var(--po) 5%, transparent); box-shadow: inset 3px 0 0 var(--po); }
.step .num {
  width: 24px; height: 24px; flex: none; border-radius: 50%; display: grid; place-items: center;
  font-size: 10.5px; font-weight: 700; border: 1.5px solid var(--muted); color: var(--muted);
}
.step.done .num { background: var(--good); border-color: var(--good); color: #fff; }
.step.current .num { border-color: var(--po); color: var(--po); }
.step .what { font-size: 13.5px; font-weight: 700; letter-spacing: -0.01em; }
.step.current .what { font-size: 15px; }
.step .how { font-size: 12px; color: var(--ink-2); margin-top: 4px; line-height: 1.6; max-width: 580px; }
.step .how code { font-size: 11px; background: var(--chip-wash); border: 1px solid var(--hairline); border-radius: 4px; padding: 1px 6px; }
.evidence { font-size: 10px; color: var(--good); margin-top: 3px; letter-spacing: .06em; }
.here-tag { font-size: 8.5px; letter-spacing: .26em; color: var(--po); font-weight: 700; margin-left: 12px; }

/* command block with agent-surface tabs */
.cmdblock { margin-top: 12px; max-width: 580px; border: 1px solid var(--hairline); border-radius: 9px; overflow: hidden; background: var(--page); }
.cmd-tabs { display: flex; border-bottom: 1px solid var(--hairline); background: var(--surface-2); }
.cmd-tabs button {
  border: 0; background: transparent; color: var(--muted);
  font-size: 9px; letter-spacing: .18em; padding: 7px 14px; cursor: pointer; text-transform: uppercase;
}
.cmd-tabs button.active { color: var(--ink); background: var(--page); font-weight: 700; }
.cmd-body { display: flex; align-items: center; gap: 12px; padding: 13px 15px; }
.cmd-body code { flex: 1; font-size: 14.5px; font-weight: 600; background: none; border: 0; color: var(--ink); }
.cmd-body code .prompt { color: var(--dev); margin-right: 9px; }
.copy-btn {
  border: 1px solid var(--hairline); background: var(--surface); color: var(--ink);
  border-radius: 6px; font-size: 10px; letter-spacing: .16em; padding: 8px 18px; cursor: pointer;
  text-transform: uppercase; font-weight: 700; transition: all .15s ease; flex: none;
}
.copy-btn:hover { background: var(--chip-wash); border-color: var(--ink-2); }
.copy-btn.copied { color: var(--good); border-color: var(--good); }

/* ---------- stat row ---------- */
.statrow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 12px; padding: 14px 20px 4px; z-index: 20; }
.stat {
  min-width: 112px; padding: 10px 14px 11px;
  border: 1px solid var(--hairline); border-radius: 10px; background: var(--surface);
  animation: rise .55s cubic-bezier(.2,.8,.25,1) both;
}
.stat:nth-child(2) { animation-delay: .05s; } .stat:nth-child(3) { animation-delay: .1s; }
.stat:nth-child(4) { animation-delay: .15s; } .stat:nth-child(5) { animation-delay: .2s; } .stat:nth-child(6) { animation-delay: .25s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.stat .label { font-size: 9px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
.stat .value { font-size: 25px; font-weight: 700; letter-spacing: -0.02em; margin-top: 3px; font-variant-numeric: tabular-nums; }
.stat .value.alert { color: var(--critical); }
.stat .sub { font-size: 10px; color: var(--ink-2); margin-top: 1px; }
.stagebar { flex: 1; min-width: 220px; display: flex; flex-direction: column; justify-content: flex-end; gap: 7px; padding: 10px 4px; }
.stagebar .bars { display: flex; height: 13px; border-radius: 4px; overflow: hidden; gap: 2px; }
.stagebar .seg { min-width: 3px; border-radius: 3px; transition: flex-grow .8s cubic-bezier(.2,.8,.25,1); }
.stagebar .legendline { display: flex; gap: 14px; font-size: 8.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); flex-wrap: wrap; font-family: ui-monospace, Consolas, monospace; }
.legendline i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }

/* ---------- toolbar ---------- */
.toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 20px; flex-wrap: wrap; z-index: 20; }
.views { display: flex; border: 1px solid var(--hairline); border-radius: 8px; max-width: 100%; overflow-x: auto; scrollbar-width: none; background: var(--surface); }
.views::-webkit-scrollbar { display: none; }
.views button {
  border: 0; background: transparent; color: var(--muted); font-size: 10px; letter-spacing: .18em;
  text-transform: uppercase; padding: 8px 16px; cursor: pointer; flex: none; white-space: nowrap; transition: color .2s, background .2s;
}
.views button.active { background: var(--chip-wash); color: var(--ink); font-weight: 700; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font-size: 9px; letter-spacing: .14em; text-transform: uppercase; padding: 6px 11px;
  border-radius: 5px; cursor: pointer; border: 1px solid var(--hairline); color: var(--muted);
  background: transparent; transition: all .18s ease; user-select: none;
}
.chip.on { color: var(--ink); border-color: color-mix(in srgb, var(--ink) 32%, transparent); background: var(--chip-wash); }
.chip i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.chip .n { color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; }
.search {
  margin-left: auto; display: flex; align-items: center; gap: 7px;
  border: 1px solid var(--hairline); border-radius: 8px; padding: 6px 11px; background: var(--surface);
}
.search input { border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; font-size: 12.5px; width: 180px; }
.search .hint { font-size: 9.5px; color: var(--muted); border: 1px solid var(--hairline); border-radius: 4px; padding: 1px 6px; font-family: ui-monospace, Consolas, monospace; }

/* ---------- main views ---------- */
main { position: relative; flex: 1; overflow: hidden; }
.view { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .35s ease; overflow: auto; }
.view.active { opacity: 1; pointer-events: auto; }
#graph-view { overflow: hidden; }
#graph-canvas { position: absolute; inset: 0; }

.graph-legend {
  position: absolute; left: 16px; bottom: 12px; z-index: 10;
  background: color-mix(in srgb, var(--surface) 90%, transparent);
  border: 1px solid var(--hairline); border-radius: 9px;
  font-size: 11px; color: var(--ink-2); backdrop-filter: blur(6px);
  max-width: 330px; overflow: hidden;
}
.legend-head {
  display: flex; align-items: center; gap: 8px; padding: 7px 12px; cursor: pointer;
  font-size: 9px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted);
}
.legend-head .tri { transition: transform .25s; font-size: 8px; }
.graph-legend.open .legend-head .tri { transform: rotate(90deg); }
.legend-body { display: none; padding: 2px 13px 11px; grid-template-columns: auto auto; gap: 5px 18px; }
.graph-legend.open .legend-body { display: grid; }
.legend-body b { grid-column: 1 / -1; font-size: 8.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-top: 4px; }
.lg { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.lg i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.lg i.hex { clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%); border-radius: 0; }
.lg i.ring { background: transparent !important; border: 2px dashed var(--warning); }
.lg i.err { background: transparent !important; border: 2px dashed var(--critical); }
.lg i.warn { background: transparent !important; border: 2px dashed var(--warning); }
.lg i.badge-i { background: var(--critical); width: 7px; height: 7px; }

.empty-state { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink-2); pointer-events: none; }
.empty-state[hidden] { display: none; }

/* ---------- board ---------- */
#board-view { padding: 16px 20px 24px; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(198px, 1fr); gap: 12px; min-height: 100%; }
.column { background: var(--surface); border: 1px solid var(--hairline); border-radius: 11px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 220px; }
.column.intake-col { border-style: dashed; }
.column h3 {
  font-size: 9px; letter-spacing: .2em; text-transform: uppercase; font-weight: 700;
  padding: 4px 6px 8px; display: flex; align-items: center; gap: 7px; color: var(--ink-2);
}
.column h3 i { width: 9px; height: 9px; border-radius: 3px; }
.column h3 .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.card {
  background: var(--surface-2); border: 1px solid var(--hairline); border-left: 3px solid var(--stage-color, var(--muted));
  border-radius: 8px; padding: 9px 11px; cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease;
  animation: rise .45s cubic-bezier(.2,.8,.25,1) both; animation-delay: var(--stagger, 0s);
}
.card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.card:focus-visible, .fchip:focus-visible, .conn:focus-visible { outline: 2px solid var(--po); outline-offset: 2px; }
[role="button"]:focus-visible { outline: 2px solid var(--po); outline-offset: 2px; }
.card.dragging { opacity: .56; transform: scale(.985); }
.card .cid { font-size: 9px; color: var(--muted); letter-spacing: .12em; }
.card .ctitle { font-size: 12.5px; font-weight: 650; margin: 3px 0 4px; }
.card-actions { display: flex; align-items: flex-start; flex-direction: column; gap: 5px; margin-top: 8px; }
.prepare-btn {
  border: 1px solid color-mix(in srgb, var(--po) 55%, transparent); background: transparent; color: var(--po);
  border-radius: 5px; padding: 5px 8px; cursor: pointer; font: 700 8.5px ui-monospace, Consolas, monospace;
  letter-spacing: .08em; text-transform: uppercase; transition: background .15s, border-color .15s;
}
.prepare-btn:hover { background: color-mix(in srgb, var(--po) 10%, transparent); border-color: var(--po); }
.prepare-btn[aria-disabled="true"] { color: var(--muted); border-color: var(--hairline); cursor: help; }
.prepare-btn[aria-disabled="true"]:hover { background: var(--chip-wash); }
.transition-hint { color: var(--muted); font-size: 9px; line-height: 1.35; }
.transition-action-picker { display: flex; width: 100%; min-width: 0; }
.transition-action-select { width: 100%; min-width: 0; max-width: 100%; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 5px; padding: 5px 7px; font: 9px ui-monospace, Consolas, monospace; }
.transition-action-select:focus-visible { outline: 2px solid var(--po); outline-offset: 2px; }
.drop-ready { border-color: var(--po); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--po) 36%, transparent); }
.drop-invalid { border-color: color-mix(in srgb, var(--warning) 55%, transparent); }
.badges { display: flex; gap: 5px; flex-wrap: wrap; }
.badge { font-size: 8.5px; letter-spacing: .1em; padding: 2px 7px; border-radius: 4px; font-weight: 700; text-transform: uppercase; }
.badge.blocked { color: var(--critical); border: 1px solid color-mix(in srgb, var(--critical) 45%, transparent); }
.badge.advisory { color: var(--warning); border: 1px solid color-mix(in srgb, var(--warning) 55%, transparent); }
.badge.broken { color: var(--muted); border: 1px dashed var(--muted); }
.app-stages, .design-tracks { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; font: 10px/1.35 ui-monospace, Consolas, monospace; color: var(--ink-2); }
.design-track { display: flex; align-items: center; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
/* An app ID and a stage each stay on one line: the row wraps only between the app and its stage, and a value wider than the row is cut with an ellipsis (its full value is in the title). */
.app-stage { display: flex; flex-wrap: wrap; align-items: center; column-gap: 6px; min-width: 0; }
.app-stage i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.app-stage .as-head { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; }
.app-stage .as-name, .app-stage .as-stage { white-space: nowrap; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.app-stage .sep { flex: none; }
.app-stage .sep, .design-track .sep { color: var(--muted); }
.app-stage.retired { color: var(--muted); }
.card.intake { --stage-color: var(--muted); }
.card.intake.quarantined { --stage-color: var(--critical); }

/* ---------- apps ---------- */
#app-view { padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 12px; }
.lane { background: var(--surface); border: 1px solid var(--hairline); border-radius: 11px; padding: 13px 15px; animation: rise .5s cubic-bezier(.2,.8,.25,1) both; }
.lane h3 { display: flex; align-items: center; gap: 9px; font-size: 12px; letter-spacing: .08em; margin-bottom: 10px; font-family: ui-monospace, Consolas, monospace; }
.lane h3 i { width: 12px; height: 12px; background: var(--app); clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%); }
.lane h3 .count { margin-left: auto; font-size: 9.5px; color: var(--muted); letter-spacing: .12em; }
.lane h3 .retired { color: var(--muted); font-weight: 400; letter-spacing: .04em; }
.lane .features { display: flex; flex-wrap: wrap; gap: 8px; }
.fchip {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  border: 1px solid var(--hairline); border-radius: 8px; padding: 7px 11px; font-size: 12px;
  background: var(--surface-2); transition: transform .15s ease;
}
.fchip:hover { transform: translateY(-1px); }
.fchip i { width: 8px; height: 8px; border-radius: 50%; }
.fchip .req { font-size: 8.5px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; font-family: ui-monospace, Consolas, monospace; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.lane .none { color: var(--muted); font-size: 12px; }
.ops-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 14px; margin-bottom: 10px; }
.ops-fact .k { font-size: 8.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.ops-fact .v { font-size: 12px; font-weight: 650; margin-top: 2px; overflow-wrap: anywhere; }

/* ---------- detail panel ---------- */
.panel {
  position: absolute; top: 0; right: 0; bottom: 0; width: 348px; z-index: 25;
  background: color-mix(in srgb, var(--surface) 95%, transparent);
  border-left: 1px solid var(--hairline); backdrop-filter: blur(10px);
  transform: translateX(105%); transition: transform .38s cubic-bezier(.25,.9,.3,1);
  display: flex; flex-direction: column; overflow-y: auto;
}
.panel.open { transform: none; }
.panel-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--hairline); }
.panel-head .row { display: flex; align-items: center; gap: 8px; }
.type-chip { font-size: 8.5px; letter-spacing: .18em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--hairline); color: var(--ink-2); }
.panel-head .pid { font-size: 10px; color: var(--muted); letter-spacing: .1em; font-family: ui-monospace, Consolas, monospace; }
.panel-head h2 { font-size: 17px; font-weight: 750; letter-spacing: -0.015em; margin-top: 7px; }
.panel-close { margin-left: auto; border: 0; background: transparent; color: var(--muted); font-size: 16px; cursor: pointer; }
.panel-body { padding: 14px 18px 20px; display: flex; flex-direction: column; gap: 16px; }
.meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 12px; }
.meta { border: 1px solid var(--hairline); border-radius: 8px; padding: 7px 10px; }
.meta .k { font-size: 8.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.meta .v { font-size: 12.5px; font-weight: 650; margin-top: 3px; display: flex; align-items: center; gap: 6px; }
.meta .v i { width: 8px; height: 8px; border-radius: 50%; }
.section h4 { font-size: 9px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.blocker-item { border-left: 3px solid var(--critical); background: var(--chip-wash); border-radius: 6px; padding: 9px 11px; font-size: 12px; margin-bottom: 6px; }
.blocker-item .code { font-size: 9px; letter-spacing: .12em; color: var(--critical); font-weight: 700; text-transform: uppercase; font-family: ui-monospace, Consolas, monospace; }
.unblock { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 10.5px; color: var(--ink-2); flex-wrap: wrap; }
.unblock code, .qrow code { font-size: 11.5px; background: var(--page); border: 1px solid var(--hairline); border-radius: 5px; padding: 3px 9px; color: var(--ink); font-weight: 600; }
.qrow { padding: 8px 0; border-top: 1px solid var(--hairline); font-size: 12px; line-height: 1.5; }
.qrow .qmeta { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.owner-chip { font-size: 8.5px; letter-spacing: .18em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--hairline); color: var(--ink-2); }
.conn { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.conn:hover { background: var(--chip-wash); }
.conn .kind { font-size: 8.5px; color: var(--muted); letter-spacing: .12em; min-width: 92px; text-transform: uppercase; }
.conn i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.pathrow { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--ink-2); font-family: ui-monospace, Consolas, monospace; }
.pathrow code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; direction: rtl; text-align: left; background: none; border: 0; padding: 0; }
.pathrow a {
  border: 1px solid var(--hairline); color: var(--ink-2); border-radius: 5px;
  font-size: 9px; padding: 4px 9px; cursor: pointer; text-decoration: none; white-space: nowrap;
  letter-spacing: .12em; text-transform: uppercase;
}
.pathrow a:hover { background: var(--chip-wash); }

/* ---------- records: bugs, releases and incidents ---------- */
/* A tone is one of the page's colour tokens (--c), so a badge, a dot or a card edge follows the theme without a second palette.
   Its text is mixed toward the ink so it stays legible on both the dark and the light surface. */
#bugs-view, #releases-view, #incidents-view { padding: 16px 20px 24px; }
#bugs-view .board, #incidents-view .board { min-height: 0; align-items: start; }
#incidents-view .board { grid-auto-columns: minmax(240px, 1fr); }
.rec-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
.rec-field { display: inline-flex; align-items: center; gap: 7px; font: 9px ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.rec-select {
  border: 1px solid var(--hairline); border-radius: 5px; background: var(--surface); color: var(--ink-2);
  padding: 6px 9px; font: 10px ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace; max-width: 100%;
}
.rec-count { margin-left: auto; font: 9px ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.rec-select:focus-visible, button.chip:focus-visible, .rlink:focus-visible, .rec-row:focus-visible, .stat[data-goto]:focus-visible { outline: 2px solid var(--po); outline-offset: 2px; }
.rec-empty { color: var(--ink-2); text-align: center; padding: 56px 16px; font-size: 13.5px; }
.rec-empty .glyph { font-size: 32px; opacity: .45; margin-bottom: 10px; }
.rec-empty .hint { margin-top: 6px; font-size: 11.5px; color: var(--muted); }
.col-empty { font-size: 10.5px; color: var(--muted); padding: 4px 6px; }
.stat[data-goto] { cursor: pointer; transition: border-color .15s ease; }
.stat[data-goto]:hover { border-color: color-mix(in srgb, var(--ink) 30%, transparent); }
.badge.tone {
  --c: var(--context);
  color: color-mix(in srgb, var(--c) 72%, var(--ink));
  border: 1px solid color-mix(in srgb, var(--c) 50%, transparent);
  background: color-mix(in srgb, var(--c) 13%, transparent);
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
}
.badge.tone.solid { background: var(--c); border-color: var(--c); color: #fff; }
.badge.kind { color: var(--ink-2); border: 1px solid var(--hairline); display: inline-flex; align-items: center; gap: 5px; }
.badge.kind i { width: 6px; height: 6px; border-radius: 2px; background: var(--c, var(--context)); }
.badge.deferred { color: var(--ink-2); border: 1px dashed var(--muted); }
.badge.current { color: #fff; background: var(--done); border: 1px solid var(--done); }
.sev-pips { display: inline-flex; align-items: flex-end; gap: 1.5px; }
.sev-pips b { width: 3px; height: 8px; border-radius: 1px; background: currentColor; opacity: .28; }
.sev-pips b.on { opacity: 1; }
.card.rec { cursor: pointer; }
.card.rec.invalid { border-style: dashed; border-left-style: solid; }
.rec-idrow { display: flex; align-items: baseline; gap: 8px; }
.rec-idrow .when { margin-left: auto; font: 9px ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace; color: var(--muted); letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.rec-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 8px; margin-top: 8px; font: 10px/1.35 ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace; color: var(--ink-2); }
.app-tag { display: inline-flex; align-items: center; gap: 5px; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app-tag i { width: 8px; height: 8px; flex: none; background: var(--app); clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%); }
.rec-text { margin-top: 7px; font-size: 11.5px; line-height: 1.5; color: var(--ink-2); overflow-wrap: anywhere; }
.rec-links { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 6px; margin-top: 8px; font-size: 11px; color: var(--ink-2); }
.rec-links .k { font: 8.5px ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.rec-links .ftitle { min-width: 0; overflow-wrap: anywhere; color: var(--muted); }
.rlink {
  font: 600 10px ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace; letter-spacing: .04em;
  border: 1px solid var(--hairline); background: var(--surface); color: var(--ink); border-radius: 5px;
  padding: 2px 7px; cursor: pointer; max-width: 100%; text-align: left; overflow-wrap: anywhere; transition: background .15s, border-color .15s;
}
.rlink:hover { background: var(--chip-wash); border-color: var(--ink-2); }
.rlink.plain { cursor: default; color: var(--muted); border-style: dashed; background: transparent; }
.rlink.plain:hover { background: transparent; border-color: var(--hairline); }
.disposition { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 6px; margin-top: 9px; padding-top: 7px; border-top: 1px dashed var(--hairline); font-size: 11px; color: var(--ink-2); }
.ops-links { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.ops-links .rlink { font-size: 11px; }
.rel-list { position: relative; display: flex; flex-direction: column; gap: 12px; padding-left: 24px; max-width: 980px; }
.rel-list::before { content: ""; position: absolute; left: 7px; top: 12px; bottom: 12px; width: 2px; background: var(--hairline); border-radius: 1px; }
.card.rel { position: relative; padding: 11px 14px 12px; }
.card.rel::before {
  content: ""; position: absolute; left: -25px; top: 15px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--stage-color, var(--muted)); box-shadow: 0 0 0 3px var(--page);
}
.rel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.rel-head .rel-date { font: 10px ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace; color: var(--ink-2); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.rel-head .badges { margin-left: auto; }
.deliveries { margin-top: 9px; border-top: 1px solid var(--hairline); }
.delivery {
  display: flex; flex-wrap: wrap; align-items: center; column-gap: 7px; row-gap: 2px; padding: 5px 0; border-bottom: 1px solid var(--hairline);
  font: 10.5px/1.4 ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace; color: var(--ink-2); min-width: 0;
}
.delivery:last-child { border-bottom: 0; padding-bottom: 0; }
.delivery .sep { color: var(--muted); }
.delivery .d-app { color: var(--ink); font-weight: 600; }
.delivery .d-version { min-width: 0; overflow-wrap: anywhere; }
.delivery .d-out { display: inline-flex; align-items: center; gap: 5px; margin-left: auto; font-weight: 700; color: color-mix(in srgb, var(--c, var(--context)) 72%, var(--ink)); }
.delivery .d-out i { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--context)); }
.rec-row {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: 6px;
  background: transparent; color: inherit; font: inherit; font-size: 12px; text-align: left; cursor: pointer;
}
.rec-row:hover { background: var(--chip-wash); }
.rec-row .rid { flex: none; font: 600 10px ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace; letter-spacing: .04em; color: var(--ink-2); }
.rec-row .rtitle { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.rec-row .badge { flex: none; }
.fact-rows .fact-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 7px 0; border-top: 1px solid var(--hairline); font: 11px/1.45 ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace; overflow-wrap: anywhere; }
.fact-rows .fact-row:first-child { border-top: 0; padding-top: 0; }
.fact-row .sep { color: var(--muted); }
.panel-text { font-size: 12.5px; line-height: 1.55; color: var(--ink-2); overflow-wrap: anywhere; }
.panel-note { padding: 9px 11px; border-left: 3px solid var(--warning); background: color-mix(in srgb, var(--warning) 9%, transparent); color: var(--ink-2); font-size: 11.5px; line-height: 1.45; border-radius: 0 6px 6px 0; }
.panel-links { display: flex; flex-wrap: wrap; gap: 6px; }
.timeline { list-style: none; border-left: 2px solid var(--hairline); margin-left: 3px; }
.timeline li { position: relative; padding: 0 0 10px 12px; font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
.timeline li:last-child { padding-bottom: 0; }
.timeline li::before { content: ""; position: absolute; left: -6px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.timeline .when { display: block; font: 9.5px ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace; letter-spacing: .06em; color: var(--muted); margin-bottom: 1px; }
.meta { min-width: 0; }
.meta .v { overflow-wrap: anywhere; }
.meta .v .rlink { font-size: 11px; }
.panel-empty { font-size: 12px; color: var(--muted); }

/* ---------- copy-only transition preview ---------- */
.transition-backdrop {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  padding: 18px; background: rgba(0,0,0,.58); backdrop-filter: blur(4px);
}
.transition-backdrop[hidden] { display: none; }
.transition-dialog {
  width: min(640px, 100%); max-height: min(88vh, 760px); overflow: auto;
  border: 1px solid var(--hairline); border-radius: 12px; background: var(--surface);
  box-shadow: 0 18px 70px rgba(0,0,0,.42); color: var(--ink); display: flex; flex-direction: column; overflow: hidden;
}
.transition-dialog:focus { outline: 2px solid var(--po); outline-offset: 3px; }
.transition-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--hairline); }
.transition-head .eyebrow { color: var(--po); font: 700 9px ui-monospace, Consolas, monospace; letter-spacing: .2em; text-transform: uppercase; }
.transition-head h2 { margin-top: 6px; font-size: 20px; letter-spacing: -.02em; }
.transition-head p { margin-top: 5px; color: var(--ink-2); font-size: 12px; line-height: 1.5; }
.transition-body { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 14px; overflow: auto; min-height: 0; }
.transition-stale { padding: 9px 11px; border-left: 3px solid var(--warning); background: color-mix(in srgb, var(--warning) 9%, transparent); color: var(--warning); font-size: 11.5px; line-height: 1.45; }
.transition-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.transition-fact { border: 1px solid var(--hairline); border-radius: 7px; padding: 8px 10px; min-width: 0; }
.transition-fact .k { color: var(--muted); font: 8.5px ui-monospace, Consolas, monospace; letter-spacing: .16em; text-transform: uppercase; }
.transition-fact .v { margin-top: 4px; color: var(--ink); font-size: 12px; overflow-wrap: anywhere; }
.transition-section h4 { margin-bottom: 7px; color: var(--muted); font: 700 9px ui-monospace, Consolas, monospace; letter-spacing: .2em; text-transform: uppercase; }
.transition-surface-picker { display: flex; flex-direction: column; gap: 7px; }
.transition-surfaces { align-self: flex-start; }
.transition-surfaces button { color: var(--muted); }
.transition-surfaces button.active { color: var(--ink); background: var(--page); font-weight: 700; }
.transition-surfaces button[aria-disabled="true"] { cursor: help; opacity: .55; }
.transition-check { display: flex; gap: 8px; align-items: flex-start; padding: 7px 0; border-top: 1px solid var(--hairline); font-size: 11.5px; line-height: 1.45; }
.transition-check .check-status { flex: none; min-width: 58px; color: var(--good); font: 700 8.5px ui-monospace, Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; }
.transition-check.blocked .check-status { color: var(--critical); }
.transition-check.unknown .check-status, .transition-check.review .check-status, .transition-check.warning .check-status { color: var(--warning); }
.transition-check .check-copy { min-width: 0; color: var(--ink-2); overflow-wrap: anywhere; }
.transition-check code { color: var(--muted); font-size: 10px; }
.transition-request { border: 1px solid var(--hairline); border-radius: 8px; background: var(--page); padding: 10px; }
.transition-request .request-label { color: var(--muted); font: 8.5px ui-monospace, Consolas, monospace; letter-spacing: .18em; text-transform: uppercase; }
.transition-request pre { margin-top: 7px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); font: 11px/1.55 ui-monospace, Consolas, monospace; user-select: text; }
.connected-review { border: 1px solid var(--hairline); border-radius: 8px; padding: 10px; font-size: 11.5px; line-height: 1.45; }
.connected-review label { display: flex; gap: 8px; align-items: flex-start; color: var(--ink-2); }
.connected-review input { margin-top: 2px; accent-color: var(--po); }
.connected-review textarea { width: 100%; min-height: 68px; margin-top: 8px; resize: vertical; border: 1px solid var(--hairline); border-radius: 6px; padding: 8px; background: var(--page); color: var(--ink); font: 11px/1.45 ui-monospace, Consolas, monospace; }
.connected-write { border: 1px solid var(--hairline); border-radius: 7px; overflow: hidden; }
.connected-write summary { padding: 8px 10px; background: var(--page); cursor: pointer; font: 10px ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
.connected-write-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--hairline); }
.connected-write-grid > div { min-width: 0; padding: 8px; }
.connected-write-grid > div + div { border-left: 1px solid var(--hairline); }
.connected-write-grid h5 { margin: 0 0 6px; color: var(--muted); font: 8.5px ui-monospace, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; }
.connected-write-grid pre { max-height: 220px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); font: 10px/1.45 ui-monospace, Consolas, monospace; user-select: text; }
.board-session { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 9px; letter-spacing: .07em; }
.board-session button { border: 1px solid var(--hairline); border-radius: 5px; padding: 4px 7px; background: transparent; color: var(--ink-2); cursor: pointer; font: inherit; }
.board-session button:hover { background: var(--chip-wash); color: var(--ink); }
.board-session .actor { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.transition-copy-status { min-height: 16px; margin-top: 7px; color: var(--warning); font-size: 11px; line-height: 1.4; }
.transition-actions { display: flex; justify-content: flex-end; gap: 8px; align-items: center; flex-wrap: wrap; flex: none; padding: 12px 20px; border-top: 1px solid var(--hairline); background: var(--surface); }
.transition-actions button { min-height: 34px; }
.transition-actions .cancel-btn { border: 1px solid var(--hairline); background: transparent; color: var(--ink-2); border-radius: 6px; padding: 8px 14px; cursor: pointer; font: 700 9px ui-monospace, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; }
.transition-actions .cancel-btn:hover { background: var(--chip-wash); color: var(--ink); }
.transition-actions .copy-request[aria-disabled="true"] { color: var(--muted); border-color: var(--hairline); cursor: not-allowed; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

/* ---------- statusline (in flow: nothing can overlap it) ---------- */
.statusline {
  flex: none; display: flex; align-items: center; gap: 18px;
  height: 30px; padding: 0 20px; z-index: 31;
  border-top: 1px solid var(--hairline);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  cursor: pointer; user-select: none; white-space: nowrap; overflow: hidden;
}
.statusline .sev-clean { color: var(--good); font-weight: 700; }
.statusline .sev-error { color: var(--critical); font-weight: 700; }
.statusline .sev-warning { color: var(--warning); font-weight: 700; }
.statusline .right { margin-left: auto; display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
.diagpanel {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 42vh; z-index: 26; overflow: auto;
  background: color-mix(in srgb, var(--surface) 97%, transparent); border-top: 1px solid var(--hairline);
  transform: translateY(102%); transition: transform .3s cubic-bezier(.25,.9,.3,1); padding: 12px 20px;
  backdrop-filter: blur(10px); visibility: hidden;
}
.diagpanel.open { transform: none; visibility: visible; }
.diag { display: flex; gap: 12px; align-items: baseline; padding: 5px 0; font-size: 11px; border-bottom: 1px solid var(--hairline); }
.diag .sev { font-size: 8.5px; font-weight: 700; letter-spacing: .16em; min-width: 62px; text-transform: uppercase; }
.diag .sev.error { color: var(--critical); } .diag .sev.warning { color: var(--warning); }
.diag .code { color: var(--ink-2); min-width: 210px; font-size: 10px; }
.diag .msg { color: var(--ink-2); flex: 1; font-family: system-ui, sans-serif; font-size: 11.5px; }

.toast {
  position: fixed; top: 14px; left: 50%; transform: translate(-50%, -70px); z-index: 40;
  background: var(--surface); border: 1px solid var(--hairline); color: var(--ink);
  border-radius: 6px; padding: 8px 16px; font-size: 11px; letter-spacing: .04em;
  transition: transform .4s cubic-bezier(.2,.9,.3,1.3);
  box-shadow: 0 8px 30px rgba(0,0,0,.28);
  font-family: ui-monospace, Consolas, monospace;
}
.toast.show { transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .pipe-spark { display: none; }
}

@media (max-width: 700px) {
  header { flex-wrap: wrap; padding: 10px 12px 8px; gap: 8px 10px; }
  .project-name { flex: 1 1 90px; }
  .header-right { flex: 1 0 100%; justify-content: flex-end; margin-left: 0; gap: 12px; }

  .statrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 10px 12px 4px; }
  .stat { min-width: 0; padding: 8px 9px 9px; }

  .stat .value { font-size: 22px; }
  .stat .sub { font-size: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stagebar { grid-column: 1 / -1; min-width: 0; padding: 7px 2px; }
  .stagebar .legendline { gap: 8px; font-size: 7.5px; }

  .toolbar { padding: 8px 12px; gap: 8px; }
  .views { flex: 1 1 100%; }
  .views button { flex: 1 0 auto; padding: 8px 8px; letter-spacing: .06em; font-size: 9.5px; }
  .chips { width: 100%; }
  .search { flex: 1 1 100%; min-width: 0; margin-left: 0; }
  .search input { width: 100%; min-width: 0; }

  .rec-toolbar { gap: 8px; }

  .rec-count { margin-left: 0; flex: 1 1 100%; }
  .rel-list { padding-left: 20px; }

  .rel-head .badges { margin-left: 0; flex: 1 1 100%; }

  .board { grid-auto-flow: column; grid-auto-columns: minmax(236px, 74vw); grid-template-columns: none; width: max-content; min-width: 100%; min-height: auto; }
  .column { min-width: 236px; min-height: 0; }

  .transition-backdrop { padding: 10px; }

  .statusline { gap: 8px; padding: 0 12px; font-size: 8px; }
  .statusline > span:nth-child(2) { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .statusline .right { gap: 8px; }
}

  boardCsrf: null,
  boardDiscover: null,
  boardCapability: null,
  boardPendingOperations: [],

// Declared before the theme initializer runs — the boot render path touches these.
let graph = null;
let sparkRAF = null;

function intakeFacts() { return state.data.facts.intake || { pending: [], quarantined: [] }; }
function featureNodes() { return state.data.facts.nodes.filter(n => n.type === "feature"); }

}
const ACTION_LABELS = {
  "po-specify": "specification",
  "po-handoff": "handoff",
  "design-start": "design start",
  "design-ui-done": "UI design",
  "tech-design-done": "technical design",
  "design-handoff": "development handoff",
  "dev-start": "development start",
  "dev-done": "delivery",
  "qa-verify": "QA verification",
  "qa-pass": "QA pass",
  "qa-fail": "QA failure",
  "dev-return-spec": "return to specification",
  "dev-return-design": "return to design",
  "qa-return-spec": "QA return to specification",
  "qa-return-design": "QA return to design",
  "release-done": "release",
  "release-return-dev": "return to development after a failed release",
  "release-rollback": "rollback",

}

}

}
// The column a card is dropped on to request the action.
function actionDropStage(action) {

}
function contractMatches(contract, record) {

}
const BOARD_SESSION_EXPIRED = "The board session has expired. Reconnect to continue this connected action.";
// A human runs a direct action in the board; an agent proposes every other action.
function connectedHumanActionKnown(action) {

}
function connectedAgentActionKnown(action) {

}
// The direct human action a feature at this status offers, or "".
function connectedHumanActionForStatus(status) {

}

/* JS-driven spark: travels BEHIND the circles and lights each stage it passes. */
function startSpark() {
  if (sparkRAF) { cancelAnimationFrame(sparkRAF); sparkRAF = null; }
  if (REDUCED) return;
  const track = document.querySelector("#firstrun-view .pipe-track");
  const spark = track ? track.querySelector(".pipe-spark") : null;
  if (!track || !spark) return;
  const PERIOD = 7000, LIT_RADIUS = 30;
  const t0 = performance.now();
  (function frame(now) {
    if (!track.isConnected) { sparkRAF = null; return; }
    const stages = track.querySelectorAll(".pipe-stage");
    if (!stages.length) { sparkRAF = null; return; }
    const phase = ((now - t0) % PERIOD) / PERIOD;
    const first = stages[0], last = stages[stages.length - 1];
    const startX = first.offsetLeft + first.offsetWidth / 2;
    const endX = last.offsetLeft + last.offsetWidth / 2;
    const x = startX + (endX - startX) * phase;
    spark.style.left = x + "px";
    spark.style.opacity = phase < 0.03 || phase > 0.97 ? "0" : "0.85";
    stages.forEach(stage => {
      const cx = stage.offsetLeft + stage.offsetWidth / 2;
      stage.classList.toggle("lit", Math.abs(cx - x) < LIT_RADIUS);
    });
    sparkRAF = requestAnimationFrame(frame);
  })(t0);
}

/* ==================== render everything; guide is just a view ==================== */
// A render replaces the markup of the board, the app lanes, the record views, the session bar and the other regions, so the element that
// had keyboard focus is gone afterwards and the browser moves focus to the page. The render records what had focus by a
// stable identity (the region, the card or chip it sits on, and which control on it) and puts focus back on the
// replacement. If the control or card no longer exists, focus goes to the card's column and then to the region, never
// to the page. Focus inside a dialog is left to the dialog's own restore. The open panel is a region too: a live update
// re-renders it, and `adoptData` wraps that render in the same capture and restore.
const FOCUS_REGION_SELECTOR = "#board-view, #app-view, #bugs-view, #releases-view, #incidents-view, #board-session, #type-chips, #statrow, #graph-legend, #statusline, #firstrun-view, #panel";

  }

}
function focusOwnerKey(owner) {
  const kind = owner.classList.contains("fchip") ? "chip" : "card";
  if (owner.dataset.recordId !== undefined) return kind + "\u0000record:" + owner.dataset.recordId;
  return kind + "\u0000" + (owner.dataset.id !== undefined ? "id:" + owner.dataset.id : "intake:" + owner.dataset.intake + "/" + owner.dataset.name);
}

  const region = el.closest(FOCUS_REGION_SELECTOR);
  if (!region) return null;
  const owner = el.closest(FOCUS_OWNER_SELECTOR);
  const column = el.closest(".column[data-stage]");
  const signature = focusSignature(el);
  const scope = owner || region;
  return {
    regionId: region.id,
    ownerKey: owner ? focusOwnerKey(owner) : null,
    isOwner: owner === el,
    tag: el.tagName,
    signature,
    ordinal: Array.from(scope.querySelectorAll(el.tagName)).filter(candidate => focusSignature(candidate) === signature).indexOf(el),
    stage: column ? column.dataset.stage : null,

}
function restoreRenderFocus(saved) {

  const region = document.getElementById(saved.regionId);
  if (!region) return;
  const owner = saved.ownerKey ? Array.from(region.querySelectorAll(FOCUS_OWNER_SELECTOR)).find(item => focusOwnerKey(item) === saved.ownerKey) : null;
  const candidates = [];
  if (owner) {
    if (saved.isOwner) candidates.push(owner);
    else candidates.push(Array.from(owner.querySelectorAll(saved.tag)).filter(item => focusSignature(item) === saved.signature)[saved.ordinal]);
    candidates.push(owner);
  } else if (saved.ownerKey) {
    const column = saved.stage ? Array.from(region.querySelectorAll(".column[data-stage]")).find(item => item.dataset.stage === saved.stage) : null;
    if (column) candidates.push(column.querySelector(".card[data-id]"), column.querySelector(".card[data-record-id]"), column);
  } else {
    candidates.push(Array.from(region.querySelectorAll(saved.tag)).filter(item => focusSignature(item) === saved.signature)[saved.ordinal]);

function tickValue(el, target) {

    `<div class="stat"${view ? ` data-goto="${view}" aria-label="${escapeHtml(`${label}: ${value}${sub ? ", " + sub : ""}. Open the ${view} view.`)}"` : ""}><div class="label">${escapeHtml(label)}</div><div class="value${alert ? " alert" : ""}" data-tick="${value}">0</div><div class="sub">${escapeHtml(sub || "")}</div></div>`;
  let html = "";
  html += stat("Intake", intake.pending.length + intake.quarantined.length,
    intake.quarantined.length ? `${intake.quarantined.length} quarantined` : "ideas waiting", intake.quarantined.length > 0);
  html += stat("Features", feats.length, `${state.data.facts.edge_count} connections`);
  html += stat("In flight", inFlight, "design to release");
  html += stat("Blocked", blockedIds.size, blockedIds.size ? "needs attention" : "clear", blockedIds.size > 0);
  html += stat("Released", done, done ? "delivered" : "");
  const openBugs = recordList("bugs").filter(bug => OPEN_BUG_STATUSES.has(bug.status));
  const blockingBugs = openBugs.filter(bug => bug.blocking === true);
  const openIncidents = recordList("incidents").filter(incident => incident.status !== "resolved");
  const mitigated = openIncidents.filter(incident => incident.status === "mitigated").length;
  html += stat("Open bugs", openBugs.length, blockingBugs.length ? `${blockingBugs.length} blocking` : openBugs.length ? "none blocking" : "clear", blockingBugs.length > 0, "bugs");
  html += stat("Open incidents", openIncidents.length, mitigated ? `${mitigated} mitigated` : openIncidents.length ? "needs attention" : "clear", openIncidents.length > mitigated, "incidents");
  if (malformedCount) html += stat("Integrity", malformedCount, "malformed pages", true);

  html += `<div class="stagebar"><div class="bars">${segs}</div><div class="legendline">${legend}<span style="margin-left:auto">${total} FEATURE${total === 1 ? "" : "S"} ACROSS THE LIFECYCLE</span></div></div>`;

/* ==================== graph view ==================== */
function visibleGraphData() {
  const nodes = state.data.facts.nodes.filter(n => state.visibleTypes.has(n.type));
  const ids = new Set(nodes.map(n => n.id));
  const links = state.data.facts.edges.filter(e => ids.has(e.source) && ids.has(e.target)).map(e => ({ ...e }));

    (node.type === "feature" && scale > 1.05) || (node.type !== "feature" && scale > 1.5);
  if (showLabel && alpha > 0.5) {
    const label = node.type === "feature" ? node.id : (node.title || node.id);
    const size = Math.max(10.5 / scale, 2.4);
    const ly = node.y + r + 2.5 / scale + 1.5;
    ctx.font = `600 ${size}px ui-monospace, Consolas, monospace`;
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.lineWidth = Math.max(3 / scale, 1.2); ctx.lineJoin = "round";
    ctx.strokeStyle = C.surface;
    ctx.strokeText(label, node.x, ly);
    ctx.fillStyle = C.ink2;
    ctx.fillText(label, node.x, ly);
    if (focused && node.type === "feature" && node.title) {
      ctx.font = `700 ${size}px system-ui, sans-serif`;
      ctx.strokeText(node.title, node.x, ly + size * 1.25);
      ctx.fillStyle = C.ink;
      ctx.fillText(node.title, node.x, ly + size * 1.25);

}
function initGraph() {
  const el = document.getElementById("graph-canvas");

    .backgroundColor("rgba(0,0,0,0)")
    .nodeId("id")
    .nodeVal(n => nodeRadius(n))
    .nodeLabel(() => "")
    .nodeCanvasObject((node, ctx, scale) => paintNode(node, ctx, scale))
    .nodePointerAreaPaint((node, color, ctx) => {
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(node.x, node.y, nodeRadius(node) + 6, 0, 2 * Math.PI); ctx.fill();
    })
    .linkColor(link => {
      const focus = state.hovered || state.selected;
      const s = link.source.id || link.source, t = link.target.id || link.target;
      if (focus && (s === focus || t === focus)) return phaseColor(nodesById[s] || {});
      return state.theme === "dark" ? "rgba(137,135,129,0.28)" : "rgba(137,135,129,0.38)";
    })
    .linkWidth(link => {
      const focus = state.hovered || state.selected;
      const s = link.source.id || link.source, t = link.target.id || link.target;
      return focus && (s === focus || t === focus) ? 1.8 : 0.7;
    })
    .linkDirectionalParticles(link => {
      if (REDUCED) return 0;

    })
    .linkDirectionalParticleWidth(2.2)
    .linkDirectionalParticleSpeed(0.006)
    .onNodeHover(node => {
      state.hovered = node ? node.id : null;
      el.style.cursor = node ? "pointer" : "";
    })
    .onNodeClick(node => { selectNode(node.id); })
    .onBackgroundClick(() => { closePanel(); })
    .autoPauseRedraw(false)
    .d3AlphaDecay(0.015)
    .d3VelocityDecay(0.28);
  graph.d3Force("charge").strength(-160).distanceMax(320);

}
function sizeGraph() {
  const el = document.getElementById("graph-view");

}
function applyGraphData(first) {
  if (!graph) return;
  const data = visibleGraphData();
  if (!first) {
    const old = {}; graph.graphData().nodes.forEach(n => old[n.id] = n);
    data.nodes.forEach(n => {
      const prev = old[n.id];
      if (prev) { n.x = prev.x; n.y = prev.y; n.vx = prev.vx; n.vy = prev.vy; }
    });
    state.mountedAt = Math.min(state.mountedAt, performance.now() - 700);
  }
  data.nodes.forEach((n, i) => { n.__seq = i; });
  graph.graphData(data);
  // small graphs need gentler repulsion or disconnected nodes fly off-canvas
  const nodeCount = data.nodes.length;
  graph.d3Force("charge").strength(nodeCount < 20 ? -90 : -160).distanceMax(nodeCount < 20 ? 200 : 320);
  const linkForce = graph.d3Force("link");
  if (linkForce && linkForce.distance) linkForce.distance(58);
  const empty = document.getElementById("empty-state");
  empty.hidden = nodeCount > 0;
  empty.innerHTML = '<div><div style="font-size:36px;opacity:.5;margin-bottom:10px">◇</div><div>Nothing matches the current filters.</div></div>';
  // re-frame after the physics settle — on first load AND after filter changes

}
function focusNode(id) {
  const node = graph.graphData().nodes.find(n => n.id === id);

  graph.centerAt(node.x, node.y, REDUCED ? 0 : 700);
  graph.zoom(Math.max(2.2, graph.zoom()), REDUCED ? 0 : 700);
}

/* ==================== per-app stages, design tracks and operations ==================== */
// The apps of a feature's scope with the stage of each: an active app carries a stage, and so does a retired app of a released
// feature when it took part in the release (evidence rows, a release record or archived history rows); a retired app without a stage is marked as retired.
function featureAppRows(node) {
  const stages = Array.isArray(node && node.app_stages) ? node.app_stages : null;
  if (!stages) return [];
  const isRetired = app => { const appNode = nodesById["app:" + app]; return !!appNode && appNode.status === "retired"; };
  const rows = stages.map(entry => ({ app: String(entry.app), stage: String(entry.stage), retired: isRetired(String(entry.app)) }));
  const listed = new Set(rows.map(row => row.app));
  const retired = state.data.facts.edges
    .filter(edge => edge.kind === "targets" && edge.source === node.id && String(edge.target).startsWith("app:"))
    .map(edge => ({ app: String(edge.target).slice("app:".length), appNode: nodesById[edge.target] }))
    .filter(item => !listed.has(item.app) && item.appNode && item.appNode.status === "retired")
    .map(item => ({ app: item.app, stage: "", retired: true }));
  return rows.concat(retired);
}
function appStageHtml(row) {
  const head = `<span class="as-head"><span class="as-name" title="${escapeHtml(row.app)}">${escapeHtml(boundedText(row.app, 80))}</span><span class="sep">·</span></span>`;
  if (row.retired && !row.stage) return `<div class="app-stage retired">${head}<span class="as-stage">retired</span></div>`;
  const color = C[STAGE_PHASE[row.stage]] || C.muted;
  const retiredMark = row.retired ? '<span class="sep">·</span><span class="as-stage">retired</span>' : "";
  return `<div class="app-stage${row.retired ? " retired" : ""}"><i style="background:${color}"></i>${head}<span class="as-stage" title="${escapeHtml(row.stage)}">${escapeHtml(boundedText(row.stage, 40))}</span>${retiredMark}</div>`;
}
// A card lists the apps that carry a stage in a feature in development or later; the panel adds the retired apps without one.
function cardAppStagesHtml(node) {
  const rows = featureAppRows(node).filter(row => row.stage);
  return rows.length ? `<div class="app-stages" data-app-stages="${escapeHtml(node.id)}">${rows.map(appStageHtml).join("")}</div>` : "";
}
function designTrackStates(node) {
  const tracks = node && node.design_tracks;
  if (!tracks || typeof tracks !== "object") return [];
  return ["ui", "technical"].filter(track => typeof tracks[track] === "string").map(track => ({ track, state: tracks[track] }));
}
function designTracksHtml(node) {
  const tracks = designTrackStates(node);
  return tracks.length
    ? `<div class="design-tracks" data-design-tracks="${escapeHtml(node.id)}">${tracks.map(item => `<div class="design-track"><span>${escapeHtml(item.track)}</span><span class="sep">·</span><span>${escapeHtml(boundedText(item.state, 40))}</span></div>`).join("")}</div>`
    : "";
}
function appOperationsRow(appId) {
  const rows = state.data.facts.app_operations;
  return Array.isArray(rows) ? rows.find(row => row && row.app === appId) || null : null;
}
function appOperationsHtml(appId) {
  const row = appOperationsRow(appId);
  if (!row) return '<div class="ops-grid" data-app-operations="' + escapeHtml(appId) + '"><span class="none">Nothing released, recorded or open for this app.</span></div>';
  // A cell that lists IDs shows each as a link to its panel; an ID the page does not know stays plain text.
  const idLinks = cell => {
    const ids = String(cell === undefined || cell === null ? "" : cell).split(",").map(id => id.trim()).filter(id => id && id !== "—");
    return ids.length ? `<span class="ops-links">${ids.slice(0, 40).map(id => recordLinkHtml(id)).join("")}</span>` : "—";
  };
  const latest = row.latest_release && row.latest_release !== "—" ? `<span class="ops-links">${recordLinkHtml(row.latest_release)}</span> (${escapeHtml(boundedText(row.latest_outcome || "—", 40))})` : "—";
  const facts = [
    ["Released features", idLinks(row.released_features)],

    ["Open bugs", idLinks(row.open_bugs)],

  return `<div class="ops-grid" data-app-operations="${escapeHtml(appId)}">${facts.map(([k, v]) =>
    `<div class="ops-fact"><div class="k">${escapeHtml(k)}</div><div class="v">${v}</div></div>`).join("")}</div>`;
}

/* ==================== records: bugs, releases and incidents ==================== */
// The three record views and their panels are read-only. Every value is escaped, a text from the data is bounded, and a link opens
// the other record's panel (a feature opens its own panel); an ID the page does not know stays plain text.
function recordList(factsKey) {
  const list = state.data && state.data.facts && state.data.facts[factsKey];
  return Array.isArray(list) ? list.filter(item => item && typeof item === "object" && !Array.isArray(item) && item.id !== undefined && item.id !== null && String(item.id)) : [];
}
function recordKey(id) { return String(id === undefined || id === null ? "" : id).trim().toUpperCase(); }
function stringList(value) { return Array.isArray(value) ? value.filter(item => item !== undefined && item !== null).map(String) : []; }
function objectList(value) { return Array.isArray(value) ? value.filter(item => item && typeof item === "object" && !Array.isArray(item)) : []; }

function uniqueSorted(values) { return Array.from(new Set(values)).sort(); }
function labelOf(value, fallback) {
  const text = value === undefined || value === null ? "" : String(value).trim();
  return text ? boundedText(text, 60) : fallback;
}
// A bounded text with its full value in a title, for a title or a free-form cell the data does not bound.
function boundedSpan(value, limit, className) {
  const text = value === undefined || value === null || String(value).trim() === "" ? "—" : String(value);
  const shown = boundedText(text, limit);
  return `<span${className ? ` class="${className}"` : ""}${shown !== text ? ` title="${escapeHtml(boundedText(text, 600))}"` : ""}>${escapeHtml(shown)}</span>`;
}
function toneName(map, value) { return typeof value === "string" && Object.prototype.hasOwnProperty.call(map, value) ? map[value] : "context"; }
function toneStyle(map, value) { return "--c:var(--" + toneName(map, value) + ")"; }
function titleHtml(title) {
  const shown = boundedText(title, 140);
  return `<div class="ctitle"${shown !== title ? ` title="${escapeHtml(boundedText(title, 600))}"` : ""}>${escapeHtml(shown)}</div>`;
}
function recordTitle(record, fallback) { return record.title === undefined || record.title === null || String(record.title).trim() === "" ? fallback : String(record.title); }
function severityRank(value) { const index = SEVERITIES.indexOf(value); return index < 0 ? SEVERITIES.length : index; }
// Newest first: by date, then by record number.
function newestFirst(a, b) {
  const left = String(a.date || ""), right = String(b.date || "");
  return (right < left ? -1 : right > left ? 1 : 0) || recordNumber(b.id) - recordNumber(a.id);
}

function severityBadgeHtml(value) {
  const rank = SEVERITIES.indexOf(value);
  const pips = rank >= 0 ? `<span class="sev-pips" aria-hidden="true">${[0, 1, 2, 3].map(n => `<b${n >= rank ? ' class="on"' : ""}></b>`).join("")}</span>` : "";
  return `<span class="badge tone${value === "critical" ? " solid" : ""}" style="${toneStyle(SEVERITY_TONE, value)}" title="Severity">${pips}${escapeHtml(labelOf(value, "—"))}</span>`;
}
function toneBadgeHtml(text, map, value, title) {
  return `<span class="badge tone" style="${toneStyle(map, value)}"${title ? ` title="${escapeHtml(title)}"` : ""}>${escapeHtml(text)}</span>`;
}
function appTagsHtml(apps) {
  const list = stringList(apps);
  return list.length ? list.map(app => `<span class="app-tag" title="${escapeHtml(app)}"><i></i>${escapeHtml(boundedText(app, 40))}</span>`).join("") : '<span class="app-tag">no app</span>';
}
function recordLinkHtml(id, label) {
  const text = String(id === undefined || id === null ? "" : id);
  const shown = escapeHtml(boundedText(label === undefined ? text : label, 80));
  const entry = recordIndex.get(recordKey(text));
  if (entry) return `<button type="button" class="rlink" data-record-link="${escapeHtml(entry.record.id)}" aria-label="Open ${escapeHtml(boundedText(text, 80))}">${shown}</button>`;
  const featureId = featureLookup.get(recordKey(text));
  if (featureId !== undefined) return `<button type="button" class="rlink" data-node-link="${escapeHtml(featureId)}" aria-label="Open feature ${escapeHtml(boundedText(text, 80))}">${shown}</button>`;
  return `<span class="rlink plain" title="Not found on this page">${shown}</span>`;
}
function featureLinkHtml(id) {

  return recordLinkHtml(id) + (node && node.title ? `<span class="ftitle">${escapeHtml(boundedText(node.title, 48))}</span>` : "");
}
function linksRowHtml(label, ids) {
  const list = stringList(ids);
  return list.length ? `<div class="rec-links"><span class="k">${escapeHtml(label)}</span>${list.map(id => recordLinkHtml(id)).join("")}</div>` : "";
}
function recordsEmptyHtml(message, hint) {
  return `<div class="rec-empty"><div class="glyph">◇</div><div>${escapeHtml(message)}</div>${hint ? `<div class="hint">${escapeHtml(hint)}</div>` : ""}</div>`;
}
function filterSelectHtml(filter, label, ariaLabel, current, values) {
  return `<label class="rec-field"><span>${escapeHtml(label)}</span><select class="rec-select" data-records-filter="${escapeHtml(filter)}" aria-label="${escapeHtml(ariaLabel)}"><option value="">all</option>${values.map(value => `<option value="${escapeHtml(value)}"${value === current ? " selected" : ""}>${escapeHtml(boundedText(value, 80))}</option>`).join("")}</select></label>`;
}
function recordColumnsHtml(statuses, items, statusOf, toneMap, noun, cardHtml) {
  return statuses.map(status => {
    const inColumn = status === INVALID_COLUMN ? items.filter(item => !statuses.includes(statusOf(item))) : items.filter(item => statusOf(item) === status);
    return `<div class="column" data-stage="${escapeHtml(status)}"><h3 aria-label="${escapeHtml(noun + " status " + status)}"><i style="background:var(--${toneName(toneMap, status)})"></i>${escapeHtml(status)}<span class="count">${inColumn.length}</span></h3>${inColumn.map(cardHtml).join("") || '<span class="col-empty">none</span>'}</div>`;

  view.querySelectorAll("[data-record-id]").forEach(card => {
    card.addEventListener("click", e => {

  rootEl.querySelectorAll("[data-record-link]").forEach(el => open(el, () => selectRecord(el.dataset.recordLink)));
  rootEl.querySelectorAll("[data-node-link]").forEach(el => open(el, () => selectNode(el.dataset.nodeLink)));

/* ---------- bugs ---------- */
function bugCardHtml(bug, index) {
  const id = String(bug.id), title = recordTitle(bug, "Untitled bug"), invalid = bug.valid === false;
  const badges = [severityBadgeHtml(bug.severity)];
  if (bug.blocking === true) badges.push('<span class="badge blocked">blocking</span>');
  if (bug.deferred === true) badges.push('<span class="badge deferred">deferred</span>');
  if (bug.regression_of) badges.push(`<span class="badge tone" style="--c:var(--release)" title="${escapeHtml("Regression of " + bug.regression_of)}">regression</span>`);
  if (invalid) badges.push('<span class="badge advisory" title="Lint reports this bug page as invalid.">invalid</span>');
  const owner = labelOf(bug.owner, "—");
  const label = `Bug ${boundedText(id, 140)}: ${boundedText(title, 180)}; status ${labelOf(bug.status, "missing")}; severity ${labelOf(bug.severity, "missing")}${bug.blocking === true ? "; blocking" : ""}${invalid ? "; invalid page" : ""}`;
  let disposition = "";
  if (bug.close_reason === "wont-fix") disposition = "<span>won't fix</span>";
  else if (bug.close_reason === "duplicate") disposition = `<span>duplicate of</span>${bug.duplicate_of ? recordLinkHtml(bug.duplicate_of) : ""}`;
  else if (bug.close_reason === "promoted") disposition = `<span>promoted to</span>${bug.promoted_to ? recordLinkHtml(bug.promoted_to) : ""}`;
  return `<div class="card rec${invalid ? " invalid" : ""}" data-record-id="${escapeHtml(id)}" data-record-kind="bug" tabindex="0" role="group" aria-label="${escapeHtml(label)}" style="--stage-color:var(--${toneName(SEVERITY_TONE, bug.severity)});--stagger:${REDUCED ? 0 : index * 0.05}s">
    <div class="rec-idrow"><span class="cid">${escapeHtml(id)}</span></div>${titleHtml(title)}
    <div class="badges">${badges.join("")}</div>
    <div class="rec-meta">${appTagsHtml(bug.apps)}<span class="owner-chip" title="Owner">${escapeHtml(owner === "none" ? "no owner" : owner)}</span></div>
    ${bug.feature ? `<div class="rec-links"><span class="k">Feature</span>${featureLinkHtml(bug.feature)}</div>` : ""}
    ${disposition ? `<div class="disposition">${disposition}</div>` : ""}</div>`;
}
function renderBugs() {
  const view = document.getElementById("bugs-view");
  const all = recordList("bugs");
  if (!all.length) { view.innerHTML = recordsEmptyHtml("No bugs recorded.", "A bug page under knowledge/wiki/bugs/ shows up here."); return; }
  const apps = uniqueSorted(all.flatMap(bug => stringList(bug.apps)));
  if (!apps.includes(state.records.bugApp)) state.records.bugApp = "";
  const filters = state.records;
  // Blocking bugs first, then by severity, then by record number.
  const shown = all.filter(bug => (!filters.bugApp || stringList(bug.apps).includes(filters.bugApp)) && (!filters.bugBlocking || bug.blocking === true))
    .sort((a, b) => (b.blocking === true) - (a.blocking === true) || severityRank(a.severity) - severityRank(b.severity) || recordNumber(a.id) - recordNumber(b.id));
  const statuses = all.some(bug => !BUG_STATUSES.includes(bug.status)) ? BUG_STATUSES.concat([INVALID_COLUMN]) : BUG_STATUSES;
  const blockingCount = all.filter(bug => bug.blocking === true).length;
  view.innerHTML = `<div class="rec-toolbar">${filterSelectHtml("bugApp", "App", "Filter bugs by app", filters.bugApp, apps)}
      <button type="button" class="chip${filters.bugBlocking ? " on" : ""}" aria-pressed="${filters.bugBlocking ? "true" : "false"}" data-records-toggle="bugBlocking">Blocking only<span class="n">${blockingCount}</span></button>
      <span class="rec-count">${escapeHtml(countText(shown.length, all.length, "bug"))}</span></div>` +
    (shown.length ? `<div class="board">${recordColumnsHtml(statuses, shown, bug => bug.status, BUG_STATUS_TONE, "Bug", bugCardHtml)}</div>` : recordsEmptyHtml("No bugs match the filters."));
  bindRecordFilters(view, renderBugs);
  bindRecordCards(view);

/* ---------- releases ---------- */
function deliveryRowHtml(delivery) {

  return `<div class="delivery"${hint ? ` title="${escapeHtml(hint)}"` : ""}>${boundedSpan(delivery.app, 40, "d-app")}<span class="sep">·</span>${boundedSpan(delivery.target, 40)}<span class="sep">·</span>${boundedSpan(delivery.version, 60, "d-version")}<span class="d-out" style="${toneStyle(DELIVERY_TONE, delivery.outcome)}"><i></i>${escapeHtml(labelOf(delivery.outcome, "—"))}</span></div>`;
}

  return `<div class="card rec rel${invalid ? " invalid" : ""}" data-record-id="${escapeHtml(id)}" data-record-kind="release" tabindex="0" role="group" aria-label="${escapeHtml(label)}" style="--stage-color:var(--${toneName(OUTCOME_TONE, release.outcome)});--stagger:${REDUCED ? 0 : Math.min(index, 12) * 0.04}s">

    ${titleHtml(title)}

function renderReleases() {
  const view = document.getElementById("releases-view");
