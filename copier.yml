# One template, two layers. The hidden question `prism_layer` chooses what Copier renders:
#   workspace     template/       the knowledge base, the guidance, shared/ and docker-compose.yml
#   <stack>       packs/<stack>/  one app of that stack, under the repository root at {{ app_path }}
# The Prism CLI sets `prism_layer` and every answer of the layer. It runs the workspace layer once and an
# app layer once per scaffolded app, each with its own answers file, and `prism update` updates each layer
# from its own answers file.
_subdirectory: "{{ 'template' if prism_layer == 'workspace' else 'packs/' ~ prism_layer }}"
_templates_suffix: .jinja
_jinja_extensions:
  - jinja2_time.TimeExtension

_skip_if_exists:
  - .env

# Every entry applies to the workspace layer only: an app layer's paths are its own.
_exclude:
  - "{% if prism_layer == 'workspace' and 'spring-backend' not in stacks %}.env{% endif %}"
  - "{% if prism_layer == 'workspace' and 'spring-backend' not in stacks %}.env.example{% endif %}"
  - "{% if prism_layer == 'workspace' and 'spring-backend' not in stacks %}docker-compose.yml{% endif %}"
  # BEGIN generated by scripts/build-skill-layers.py: stack exclusions of the skill layers
  - "{% if prism_layer == 'workspace' and 'android-compose' not in stacks %}.agents/skills/android-build-verify{% endif %}"
  - "{% if prism_layer == 'workspace' and 'android-compose' not in stacks %}.claude/skills/android-build-verify{% endif %}"
