# =============================================================================
# Project Identity
# =============================================================================

project_name:
  type: str
  help: "Human-readable project name (e.g., My Awesome App)"
  validator: "{% if not project_name %}Project name is required{% endif %}"

project_slug:
  type: str
  help: "Lowercase slug for directories and packages (e.g., my-awesome-app)"
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$')) %}
    Project slug must start with a lowercase letter and contain lowercase letters, digits, and single hyphens.
    {% endif %}

package_identifier:
  type: str
  help: "Reverse-domain package identifier (e.g., com.example.myapp)"
  default: "com.example.{{ project_slug | replace('-', '') }}"
  validator: >-
    {% if not (package_identifier | regex_search('^[A-Za-z][A-Za-z0-9_]*(?:[.][A-Za-z][A-Za-z0-9_]*)+$')) %}
    Package identifier must have at least two dot-separated identifiers, each starting with a letter.
    {% endif %}
    {% for segment in package_identifier.split('.') %}
    {% if segment in ['as','break','class','continue','do','else','false','for','fun','if','in','interface','is','null','object','package','return','super','this','throw','true','try','typealias','typeof','val','var','when','while','abstract','assert','boolean','byte','case','catch','char','const','default','double','enum','extends','final','finally','float','goto','implements','import','instanceof','int','long','native','new','private','protected','public','short','static','strictfp','switch','synchronized','throws','transient','void','volatile'] %}
    Package identifier segments cannot be Kotlin or Java keywords.
    {% endif %}{% endfor %}

description:
  type: str
  help: "One-line project description"
  default: "A multi-platform application"

package_path:
  type: str
  help: "Package path derived from package identifier (used for directory names)"
  default: "{{ package_identifier | replace('.', '/') }}"
  when: false

ios_module_name:
  type: str
  help: "Valid Swift/Xcode module name derived from the project slug"
  default: "{{ project_slug | replace('-', ' ') | replace('_', ' ') | title | replace(' ', '') }}"
  when: false
  validator: >-
    {% if not (ios_module_name | regex_search('^[A-Za-z_][A-Za-z0-9_]*$')) %}
    iOS module name must be a valid Swift identifier.
    {% endif %}

# =============================================================================
# Platform Selection
# =============================================================================

platforms:
  type: yaml
  multiselect: true
  help: "Which platforms do you want to include?"
  choices:
    Spring Boot Backend: backend
    User-Facing Web App: web-user-app
    Admin Web Portal: web-admin-portal
    Android (Kotlin/Compose): mobile-android
    iOS (Swift/SwiftUI): mobile-ios
  default: "[backend, web-user-app, web-admin-portal, mobile-android, mobile-ios]"
  validator: "{% if not platforms %}At least one platform must be selected{% endif %}"

# =============================================================================
# Authentication
# =============================================================================

auth_methods:
  type: yaml
  multiselect: true
  help: "Which authentication methods do you want to support? Keep Username + Password selected; OAuth providers are additive."
  validator: "{% if 'password' not in auth_methods %}Prism currently requires Username + Password auth as the baseline sign-in method{% endif %}"
  choices:
    Username + Password (required): password
    Google OAuth: google
    Apple Sign-In: apple
    Facebook Login: facebook
    Microsoft Account: microsoft
  default: "[google, password]"

# =============================================================================
# Infrastructure
# =============================================================================

database:
  type: str
  help: "Which database do you want to use?"
  choices:
    PostgreSQL (Currently available): postgres
  default: postgres

supporting_services:
  type: yaml
  multiselect: true
  help: "Which optional supporting services do you want to include?"
  when: "{{ 'backend' in platforms }}"
  choices:
    Redis cache: redis
  default: "[]"

use_docker:
  type: bool
  help: "Include Docker Compose for local development?"
  default: true

# =============================================================================
# Deployment & Hosting
# =============================================================================

cloud_provider:
  type: str
  help: "Where should backend services be deployed?"
  choices:
    Azure (Currently available): azure
  default: azure

web_hosting:
  type: str
  help: "Where should web applications be deployed?"
  when: "{{ 'web-user-app' in platforms or 'web-admin-portal' in platforms }}"
  choices:
    Cloudflare via OpenNext (Currently available): cloudflare
  default: cloudflare

# =============================================================================
# Repository
# =============================================================================

github_org:
  type: str
  help: "GitHub organization or username (leave empty to skip)"
  default: ""
