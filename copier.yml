# =============================================================================
# Layer
# =============================================================================

prism_layer:
  type: str
  help: "Internal: the layer to generate, `workspace` or a stack with a pack. The Prism CLI always sets it."
  default: workspace
  choices:
    - workspace
    - spring-backend
    - nextjs-web
    - android-compose
    - ios-swiftui

# =============================================================================
# Project Identity (both layers)
# =============================================================================

project_name:
  type: str
  help: "Human-readable project name (e.g., My Awesome App)"
  validator: "{% if not project_name %}Project name is required{% endif %}"

project_slug:
  type: str
  help: "Lowercase slug for directories and packages (e.g., my-awesome-app)"
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$')) %}
    Project slug must start with a lowercase letter and contain lowercase letters, digits, and single hyphens.
    {% endif %}

reserved_identifiers:
  type: yaml
  help: "Kotlin and Java keywords that no package segment may be"
  default: "[as, break, class, continue, do, else, 'false', for, fun, if, in, interface, is, 'null', object, package, return, super, this, throw, 'true', try, typealias, typeof, val, var, when, while, abstract, assert, boolean, byte, case, catch, char, const, default, double, enum, extends, final, finally, float, goto, implements, import, instanceof, int, long, native, new, private, protected, public, short, static, strictfp, switch, synchronized, throws, transient, void, volatile]"
  when: false

package_identifier:
  type: str
  help: "Reverse-domain package identifier (e.g., com.example.myapp)"
  default: "com.example.{{ project_slug | replace('-', '') }}"
  validator: >-
    {% if not (package_identifier | regex_search('^[A-Za-z][A-Za-z0-9_]*(?:[.][A-Za-z][A-Za-z0-9_]*)+$')) %}
    Package identifier must have at least two dot-separated identifiers, each starting with a letter.
    {% endif %}
    {% for segment in package_identifier.split('.') %}
    {% if segment in reserved_identifiers %}
    Package identifier segments cannot be Kotlin or Java keywords.
    {% endif %}{% endfor %}

# =============================================================================
# Workspace layer
# =============================================================================

description:
  type: str
  help: "One-line project description"
  default: "A multi-platform application"
  when: "{{ prism_layer == 'workspace' }}"

stacks:
  type: yaml
  help: "Internal: the stacks of the scaffolded apps. The Prism CLI sets it."
  default: "[]"
  when: "{{ prism_layer == 'workspace' }}"

apps:
  type: yaml
  help: "Internal: the scaffolded apps, each with id, name, stack, path, audience and port. The Prism CLI sets it."
  default: "[]"
  when: "{{ prism_layer == 'workspace' }}"

# =============================================================================
# Pinned versions (packs/versions.yml)
# =============================================================================

pack_versions:
  type: yaml
  help: "Every pinned version, read from packs/versions.yml of the template"
  default: "{% include 'packs/versions.yml' %}"
  when: false

versions:
  type: yaml
  help: "The pinned versions of this layer's stack"
  default: "{{ pack_versions.get(prism_layer, {}) | tojson }}"
  when: false

# =============================================================================
# App layer: the app, and what derives from its ID
# =============================================================================

app_id:
  type: str
  help: "Stable app ID: lowercase letters, digits and single hyphens"
  default: ""
  when: "{{ prism_layer != 'workspace' }}"
  validator: >-
    {% if not (app_id | regex_search('^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$')) %}
    App ID must start with a lowercase letter and contain lowercase letters, digits, and single hyphens.
    {% endif %}

app_name:
  type: str
  help: "Display name of the app"
  default: "{{ app_id }}"
  when: "{{ prism_layer != 'workspace' }}"
  validator: "{% if not app_name %}App name is required{% endif %}"

app_path:
  type: str
  help: "App directory relative to the repository root"
  default: "{{ app_id }}"
  when: "{{ prism_layer != 'workspace' }}"
  validator: >-
    {% if not app_path or app_path.startswith('/') or '\\' in app_path or '..' in app_path.split('/') or '' in app_path.split('/') or '.' in app_path.split('/') %}
    App path must be a relative path with no empty, `.` or `..` segments.
    {% endif %}

audience:
  type: str
  help: "Free-text audience of the app (no gate reads it)"
  default: ""
  when: "{{ prism_layer != 'workspace' }}"

port:
  type: int
  help: "The port the app listens on, chosen once from its stack's range"
  default: 0
  when: "{{ prism_layer != 'workspace' }}"

app_package_segment:
  type: str
  help: "The app's package segment, derived from its ID"
  default: "{{ app_id | replace('-', '') }}"
  when: "{{ prism_layer != 'workspace' }}"
  validator: >-
    {% if not (app_package_segment | regex_search('^[A-Za-z][A-Za-z0-9_]*$')) %}
    The package segment must start with a letter.
    {% endif %}
    {% if app_package_segment in reserved_identifiers %}
    The package segment cannot be a Kotlin or Java keyword.
    {% endif %}

app_package:
  type: str
  help: "The package or bundle identifier of the app"
  default: "{{ package_identifier }}.{{ app_package_segment }}"
  when: "{{ prism_layer != 'workspace' }}"

app_package_path:
  type: str
  help: "The package as a directory path"
  default: "{{ app_package | replace('.', '/') }}"
  when: "{{ prism_layer != 'workspace' }}"

app_module_name:
  type: str
  help: "The module, target and class-name prefix of the app, derived from its ID"
  default: "{% for part in app_id.split('-') %}{{ part | capitalize }}{% endfor %}"
  when: "{{ prism_layer != 'workspace' }}"
  validator: >-
    {% if not (app_module_name | regex_search('^[A-Za-z_][A-Za-z0-9_]*$')) %}
    The module name must be a valid identifier.
    {% endif %}

ci_workflow_name:
  type: str
  help: "The display name of the app's CI workflow"
  default: "{{ app_name }} CI"
  when: "{{ prism_layer != 'workspace' }}"

ci_paths:
  type: yaml
  help: "The paths that trigger the app's CI workflow"
  default: "[\"{{ app_path }}/**\", \"shared/api-contracts/**\", \".github/workflows/{{ app_id }}.yml\"]"
  when: "{{ prism_layer != 'workspace' }}"
