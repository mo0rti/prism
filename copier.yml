  - "{% if prism_layer == 'workspace' and 'android-compose' not in stacks %}.agents/skills/android-conventions{% endif %}"
  - "{% if prism_layer == 'workspace' and 'android-compose' not in stacks %}.claude/skills/android-conventions{% endif %}"
  - "{% if prism_layer == 'workspace' and 'android-compose' not in stacks %}.agents/skills/android-feature-delivery{% endif %}"
  - "{% if prism_layer == 'workspace' and 'android-compose' not in stacks %}.claude/skills/android-feature-delivery{% endif %}"
  - "{% if prism_layer == 'workspace' and 'android-compose' not in stacks %}.agents/skills/android-testing{% endif %}"
  - "{% if prism_layer == 'workspace' and 'android-compose' not in stacks %}.claude/skills/android-testing{% endif %}"
  - "{% if prism_layer == 'workspace' and 'android-compose' not in stacks %}.agents/skills/compose-design-system{% endif %}"
  - "{% if prism_layer == 'workspace' and 'android-compose' not in stacks %}.claude/skills/compose-design-system{% endif %}"
  - "{% if prism_layer == 'workspace' and 'android-compose' not in stacks %}.claude/skills/deploy-device{% endif %}"
