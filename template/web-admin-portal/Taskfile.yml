version: "3"

tasks:
  install:
    desc: Install dependencies
    cmds:
      - npm install

  dev:
    desc: Start the admin web portal
    cmds:
      - npm run dev

  build:
    desc: Build the admin web portal
    cmds:
      - npm run build

  lint:
    desc: Lint the admin web portal
    cmds:
      - npm run lint

  typecheck:
    desc: Type-check the admin web portal
    cmds:
      - npm run typecheck

  test:
    desc: Run the current verification suite
    cmds:
      - npm run typecheck

  clean:
    desc: Clean Next.js artifacts
    cmds:
      - npm run clean
